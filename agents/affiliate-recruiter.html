## 1. What this agent gets you
A steady flow of affiliates who already rank for your category: listicles, comparison sites, YouTube reviewers and newsletters. It pitches them, onboards them and gets them to a first sale.

## 2. Who it is for / not for
For: ecommerce brands with an affiliate program (or ready to start one) and gross margin over 40%.
Not for: brands that only want coupon-site volume, or products under $20 AOV where commissions do not pay a publisher.

## 3. Setup checklist
- [ ] company-brain has run
- [ ] An affiliate platform with a signup link (Shopify Collabs is free on Shopify)
- [ ] A SERP API key (DataForSEO or Serper) and a free YouTube API key
- [ ] Edit config.yaml: category, competitors, max_commission_pct, signup_url
- [ ] `python3 scripts/check_setup.py`
Time: 20 minutes. API cost per weekly run: under $1 on pay-per-query SERP APIs.

## 4. First run
Claude Code: `Use affiliate-recruiter: find and score 25 affiliate prospects for <category> and draft pitches.`
ChatGPT / Codex: load SKILL.md, same message.
OpenClaw / Hermes: `run affiliate-recruiter "weekly recruiting batch"`

## 5. Schedule
- Claude Code: `/schedule every Wednesday 10am: run affiliate-recruiter weekly batch`, plus `/schedule daily 9am: affiliate-recruiter activation follow-ups`
- cron: `0 10 * * 3 cd /path/to/headcount && claude -p "run affiliate-recruiter weekly"`

## 6. What good output looks like
`examples/example-output.md`: commission set with a margin check, a scored prospect table with reasons, and a tier review.

## 7. Tuning
- `base_commission_pct`: leave null to use the category median; raise only to win A-tier listicles.
- `min_score_to_pitch`: 50 default; raise to 70 if reply rates fall.
- `first_sale_bonus_usd`: the biggest lever on activation.

## 8. Troubleshooting
1. **SERP shows only big retailers:** add long-tail queries ("best <category> for <use case>").
2. **No contacts found:** check About, Contact, "Work with us", newsletter reply-to, YouTube About tab. Do not guess emails.
3. **Joins but no sales:** run Step 7 activation; check their link is live.
4. **Coupon sites applying:** keep `allow_coupon_sites: false`, decline in the platform.
5. **YouTube quota errors:** search.list costs 100 units; cut queries to 50 a day.

## 9. Safety and platform rules
- Affiliates must disclose commissions clearly (FTC). It is in the onboarding kit.
- No asking for rankings or positive reviews. No paying for reviews.
- Pitches go out only after your yes; one follow-up; respect opt-outs forever.

# Connections: affiliate-recruiter

| What | Why | Where | Scopes | Cost | Env var |
|---|---|---|---|---|---|
| SERP API (pick one) | Who ranks for "best <category>" and competitor queries | DataForSEO (dataforseo.com), Serper (serper.dev), SerpApi (serpapi.com) | Search only | DataForSEO SERP is pay per request (fractions of a cent per query on standard queue; check current price). A weekly run of 40 queries costs well under $1 | `SERP_API_KEY` or `DATAFORSEO_LOGIN` + `DATAFORSEO_PASSWORD` |
| YouTube Data API v3 | Review videos and view counts | console.cloud.google.com | API key, public data. search.list 100 units, 10,000 units per day free | Free | `YOUTUBE_API_KEY` |
| Affiliate platform API | Roster, clicks, sales for tiers | Shopify Collabs (export CSV), Impact, Refersion, UpPromote, GoAffPro, Awin, PartnerStack: each in its settings | Read reports | Platform plan | `AFFILIATE_PLATFORM_TOKEN` (optional, CSV export works) |
| Email sending | Pitches and activation | Your own mailbox or ESP; the agent drafts only | n/a | n/a | none |

MCP servers in `mcp.json`: `dataforseo-mcp-server` (Apache-2.0, official DataForSEO) and `@playwright/mcp` (Apache-2.0) to read ranking pages and find contact pages. Remove DataForSEO if you use another SERP API.
Optional: your own treg account can supply SERP data. Direct APIs come first.
