## 1. What this agent gets you
A shortlist of UGC creators who can actually make ads for your product, each scored, priced fairly for their market, briefed and contract-ready. Then it tells you which ones to rebook based on real ad results.

## 2. Who it is for / not for
For: ecommerce brands running paid social who need 4 to 30 new creator videos a month.
Not for: buying reach or posts on a creator's own audience (use influencer-deal-desk), or brands with no paid ads (UGC pays back through ads).

## 3. Setup checklist
- [ ] company-brain has run (`brain/COMPANY.md` exists)
- [ ] Edit `config.yaml`: markets, niche_keywords, budget_per_video_usd
- [ ] Optional keys in CONNECT.md (Instagram Graph API is free and the most useful)
- [ ] `python3 scripts/check_setup.py`
Time: 15 minutes. API cost per run: $0 on free tiers. Your real cost is creator fees.

## 4. First run
Claude Code: `Use ugc-creator-finder: find 8 UGC creators for <product>, $300 per video all in.`
ChatGPT / Codex: paste SKILL.md as instructions (or install the skill), then the same message.
OpenClaw / Hermes: `run ugc-creator-finder "find 8 UGC creators for <product>"`

## 5. Running it on a schedule
- Claude Code: `/schedule monthly first Monday 9am: run ugc-creator-finder refill, then feedback pass`
- cron: `0 9 1-7 * 1 cd /path/to/headcount && claude -p "run ugc-creator-finder monthly refill"`
- Weekly feedback only: `0 9 * * 1 ... "run ugc-creator-finder step 9 feedback"`

## 6. What good output looks like
See `examples/example-output.md`: a ranked table with a reason per creator, all-in prices, a budget check and a short "needs your yes" list.

## 7. Tuning (the three that matter)
- `budget_per_video_usd`: offers above it stop for your yes.
- `usage_default`: 90-day paid is the sweet spot; perpetual nearly triples cost.
- `rubric_weights.hook`: raise after you have data showing hook rate drives your ROAS.

## 8. Troubleshooting
1. **Too few candidates:** add adjacent niche keywords; check `markets` is not too narrow.
2. **Everyone is tier B:** your bar may be right; raise budget to reach pro creators, or accept B for testing.
3. **Instagram hashtag search errors:** you hit 30 unique hashtags in 7 days. Wait or reuse the same tags.
4. **No replies:** check the first line references their own clip; send from a real person's address.
5. **Feedback says wait for everyone:** ads have under `min_spend_usd`. Let them spend first.

## 9. Safety and platform rules
- Outreach only through the creator's listed channel, max 20 new per day, one follow-up.
- No scraping behind logins. Official APIs or manual search first.
- Organic posts by creators must carry #ad or the platform's paid partnership label (FTC, ASA).
- Never use a creator's face or voice for AI variants without a signed likeness clause.
- Contracts and payments always need your yes.

# Connections: ugc-creator-finder

Nothing is required. Every channel has a manual fallback where the agent gives you the exact search and you paste results. Keys make it faster.

| What | Why | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| TikTok One (Creator Marketplace) | Verified creator search by country and category | tiktok.com/one with your TikTok Business account | UI is free. API needs TikTok partner approval, most brands do not have it | Free | `TIKTOK_BUSINESS_TOKEN` (only if you have partner API access) |
| Instagram Graph API | Hashtag search and business discovery on public business/creator profiles | developers.facebook.com: create an app, connect an Instagram professional account | `instagram_basic`, `pages_show_list`, `instagram_manage_insights` (for business discovery). Hashtag search limited to 30 unique tags per 7 days | Free | `META_ACCESS_TOKEN`, `IG_BUSINESS_ACCOUNT_ID` |
| X API v2 | Recent search for creators offering UGC | developer.x.com | Read (recent search) | Paid tier on X; check current price on developer.x.com before buying | `X_BEARER_TOKEN` |
| Web search API | Find link-in-bio portfolios (`site:linktr.ee ugc ...`) | Any provider you already use (Brave Search, Serper, SerpApi, Google Programmable Search) | Search only | Usually free tier covers a monthly run | `SEARCH_API_KEY` |
| Meta Ads / TikTok Ads reporting | Ad-level results for the feedback loop | Ads Manager export (CSV) works. API: Meta Marketing API with `ads_read` | Read only | Free | `META_ADS_TOKEN` (optional) |
| Apify (optional) | Paid fallback for public TikTok/IG search pages | apify.com, your own account | Actor runs | Pay per use, your account | `APIFY_TOKEN` |

MCP servers in `mcp.json`: `@playwright/mcp` (Apache-2.0, Microsoft) to open portfolio pages; `@apify/actors-mcp-server` (MIT) optional. Remove what you do not use.

Optional: a treg account (your own) can stand in for the search APIs. Direct APIs above are the primary path.

Never paste keys into chat. Put them in your shell profile or a `.env` your runtime loads.
