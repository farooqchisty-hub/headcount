## 1. What this agent gets you
Sales from your comments and DMs. Someone comments a keyword, gets a private message in seconds, a quick question, the right product and a checkout link. Hard cases go to you.

## 2. Who it is for / not for
For: brands selling products or bookings under about $300 on Instagram, Facebook or WhatsApp, with posts that get comments.
Not for: cold DMs to strangers (not allowed by Meta and not what this does), regulated health or finance advice, or anyone who wants to fake being a human.

## 3. Setup checklist
- [ ] company-brain done.
- [ ] Instagram professional account linked to a Meta app (CONNECT.md, 30 to 45 minutes the first time).
- [ ] A webhook endpoint (Cloudflare Worker or similar, 20 minutes with the agent's help).
- [ ] knowledge.json: products, real prices, checkout links, FAQs from your real policies (agent drafts it, you confirm, 15 minutes).
- [ ] `python3 scripts/dm_router.py --selftest` shows all PASS.
Cost: Meta messaging on Instagram and Messenger is free. WhatsApp template messages are billed by Meta. LLM cost is fractions of a cent per conversation (most replies come from the knowledge file).

## 4. First run
Claude Code / Codex / OpenClaw / Hermes:
> Run dm-closer setup. Build my knowledge file from COMPANY.md and my store, design a comment-to-DM funnel for my next reel with the keyword GUIDE, and show me the full message chain.

ChatGPT:
> Use the dm-closer skill. Here is my product list and FAQ page. Write the knowledge file and a keyword funnel for my next post.

## 5. Running it on a schedule
The funnel itself runs on webhooks, always on. Schedule two jobs:
- Hourly: follow-up check (`decide_followup` for conversations in "offered" stage).
- Monday 09:00: `Run dm-closer weekly funnel review` (Claude Code `/schedule`, cron `0 9 * * 1`, or the OpenClaw/Hermes scheduler).

## 6. What good output looks like
`examples/example-output.md`: a full conversation from keyword comment to checkout link, a refund that went to a human, and a weekly funnel report that finds the broken step.

## 7. Tuning (the 3 settings that matter)
- `funnels[].opener`: the first message decides the reply rate. Keep it link-free with 2 quick replies.
- `qualify.ask_before_offer`: turn off for single-product funnels; one less step.
- `auto_send`: start all false, then turn on `keyword_opener` and `faq_answer` after 20 clean approvals.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Comments arrive but no DM goes out | Check `instagram_business_manage_messages` scope and that the comment is under 7 days old; check `dm_sent` rate in the report |
| "signature invalid" | Endpoint is parsing the body before verifying. Pass the raw bytes and the header untouched |
| Error 10 or "outside of allowed window" | You tried to message after 24 h. Only a human with HUMAN_AGENT within 7 days, or a WhatsApp template |
| Clicks low (under 30%) | Shorten the offer message, price before link, one link |
| Bot answers wrong product | Add the words people really type to `keywords` in knowledge.json |

## 9. Safety and platform rules
- Messages only to people who commented or messaged first. One private reply per comment, within 7 days.
- Automated messages only inside 24 h of the person's last message. No bot use of the HUMAN_AGENT tag.
- Every "stop" honoured. A human is always reachable. The bot says it is automated when asked.
- No card details in chat. No invented prices, policies or discounts.
- Details: references/meta-messaging-policy.md.

# Connect: dm-closer

Keys live in env vars. The agent never prints them. Connect one channel to start (Instagram is the usual one).

| Env var | What it is | Where to get it | Scopes | Cost |
|---|---|---|---|---|
| `IG_ACCESS_TOKEN`, `IG_USER_ID` | Instagram professional account token | developers.facebook.com: Business app, add "Instagram API with Instagram Login", generate long-lived token (60 days, refreshable) | `instagram_business_basic`, `instagram_business_manage_messages`, `instagram_business_manage_comments` | Free |
| `FB_PAGE_ACCESS_TOKEN`, `FB_PAGE_ID` | Page token for Messenger | Same app, Messenger product | `pages_messaging`, `pages_manage_metadata`, `pages_read_engagement` | Free |
| `WA_ACCESS_TOKEN`, `WA_PHONE_NUMBER_ID` | WhatsApp Cloud API (optional) | business.facebook.com, WhatsApp Manager, add a number; system user token | `whatsapp_business_messaging`, `whatsapp_business_management` | Service replies inside 24 h: free. Templates: per-message Meta pricing by country and category |
| `META_APP_SECRET` | Verifies webhook signatures | App settings, Basic | n/a | n/a |
| `META_VERIFY_TOKEN` | Any random string you choose for the webhook handshake | You make it | n/a | n/a |
| `META_GRAPH_VERSION` | Graph API version, default v24.0 | Check developers.facebook.com/docs/graph-api/changelog | n/a | n/a |
| `SHOPIFY_STORE_DOMAIN` | Your store domain for cart permalinks and the Storefront MCP | Shopify admin | none for permalinks | Free |
| `STRIPE_SECRET_KEY` | Restricted key to create Payment Links (optional) | dashboard.stripe.com, Developers, API keys, create restricted key with Payment Links write | `payment_links: write`, `prices: read` | Stripe fees on sales only |
| `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET` | Payment Links (optional, India) | dashboard.razorpay.com, API keys | Payment Links | Razorpay fees on sales only |

## Webhook endpoint
You need a public HTTPS endpoint that receives Meta webhooks and calls `dm_router.py` (or a port of `decide()`). Options: a Cloudflare Worker, a Vercel or Netlify function, or an n8n webhook node running the script. It must answer the GET verification (`hub.challenge`) and return 200 to POSTs within a few seconds.

## MCP servers (mcp.json)
- `shopify-storefront`: Shopify's official Storefront MCP endpoint on your store (`/api/mcp`), for product and cart lookups. Official vendor server.
- `stripe`: Stripe's official remote MCP (`mcp.stripe.com`) for creating Payment Links. Official vendor server. Use a restricted key.
- Not used: unofficial Instagram DM libraries. They log in as you, break Meta terms and get accounts locked.

## Optional alternative
If you already pay for ManyChat or a similar Meta Business Partner, keep it for delivery and use this agent for the knowledge file, scripts, approval rules and weekly funnel review.
