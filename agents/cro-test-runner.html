## 1. What this agent gets you
More of your visitors buy. It finds where people drop off, tests fixes properly, and only ships changes that win a real A/B test.

## 2. Who it is for / not for
- For: stores and SaaS sites with at least about 30,000 visitors a month to the pages you want to improve, and PostHog or GA4 already installed.
- Not for: sites under about 10,000 visitors a month. Tests would take months. The agent will tell you this and switch to "fix obvious problems" mode.

## 3. Setup checklist
- [ ] PostHog personal API key and project id, or GA4 property plus a Google service account (CONNECT.md).
- [ ] A flag tool: PostHog (same key) or GrowthBook.
- [ ] Someone who can change the site theme or code, or give the agent a branch to work in.
- [ ] company-brain has been run.
- Time to set up: about 20 minutes.
- Cost per run: free within PostHog and GA4 free tiers. No paid APIs.

## 4. First run
Type this in Claude Code, ChatGPT, Codex, OpenClaw or Hermes, with this folder installed as a skill:

> Run cro-test-runner. Find my three biggest funnel leaks from the last 28 days, audit those pages, and give me a sized test backlog. Do not launch anything yet.

## 5. Running it on a schedule
- Claude Code: `/schedule` "every Monday 10:00, run cro-test-runner weekly cycle" and "every day 09:00, run cro-test-runner health check".
- cron: `0 10 * * 1 cd ~/headcount && claude -p "run cro-test-runner weekly cycle"`
- OpenClaw / Hermes: add the same two jobs in the scheduler with the prompts above.

## 6. What good output looks like
See `examples/example-input.md` and `examples/example-output.md`: a ranked leak list, a sized backlog where slow ideas are marked "not testable", and four test calls including one refused for peeking and one thrown out for a split problem.

## 7. Tuning (the 3 settings that matter)
- `default_mde_relative`: the smallest lift worth finding. Lower = longer tests. 0.10 is sane for most stores.
- `max_test_days`: tests that would run longer are not run. Raise to 56 only if your traffic is steady.
- `design`: `fixed` (simplest, no early calls) or `sequential` (allows planned early stops with stricter thresholds).

## 8. Troubleshooting
1. "Sample ratio mismatch": the split is uneven. Usually bots, a redirect in one arm, or the flag loading after the page. Fix and restart.
2. "Not testable" on everything: traffic is too low. Test bolder changes, or test on the highest-traffic page only.
3. No events in the variant arm: the variant code removed or renamed a tracked button. Restore the tracking attribute.
4. PostHog MCP auth errors: the key needs experiment and feature_flag write scope.
5. Result says "keep running" but you want an answer: that is the no-peeking rule doing its job. Wait for the planned date.

## 9. Safety and platform rules
- Nothing goes live without your yes: launch, rolling to 100% and code merges each need approval.
- No dark patterns: urgency and scarcity only when true; no fake reviews or invented social proof.
- Respect consent: experiments use the same consent rules as your analytics (no tracking before cookie consent where the law requires it).

# Connect cro-test-runner

You need one analytics source and one feature-flag tool. PostHog covers both.

| What | Env var | Where to get it | Scopes | Cost |
|---|---|---|---|---|
| PostHog personal API key | `POSTHOG_API_KEY` | PostHog > Settings > User > Personal API keys | Read: insight, query, session_recording, experiment. Write: experiment, feature_flag | Free tier includes 1M events and 1M flag requests a month (check posthog.com/pricing) |
| PostHog project id | `POSTHOG_PROJECT_ID` | PostHog > Settings > Project, the number in the URL | none | free |
| PostHog host | `POSTHOG_HOST` | `https://us.posthog.com` or `https://eu.posthog.com` | none | free |
| GA4 property id (alternative to PostHog for analytics) | `GA4_PROPERTY_ID` | GA4 Admin > Property settings | analytics.readonly | free (Data API quotas apply) |
| Google service account (for the GA4 MCP) | `GOOGLE_APPLICATION_CREDENTIALS`, `GOOGLE_PROJECT_ID` | Google Cloud console > IAM > Service accounts > create key (JSON). Add the service account email as a Viewer on the GA4 property. Enable "Google Analytics Data API" and "Admin API" | analytics.readonly | free |
| GrowthBook API key (alternative flag tool) | `GROWTHBOOK_API_KEY`, `GROWTHBOOK_API_HOST` | GrowthBook > Settings > API keys (secret key) | read and write features and experiments | open-source self-host free; cloud free tier for small teams; sequential testing is a paid feature |

## MCP servers (mcp.json)
- `posthog`: official PostHog MCP (MIT, PostHog/mcp), remote at mcp.posthog.com.
- `google-analytics`: official Google Analytics MCP (Apache-2.0, googleanalytics/google-analytics-mcp), read only.
GrowthBook is called over its REST API (`/api/v1/features`, `/api/v1/experiments`) from the agent; no MCP needed.

## Browser
The heuristic audit uses any browser tool your runtime has (Claude in Chrome, Playwright MCP, agent-browser). Read only.

## Cost per run
Analytics reads and flag changes are free within vendor free tiers. No paid model APIs are required beyond the runtime you already use.

## Never
Never paste keys into chat or commit them. Put them in your shell profile or the runtime's secret store.
