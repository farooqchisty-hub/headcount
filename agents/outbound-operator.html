## 1. What this agent gets you
Meetings booked from cold email that reads like a person wrote it. It writes short emails tied to a real reason to reach out, sends them safely, answers replies, books calls and remembers which angles work for which roles.

## 2. Who it is for / not for
- **For:** B2B teams and agencies with a clear offer, a deal worth a conversation, and someone who can take the calls.
- **Not for:** mass email to thousands a day, consumer email, or anyone who wants it to send with no human ever looking. The first 20 emails of every campaign wait for your yes.

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| 2 to 5 sending domains (lookalikes of yours) | yes | 30 min | about 10 to 15 USD per domain per year |
| 2 to 3 inboxes per domain (Google Workspace or Microsoft 365) | yes | 30 min | about 6 to 8 USD per inbox per month |
| SPF, DKIM, DMARC on each domain | yes | 20 min (the agent gives you the records) | free |
| Instantly or Smartlead account with warm-up | yes (or Gmail API for small volume) | 20 min | from about 30 to 40 USD per month |
| 14 days of warm-up before the first cold send | yes | waiting | included |
| Cal.com API key | optional, for booking | 5 min | free plan works |

Honest numbers: 3 domains x 2 inboxes x 30 a day = 180 sends a day once warm. At a 3 to 5% reply rate that is roughly 5 to 9 replies a day.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run outbound-operator. Check my sending domains, then write a campaign for the leads in data/outbound/ready and show me the first 20 for approval.

ChatGPT:
> Use the outbound-operator skill. Here are my leads (attached). Write the emails and show them to me before anything is sent.

Demo: `python3 scripts/send_queue.py examples/example-campaign.json --config examples/example-config.yaml --approvals examples/example-approvals.json --send-log examples/example-send-log.csv` (dry-run, nothing is sent).

## 5. Running it on a schedule
- cron for reply checks: `*/30 8-18 * * 1-5 cd /path/to/headcount && claude -p "outbound-operator: handle new replies"` (or your runtime's CLI equivalent)
- Claude Code: `/schedule weekdays 08:00 run outbound-operator daily batch` and `/schedule every 30 minutes 08:00-18:00 outbound-operator replies`
- OpenClaw or Hermes: two jobs, the daily batch and the 30-minute reply check.

## 6. What good output looks like
See `examples/`: `example-campaign.json` has one good sequence, one that fails lint on purpose (flattery, link, unfilled token) and one waiting for approval. `example-output-send-plan.txt` shows the queue. `example-output-classified.json` shows nine reply types handled. Example, fictional brands.

## 7. Tuning
1. `approval.first_n_per_campaign` (20) and `after_first_n` (sample): relax only after a campaign's first 20 needed no edits.
2. `throttle.warmup_ramp` and `max_per_inbox_per_day` (30): add inboxes to grow, never raise the per-inbox cap.
3. `deliverability.pause_if_bounce_rate_over` (2%): the kill switch that protects your domains.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| "capacity_today=0" | Inboxes are under 14 days old. Warm-up first; update `age_days` in config as they age. |
| Lint fails on every email | Usually a banned phrase or a dash. Read the error lines, rewrite, re-run. |
| DNS FAIL on SPF | Two SPF records. Merge them into one `v=spf1` record. |
| Replies under 1% after 300 sends | Likely spam placement or a weak list. Run a placement test in your sending tool, check `dns_check.py`, tighten the ICP. |
| Instantly 401 | API key needs `leads:create` scope (v2 keys are scoped). |

## 9. Safety and platform rules
- Real sender names only. No fake personas.
- Every email offers an easy out; unsubscribes are honoured immediately and forever.
- CAN-SPAM needs your postal address in the footer for US recipients. EU, UK and Canada rules are stricter: check yours.
- Official APIs only (Instantly, Smartlead, Gmail, Cal.com). No LinkedIn automation.
- Nothing sends without passing DNS checks, lint and your approval for the first 20.

## One-time platform setup (Instantly or Smartlead)
1. Add the inboxes, turn on warm-up for all of them, wait 14 days.
2. Create the campaign with 3 steps whose subject and body are the variables `{{step1_subject}}` / `{{step1_body}}`, `{{step2_body}}`, `{{step3_body}}` (steps 2 and 3 reply in thread).
3. Turn off open tracking and link tracking. Set the schedule to weekdays, 08:00 to 17:00 recipient time, daily limit 30 per inbox.
4. Copy the campaign id into `config.yaml` `sender.campaign_id`.

MCP servers in `mcp.json`: HubSpot (`@shinzolabs/hubspot-mcp`, MIT), Exa (official, MIT). Cal.com publishes an official MCP (github.com/calcom/cal-mcp) but no licence file was found at time of writing, so it is not bundled; use the REST API.

Verify before first live run: the Instantly add-leads body field name (`campaign_id`) and lead fields were taken from the v2 reference and a third-party connector; send one lead first and check it appears in the campaign.
