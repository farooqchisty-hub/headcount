## 1. What this agent gets you
Every change your agents make (budget up, ad paused, flow launched, article published) and every number they watch, in one database file you own. Ask "what did my agents change last week and what did it cost?" in plain English and get the answer plus the SQL that proves it.

## 2. Who it is for / not for
- For: anyone running Headcount agents who wants one place to check what happened, who approved it, and whether it worked. Agencies: one ledger, one `client` per brand.
- For: owners who want their marketing record on their own disk, not inside a vendor's dashboard.
- Not for: replacing your analytics tool or ad platform reporting. The ledger holds what agents logged; platforms stay the source of truth for attribution.

## 3. Setup checklist
- Nothing to buy, no keys. Python 3.8 or newer with SQLite 3.25 or newer (built into current Python on macOS, Windows and recent Linux; `ledger.py doctor` checks).
- `python3 install.py` creates the ledger at `~/headcount/ledger/headcount.db`. By hand: `python3 agents/growth-ledger/scripts/ledger.py init`.
- Backfill from what you already have: `python3 agents/growth-ledger/scripts/ledger.py import-standup`.
- Optional, 2 minutes: connect the read only MCP server to your AI tool (CONNECT.md).
- Time: 5 minutes. Cost per run: zero (local file). AI tokens: about 3k to 10k per question.

## 4. First run
Start from your Headcount home (`cd ~/headcount`):
- Claude Code: `Use growth-ledger: what did my agents change in the last 7 days, and what is waiting for my yes?`
- Codex: `Use the growth-ledger skill. Show me every budget change this month with before and after.`
- OpenClaw: `ask the growth ledger which agent spent the most on API fees this month`
- Hermes: `hermes chat -s growth-ledger`, then `What did roas-autopilot pause last week and why?`
- ChatGPT: run `python3 agents/growth-ledger/scripts/ledger.py export --csv` and `ledger.py ask-context > context.md` on your computer, upload both to the Growth Ledger GPT, then ask.
Try it with no data of your own: `python3 agents/growth-ledger/scripts/ledger.py --dry-run query "SELECT * FROM v_budget_changes"` (example, fictional brand).

## 5. Running it on a schedule
The ledger fills itself: every agent writes to it at the end of its run. Schedule only the weekly page:
- cron (Mondays 07:30, after the standup): `30 7 * * 1 cd ~/headcount && python3 ~/.claude/skills/growth-ledger/scripts/ledger.py dashboard && python3 ~/.claude/skills/growth-ledger/scripts/ledger.py verify >> logs/cron.log 2>&1`
- Claude Code: `/schedule every Monday at 7:30am: run growth-ledger weekly dashboard and verify`
- OpenClaw: `openclaw cron add --cron "30 7 * * 1" --session isolated --message "Run growth-ledger weekly dashboard and verify"`
- Hermes: `hermes cron create "every monday 7:30am" "Build the ledger dashboard and verify it" --skill growth-ledger --workdir ~/headcount`

## 6. What good output looks like
- `examples/example-qa.md`: six real questions, the SQL, the rows and the plain answer (example, fictional brand).
- `examples/example-output/ledger.html`: the weekly dashboard built from `examples/fixture/headcount.db`. Open it in a browser.

## 7. Tuning (config.yaml)
- `dashboard.days` (30): the period on the page, compared with the period before it.
- `dashboard.spend_sources` and `revenue_sources`: which `source` values count as ad spend and as store revenue. Add `tiktok`, `woocommerce` and so on as you connect them.
- `mcp.default_limit` (200): rows an AI tool gets per query; raise it for exports, lower it to save tokens.

## 8. Troubleshooting
1. "no ledger at ...": run `ledger.py init`, or rerun install.py: it saves your home in `~/.headcount/config.json`, so every agent finds the same file from any folder. `ledger.py doctor` shows which file is used.
2. "refused: read only": `query` only runs SELECT or WITH. The ledger is written only by agents through the `log-*` commands.
3. An agent's actions are missing: check its Log section has the ledger line and that `../growth-ledger` exists next to it in the skills folder (`ls ~/.claude/skills`). Then run it once and check with `query "SELECT * FROM agent_actions WHERE agent = '<agent>' ORDER BY ts DESC LIMIT 5"`.
4. Numbers look doubled: something logged both a weekly and a daily row, or a total and its breakdown under different dims. Daily questions should use `v_metric_daily`, which picks the total over the breakdown.
5. "database is locked": two agents wrote at the same second; the script waits 15 seconds. If it persists, a crashed process holds the file: close it and rerun.

## 9. Safety and platform rules
- Local only. The ledger never sends data anywhere. The MCP server speaks over stdin and stdout of a process your AI tool starts; it opens no network port.
- Read only for AI tools. Only the `log-*`, `init` and `import-standup` commands write.
- Tamper evident, not tamper proof: `verify` shows if a row was edited or deleted, but anyone with the file can delete it. Back it up.
- It holds business numbers, ad account ids and approver names. Treat the file like your finance exports.

# Connect: growth-ledger

No API keys. No accounts. The ledger is one SQLite file on your computer.

| Piece | Env var | Where it comes from | Cost | Used for |
|---|---|---|---|---|
| Python 3.8+ with sqlite3 | none | built into Python | free | every command |
| Headcount home | none needed (`HEADCOUNT_HOME` optional, it wins when set) | install.py creates `~/headcount` and saves it in `~/.headcount/config.json` | free | finds `<home>/ledger/headcount.db` from any folder |
| Ledger file override | `HEADCOUNT_LEDGER_DB` (optional) | any path you choose | free | a shared drive or a per-client file |
| MCP server (optional) | none | `scripts/ledger_mcp.py`, stdlib only | free | lets your AI tool query the ledger |

## Connect the read only MCP server
The server is a Python script your AI tool starts as a subprocess. It speaks MCP over stdin and stdout (newline-delimited JSON-RPC), opens no network port, and can only read. It supports the `initialize` handshake (MCP revisions 2024-11-05 to 2025-11-25) and per-request metadata with `server/discover` (revision 2026-07-28). Tools: `query`, `schema`, `recent_actions`.

Replace `SKILLS` with where install.py put the agents (`~/.claude/skills`, `~/.agents/skills`, `~/.openclaw/skills`, `~/.hermes/skills/headcount`) and `HOME_DIR` with your Headcount home. `--home HOME_DIR` is optional: without it the server uses the home saved in `~/.headcount/config.json`. Check first: `python3 SKILLS/growth-ledger/scripts/ledger_mcp.py --self-test`.

**Claude Code**
```
claude mcp add --scope user headcount-ledger -- python3 SKILLS/growth-ledger/scripts/ledger_mcp.py --home HOME_DIR
claude mcp get headcount-ledger
```
Then ask: "use headcount-ledger: what changed this week?". Project-only instead: `--scope project` writes `.mcp.json` in the current folder.

**OpenAI Codex** (`~/.codex/config.toml`, or `codex mcp add headcount-ledger -- python3 ...`)
```toml
[mcp_servers.headcount-ledger]
command = "python3"
args = ["SKILLS/growth-ledger/scripts/ledger_mcp.py", "--home", "HOME_DIR"]
```

**Cursor** (`~/.cursor/mcp.json` for all projects, or `.cursor/mcp.json` in one project)
```json
{ "mcpServers": { "headcount-ledger": { "command": "python3", "args": ["SKILLS/growth-ledger/scripts/ledger_mcp.py", "--home", "HOME_DIR"] } } }
```

**OpenClaw** (saved under `mcp.servers` in OpenClaw config)
```
openclaw mcp set headcount-ledger '{"command":"python3","args":["SKILLS/growth-ledger/scripts/ledger_mcp.py","--home","HOME_DIR"]}'
openclaw mcp status --verbose
```
OpenClaw refuses some interpreter environment variables for stdio servers; pass the home with `--home` as shown, not through env.

**Hermes Agent** (`~/.hermes/config.yaml`, then `/reload-mcp` in a chat)
```yaml
mcp_servers:
  headcount-ledger:
    command: "python3"
    args: ["SKILLS/growth-ledger/scripts/ledger_mcp.py", "--home", "HOME_DIR"]
```
Hermes passes only a filtered environment to stdio servers, so `--home` in args is the reliable way.

**ChatGPT**: Custom GPTs cannot start a local process. Export instead: `ledger.py export --csv` plus `ledger.py ask-context > context.md`, upload both (or the `headcount.db` file itself; Code Interpreter opens it with Python's sqlite3). For live access, host an MCP server over HTTPS through the Apps SDK (not bundled; see `runtimes/chatgpt/README.md`).

## Agency mode
One ledger for all clients: every command takes `--client <slug>` and every row has a `client` column. Or one file per client: `HEADCOUNT_LEDGER_DB=~/headcount/ledger/<slug>.db`, and one MCP entry per client with `--db`.

## Optional
treg (tool registry) is not needed here. Nothing in this agent calls a paid API.
