## 1. What this agent gets you
Give it a list of people and companies. It returns verified work emails, paid at the raw price of the data providers you already use, and tells you exactly what each verified email cost.

## 2. Who it is for / not for
- **For:** teams doing outbound who pay for Clay credits or juggle three enrichment tools by hand; agencies enriching lists for clients; founders with a list and an Apollo or Hunter account.
- **Not for:** finding personal or mobile numbers (it only finds work emails), buying lists of people you have no reason to contact, or anyone who wants to email consumers. Cold B2B email rules differ by country: check yours (GDPR legitimate interest in the EU and UK, CAN-SPAM in the US, CASL in Canada is stricter).

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| One finder key (Apollo, Hunter, LeadMagic, Prospeo or Findymail) | yes | 5 min | from about 0.02 to 0.05 USD per found email |
| One verifier key (MillionVerifier or ZeroBounce) | yes | 5 min | about 0.004 to 0.008 USD per check |
| More finders | optional, each one adds 10 to 25% more found emails | 5 min each | same range |
| company-brain run | yes | once | free |

Honest cost per run: on a typical B2B list of 500 people with three finders and one verifier, expect 10 to 25 USD and 55 to 75% verified. Enterprise-heavy lists (many catch-all domains) land lower. See CONNECT.md for where to get each key.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run enrichment-waterfall on ./leads.csv. Dry-run first and show me the cost.

ChatGPT (upload the CSV):
> Use the enrichment-waterfall skill on this file. Start with a dry run and tell me the expected spend.

No keys yet? Try the demo:
> Run enrichment-waterfall in fixture mode on examples/example-input.csv.

## 5. Running it on a schedule
- cron (daily 07:00, enriches whatever signal-prospector dropped):
  `0 7 * * * cd /path/to/headcount && for f in data/signals/to-enrich/*.csv; do python3 agents/enrichment-waterfall/scripts/waterfall.py "$f" --live --budget 10 && mv "$f" data/signals/done/; done`
  Note: scheduled runs never pass `--yes`, so a run whose worst case is above `confirm_above_usd` stops and waits for you.
- Claude Code: `/schedule daily 07:00 run enrichment-waterfall on new files in data/signals/to-enrich`
- OpenClaw or Hermes: add the same message as a daily job in the scheduler.

## 6. What good output looks like
See `examples/`: `example-input.csv` (12 rows with messy domains, one duplicate, one free-mail row, one nameless row) and `example-output-report.md`. Example, fictional brands. Good looks like: 60% or more verified, cost per verified under 0.08 USD, under 2% bounce when sent.

## 7. Tuning (the three settings that matter)
1. `finders` order: put the provider with the best hit rate for YOUR market first. After three runs, use the report's "verified credited to each finder" line to reorder.
2. `catch_all.high_confidence_score` (default 85): raise it if catch-all sends bounce above 2%; lower it only if you have a separate sending domain for catch-all rows.
3. `run.max_spend_usd` (default 25): the hard stop per run.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| "no finder available" | No finder key in env. Run `scripts/check_setup.py`. |
| Very low found rate | Domains are wrong or missing. Check that `website` holds the company site, not a LinkedIn URL. |
| Provider HTTP 401 or 403 | Key wrong, or the plan has no API access (Apollo and Hunter gate API on some plans). |
| Provider HTTP 429 | Rate limited. Re-run later; the script does not hammer retries. |
| A provider's response changed | Vendors change APIs. Each adapter reads the email defensively; if hits drop to zero for one provider, check `references/provider-matrix.md` and the vendor docs, then edit that adapter's `live_find`. |

## 9. Safety and platform rules
- Uses official vendor APIs only. No LinkedIn scraping.
- Only work emails. Personal email reveal is off.
- Keep a record of where each contact came from (the output keeps `found_by`): GDPR and similar laws expect you to tell people the source if they ask.
- Honour opt-outs: outbound-operator keeps the suppression list; never re-enrich a suppressed person.

# Connect: enrichment-waterfall

All keys are yours. Put them in your shell environment or a `.env` file that is never committed. Scripts read env vars only and never print them.

| Provider | Role | Env var | Where to get it | Auth used by the script | Billing (check your plan) |
|---|---|---|---|---|---|
| Apollo | finder | `APOLLO_API_KEY` | Apollo, Settings, Integrations, API, create key (needs a plan with API access) | header `x-api-key` on `POST https://api.apollo.io/api/v1/people/match` | email credits per match; `reveal_personal_emails` stays false |
| Hunter | finder | `HUNTER_API_KEY` | hunter.io, API page | header `X-API-KEY` on `GET https://api.hunter.io/v2/email-finder` | search credits; returns a confidence `score` |
| LeadMagic | finder | `LEADMAGIC_API_KEY` | leadmagic.io dashboard, API | header `X-API-Key` on `POST https://api.leadmagic.io/v1/people/email-finder` | 1 credit per email found; no charge when not found (per vendor docs) |
| Prospeo | finder | `PROSPEO_API_KEY` | prospeo.io dashboard, API | header `X-KEY` on `POST https://api.prospeo.io/enrich-person` with `only_verified_email: true` | 1 credit per email match; the older `/email-finder` endpoint is marked deprecated by the vendor |
| Findymail | finder | `FINDYMAIL_API_KEY` | app.findymail.com, API | `Authorization: Bearer` on `POST https://app.findymail.com/api/search/name` | credit only when a verified email is found |
| MillionVerifier | verifier | `MILLIONVERIFIER_API_KEY` | app.millionverifier.com, API | query `api=` on `GET https://api.millionverifier.com/api/v3/` | per check; vendor says catch-all and unknown are not billed |
| ZeroBounce | verifier (second opinion) | `ZEROBOUNCE_API_KEY` | zerobounce.net, API | query `api_key=` on `GET https://api.zerobounce.net/v2/validate` | per check |

Optional MCP servers (see `mcp.json`):
- Apollo official MCP (MIT, first-party): `https://mcp.apollo.io/mcp`, OAuth in your client. Useful for search; the waterfall script still uses the REST key.
- HubSpot via `@shinzolabs/hubspot-mcp` (MIT): `HUBSPOT_ACCESS_TOKEN` from a HubSpot private app with `crm.objects.contacts.read` and `crm.objects.contacts.write`, to check whether a contact already exists before you pay to find them.

Optional: treg (tool registry) can stand in for any single provider only if you have your own treg account. Direct vendor keys are the default path.

## Verify before your first live run
API shapes change. These were checked against vendor docs on 11 Nov 2026, but response fields for Prospeo, Findymail and LeadMagic were read from docs, not from live calls. Run one live row first: `python3 scripts/waterfall.py one-row.csv --live --budget 0.5` and confirm each provider shows a hit or a clean miss.
