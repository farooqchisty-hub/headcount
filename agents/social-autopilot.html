## 1. What this agent gets you
A month of posts across your social channels, planned from your content pillars, scheduled when your audience is most active, and adjusted every week toward what is working.

## 2. Who it is for / not for
For: brands posting on 2 to 6 platforms who want consistency and a weekly "what worked" without a social media manager.
Not for: news or crisis accounts that post reactively all day (use trend-jacker), or anyone wanting to post without reviewing.

## 3. Setup checklist
- [ ] company-brain done, with a "Content pillars" section (3 to 6 pillars, optional % weights).
- [ ] One publishing route: Postiz (self-hosted), Buffer, or native APIs (CONNECT.md).
- [ ] 90 days of past posts exported, or let the agent pull them.
Cost: Postiz self-hosted is free plus your server; Buffer per its plan; native APIs free except X. LLM cost for a month's copy is under a dollar.

## 4. First run
Claude Code / Codex / OpenClaw / Hermes:
> Run social-autopilot for December. Pull my last 90 days, find my best times, score formats and build the calendar.

ChatGPT:
> Use the social-autopilot skill. Here is my post history CSV and COMPANY.md. Build December's calendar.

## 5. Running it on a schedule
- Monthly, 25th at 10:00: `Run social-autopilot monthly calendar for next month` (cron `0 10 25 * *`).
- Weekly, Monday 08:40: `Run social-autopilot weekly read` (cron `40 8 * * 1`).
Claude Code `/schedule` or the OpenClaw/Hermes scheduler work the same way. Publishing happens through your scheduler at slot time after approval.

## 6. What good output looks like
`examples/example-output.md`: best-time slots with lift, a weekly read with DOUBLE DOWN and RETIRE calls, and a December calendar with pillar and platform counts.

## 7. Tuning (the 3 settings that matter)
- `platforms.<name>.per_week`: cadence. Raise only after 4 weeks of hitting it.
- `scoring.explore_share` (0.2): how much of the calendar keeps testing new things.
- `pillar_floor` (0.10): minimum share per pillar, so no topic dies untested.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "no 'Content pillars' section" | Add a `## Content pillars` list to COMPANY.md, one pillar per line |
| Instagram error on publish (9004 or container not ready) | Media URL must be public; for reels wait until container status is FINISHED |
| Best times all "default" | Under 30 posts on that platform. Normal for new accounts; it switches after a month |
| Everything says TEST MORE | Too few posts in 28 days. Raise `lookback_days` to 56 |
| Buffer API errors | The legacy REST API is retiring (1 Feb 2027); use the GraphQL API token |

## 9. Safety and platform rules
- Nothing publishes without approval by default.
- Respects Instagram's 100 API posts per 24 h and each platform's spam rules: no duplicate copy across platforms, no engagement bait.
- AI-made assets keep platform AI labels.

# Connect: social-autopilot

Pick ONE publishing route. Env vars only; never paste tokens in chat or config.

| Env var | What it is | Where to get it | Scopes | Cost |
|---|---|---|---|---|
| `POSTIZ_URL`, `POSTIZ_API_KEY` | Your self-hosted Postiz and its public API key | Deploy Postiz (Docker, docs.postiz.com), then Settings, Public API | n/a; connect each social account inside Postiz | Free to self-host (your server cost). AGPL: run as a service, do not copy code |
| `BUFFER_ACCESS_TOKEN` | Buffer GraphQL API token | developers.buffer.com | Account token | Buffer plan per channel |
| `IG_ACCESS_TOKEN`, `IG_USER_ID` | Native Instagram publishing and insights | Meta app, Instagram API | `instagram_business_basic`, `instagram_business_content_publish`, `instagram_business_manage_insights` | Free |
| `FB_PAGE_ACCESS_TOKEN` | Native Facebook Page publishing and insights | Meta app | `pages_manage_posts`, `pages_read_engagement`, `read_insights` | Free |
| `X_USER_ACCESS_TOKEN` (+ secret, app key) | Native X posting | developer.x.com | Read and write | Per your X plan |
| `LINKEDIN_ACCESS_TOKEN`, `LINKEDIN_ORG_URN` | Company page posting and stats | LinkedIn developer portal, Community Management API (approval) | `w_organization_social`, `r_organization_social` | Free |
| `TIKTOK_ACCESS_TOKEN` | TikTok Content Posting API | developers.tiktok.com (audit needed for public posts) | `video.publish` | Free |

## MCP servers (mcp.json)
- `postiz`: the MCP endpoint built into recent Postiz versions, served by your own instance. Postiz is AGPL-3.0; it is used as a separate service, not bundled. Check your version's docs for the exact MCP path; if your version has none, the agent calls the Postiz public API directly.
- No MCP for Buffer or native routes: the agent calls the REST or GraphQL endpoints listed in references/scheduling-stack.md.

## Time to set up
Postiz: 30 to 60 minutes (server plus OAuth per platform). Buffer: 10 minutes if you already use it. Native: 20 minutes per platform, plus LinkedIn approval time.
