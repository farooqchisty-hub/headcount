## 1. What this agent gets you
Give it your store URL. You get 20 finished static ads in three sizes, built on your real product photos and real customer arguments, checked for wrong prices, bad claims and unreadable text.

## 2. Who it is for / not for
For: ecommerce brands (Shopify works best), agencies producing statics for several clients, teams testing on Meta, TikTok or Pinterest.
Not for: brands without decent product photos (run product-photoshoot first), regulated claims you cannot prove (it will refuse them), or anyone wanting the AI to invent a product look.

## 3. Setup checklist
- [ ] company-brain has run (colours, fonts, logo, voice, banned claims)
- [ ] angle-miner has run (recommended; ads are built on its arguments)
- [ ] Google Chrome or Chromium installed (free; sets the type)
- [ ] One image key if you want AI backgrounds: Gemini, OpenAI, Replicate or fal
- [ ] Your product export, the most reliable catalogue source: Shopify admin, Products, Export, CSV (WooCommerce: Products, Export). A pasted product list also works
Time to set up: 15 minutes. Cost per run of 20 ads: $0 if you use brand colour backgrounds only; roughly $1 to $6 for 8 to 15 AI background plates, depending on provider and resolution (check your provider's price page). The agent shows the count and estimate and waits for your yes.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
```
Run static-ad-factory for https://your-store.com. Use the latest angle bank. Make 20 ads.
```
ChatGPT (project with this folder, Chrome step done locally or by the code tool):
```
Use the static-ad-factory skill for https://your-store.com. Stop for approval before generating any paid images.
```

## 5. Running it on a schedule
Weekly on Tuesday 09:20:
- cron: `20 9 * * 2 cd /path/to/project && claude -p "Run static-ad-factory weekly batch"`
- Claude Code: `/schedule weekly Tuesday 09:20 Run static-ad-factory weekly batch`
- OpenClaw or Hermes: scheduled task with the same prompt.
The paid image approval still applies on scheduled runs unless you set `image.approval_required: false`.

## 6. What good output looks like
See `examples/output/`: five fixture ads (hero, testimonial, comparison, statement, offer) with `qa_report.json` all passing, rendered from `examples/fixtures/ad_specs.json`. The product there is a drawn stand-in for a real cutout (example, fictional brand).

## 7. Tuning (the 3 settings that matter)
- `batch.min_distinct_angles`: raise to 8 for big accounts; diversity of argument is what Meta rewards.
- `image.default_task`: keep `scene` for product truth; `edit` gives more natural lifestyle shots but needs strict QA.
- `safe_zones.9x16.bottom_pct`: 35 is the strict default; if your Ads Manager overlay shows less, lower it to 25 to gain space.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "products.json rate limited (HTTP 429)" or "not available" | Many Shopify stores now rate limit scripts on /products.json. For your own store, skip it: export your products (Shopify admin: Products, Export, CSV) and give the file to the agent (`fetch_products.py --csv <file> --currency INR`); WooCommerce exports and a pasted product list (`--list`) work too, and an Admin token works with `--admin-api`. For other stores the script waits once, then reads up to 12 public product pages (prices from the page, so "was" prices cannot be checked and QA will block them). Exit 3 means that also failed: let the agent read pages with its browser |
| "text did not fit" (exit 4) | Shorten the headline; 6 to 8 words fits every size |
| Product looks pasted on | Choose a plate with matching light direction; the cutout needs a soft shadow (built in) |
| QA fails on price | Your spec price differs from the live store. Use the live price or wait for the sale to go live |
| Chrome not found | Install Chrome or set `CHROME_PATH` to your Chromium binary |

## 9. Safety and platform rules
No fake reviews, no invented people, no fake screenshots of other platforms. Testimonials are your own customers' words, verbatim. Competitor names stay out of ads unless legal approves. Before and after only with real photos and never in regulated categories. Uploads are always paused and handled by another agent after your review.

# Connections

| Connection | Needed for | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| Your product export (recommended for your own store) | Products, prices, compare-at prices, images | Shopify admin, Products, Export, CSV; or WooCommerce, Products, Export; or a pasted list. Run `fetch_products.py --csv <file> --currency INR` | None, a file you download | Free | none |
| Shopify public catalogue | Products, prices, images (other stores, or no export) | Nothing: `https://<store>/products.json` is public on most stores, but many now rate limit scripts (HTTP 429); the script then reads public product pages | Public read | Free | none |
| Chrome or Chromium | Setting real type and exporting PNGs | google.com/chrome or your package manager | Local | Free | `CHROME_PATH` (optional) |
| Google Gemini API | Background plates, lifestyle edits (Nano Banana Pro) | aistudio.google.com, Get API key | Generative Language API | Pay per image (see ai.google.dev pricing) | `GEMINI_API_KEY` |
| OpenAI API | GPT Image 1.5 generations and edits | platform.openai.com, API keys | Images | Pay per image, more with `input_fidelity: high` | `OPENAI_API_KEY` |
| Replicate | Nano Banana Pro, Seedream 4, Flux Kontext Pro | replicate.com, Account, API tokens | Predictions | Pay per run (shown on each model page) | `REPLICATE_API_TOKEN` |
| fal | Nano Banana Pro edit, Seedream 4 edit | fal.ai, Dashboard, Keys | Model calls | Pay per image | `FAL_KEY` |
| Shopify Admin API (optional) | Own store: full-size images, inventory, live discounts; `fetch_products.py --admin-api` | Shopify admin, Settings, Apps, Develop apps | `read_products`, `read_inventory`, `read_price_rules` | Free | `SHOPIFY_ADMIN_TOKEN` (or `SHOPIFY_ACCESS_TOKEN`), `SHOPIFY_STORE_DOMAIN` |
| treg (optional) | Only if you already have your own treg account with image models | your account | per tool | per call | `TREG_TOKEN` |

You need one image provider at most. Brand colour backgrounds need none.
Keys live in your environment or a git ignored `.env`. Scripts never print them; `--dry-run` shows requests with keys redacted.
