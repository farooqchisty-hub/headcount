## 1. What this agent gets you
Real links from real sites in your niche, earned every week: quotes in articles, mentions turned into links, dead links replaced with yours, and tools or data people want to cite. Nothing bought, nothing that risks a Google penalty.

## 2. Who it is for / not for
- For: brands with at least one person who knows the subject and can be quoted, and a site with pages worth linking to.
- Not for: anyone wanting to buy links, use private blog networks, or swap links at scale. The agent refuses those and explains why.

## 3. Setup checklist
- [ ] Join 2 or 3 request platforms as a source (Qwoted, HARO by Featured, Source of Sources, MentionMatch, SourceBottle). Route their emails to one inbox label.
- [ ] Connect your mail tool so the agent can read digests and save drafts.
- [ ] Fill experts in COMPANY.md: names, credentials, topics, 5 facts or numbers each, headshots.
- [ ] Optional: DataForSEO or Ahrefs API key for faster prospecting and gap analysis.
- Time to set up: about 45 minutes (platform sign-ups take most of it).
- Cost: free path is $0. With DataForSEO, a few dollars a week within the cap. Featured paid tier is optional.

## 4. First run
> Run backlink-builder. Triage today's journalist requests and draft answers for my experts. Then find unlinked mentions of my brand and score them. Save drafts only, do not send.

## 5. Running it on a schedule
- Claude Code: `/schedule` "weekdays 07:30 and 13:30 run backlink-builder triage" and "Mondays 09:00 run backlink-builder weekly lanes".
- cron: `30 7,13 * * 1-5 cd ~/headcount && claude -p "run backlink-builder triage"`
- OpenClaw / Hermes: same prompts in the scheduler.

## 6. What good output looks like
`examples/example-output.md`: requests ranked with paid and credential-gated ones skipped, a prospect list where link farms are rejected with reasons, dead links found on a resource page, a quote that lost its link sent back to reclaim, and a competitor gap list.

## 7. Tuning
- `request_sources` and `daily_pitch_cap`: the journalist lane is the biggest win for most brands. Do fewer, better answers.
- `min_prospect_score` and `min_monthly_traffic`: raise to be pickier.
- `caps`: shift effort toward the lanes that win links per pitch in your log.

## 8. Troubleshooting
1. No placements after 3 weeks: answers are too generic. Add specific numbers to experts.json and answer faster.
2. Prospect scores all low: topics in config are too narrow or missing. Add the words your niche uses.
3. Broken link scans hang: some sites block bots. The checker times out after 10 s per link; skip those pages.
4. Paid API spend cap reached: the run stops that lane. Raise `dataforseo_max_spend_usd` or use free sources.
5. Links show as nofollow: normal for news sites. They still bring referral traffic, brand searches and AI citations; track them as wins.

## 9. Safety and platform rules
- No paid links, link exchanges, PBNs or keyword-rich anchor requests (Google spam policies). Paid placements must carry `rel="sponsored"` and are treated as ads.
- Experts approve every quote in their name. No invented quotes, credentials or data.
- Emails are saved as drafts; you send. One follow-up, then stop. Honour opt-outs immediately.
- Follow each request platform's rules (most require submitting through the platform).

# Connect backlink-builder

Every lane works without paid APIs. Paid data makes prospecting faster.

| What | Env var | Where | Cost |
|---|---|---|---|
| Journalist platforms | none (accounts) | Sign up as a source: qwoted.com, featured.com (also HARO newsletter), sourceofsources.com, mentionmatch.com (formerly helpab2bwriter.com), sourcebottle.com. Route digest emails to one inbox label | Free to about $49+/month for paid tiers |
| Mail (read digests, save drafts) | your runtime's Gmail or Outlook MCP; set `GMAIL_MCP_ENABLED=1` | Connect in your runtime's connector settings. Scopes: read, compose drafts. Sending stays manual by default | free |
| X / Bluesky hashtags | none | search #journorequest and #prrequest in the app or web search | free |
| DataForSEO (optional) | `DATAFORSEO_LOGIN`, `DATAFORSEO_PASSWORD` | app.dataforseo.com > API access | pay as you go; Backlinks API is roughly cents per request, plus a monthly minimum for the Backlinks subscription (check current pricing). Capped by `dataforseo_max_spend_usd` |
| Ahrefs API v3 (optional) | `AHREFS_API_KEY` | ahrefs.com > Account > API (enterprise plans) | included in eligible plans; costs API units |
| Semrush API (optional) | `SEMRUSH_API_KEY` | semrush.com > Subscription info > API units | API units |
| Search Console (free, your own links) | `GSC_SITE_URL`, `GOOGLE_APPLICATION_CREDENTIALS` | Search Console > Settings > Users > add service account; Links report | free |
| Email finder (optional) | your own tool's key, e.g. `HUNTER_API_KEY` | only your own account | per lookup |

## MCP servers (mcp.json)
- `dataforseo` (official, Apache-2.0), optional.
- `search-console` (MIT), optional.

## Cost per week (honest)
Free path: 0. With DataForSEO for gap and traffic checks: usually a few dollars a week within the cap. Featured paid plan if you choose it: about $49+/month.

## Never
Never store mailbox passwords. Never share API keys in chat.
