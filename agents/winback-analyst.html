## 1. What this agent gets you
A monthly list of customers who are late for their next order, ranked by what they are worth, with an offer ladder that saves discounts for the people who need them. A holdout proves how much revenue it really brought back.

## 2. Who it is for / not for
For: ecommerce brands with repeat purchase (consumables, apparel, beauty, pet, food) and 300+ repeat customers.
Not for: one-time-purchase products (mattresses, furniture) or stores under 12 months of history.

## 3. Setup checklist
- [ ] company-brain has run (margin, discount rules)
- [ ] Shopify read_orders + read_all_orders, or an orders CSV
- [ ] ESP key to push lists (or import CSVs yourself)
- [ ] Edit config.yaml: holdout_pct, ladder, max_discount_pct
- [ ] `python3 scripts/check_setup.py`
Time: 15 minutes. API cost: $0.

## 4. First run
Claude Code: `Use winback-analyst: build this month's winback cohort with a 10% holdout.`
ChatGPT / Codex: load SKILL.md, attach your orders CSV, same message.
OpenClaw / Hermes: `run winback-analyst "monthly cohort"`

## 5. Schedule
- Claude Code: `/schedule monthly on the 3rd 9am: winback-analyst cohort` and `/schedule every Monday: winback-analyst advance rungs`
- cron: `0 9 3 * * cd /path/to/headcount && claude -p "run winback-analyst monthly cohort"`

## 6. What good output looks like
`examples/example-output.md`: a status-by-value table, a per-customer cohort CSV with expected next order dates, and a readout that says "proven", "not proven" or "too small to call".

## 7. Tuning
- `holdout_pct`: 10% default; never under 5% or you cannot prove anything.
- `ladder.high`: keep no-discount first; it is where margin is saved.
- `at_risk_multiple`: lower to 1.3 for fast-reorder products.

## 8. Troubleshooting
1. **Only 60 days of orders:** request read_all_orders in the Shopify app.
2. **Everyone is "lost":** history is short or gaps are seasonal; raise `lost_multiple` or use `fallback_gap_days`.
3. **"too small to call":** pool 2 to 3 monthly cohorts; do not shrink the holdout.
4. **Holdout contaminated:** campaign-builder sent them a promo; add the holdout list to campaign suppressions.
5. **Negative net for a tier:** remove its discount rung next month.

## 9. Safety and platform rules
- Nothing is pushed or sent without your yes. The ESP flow sends, and you switch it on.
- Messages carry unsubscribe and avoid fake urgency. SMS only with consent.
- Customer data stays in your workspace; never uploaded anywhere except your own ESP.

# Connections: winback-analyst

| What | Why | Where | Scopes | Cost | Env var |
|---|---|---|---|---|---|
| Shopify Admin API | 24 months of orders | Settings, Apps, Develop apps | read_orders, read_customers (read_all_orders for history older than 60 days, requested in the app setup) | Free | `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_STORE` |
| Klaviyo | Push treatment and holdout lists, read flow results | API keys | lists:write, profiles:read, flows:read, metrics:read | Free | `KLAVIYO_PRIVATE_KEY` |
| Brevo / Mailchimp | Same via lists or tags | API keys or the Brevo MCP (OAuth) | contacts, lists | Free | `BREVO_API_KEY`, `MAILCHIMP_API_KEY` |
| CSV fallback | Any store or ESP | Orders export and list import | n/a | n/a | none |

MCP servers in `mcp.json`: `shopify-mcp` (MIT), Klaviyo MCP (official, READ_ONLY true for analysis), Brevo MCP (official, remote). Keep only what you use.
Note: Shopify only returns the last 60 days of orders unless the app has `read_all_orders` approved.
