## 1. What this agent gets you
Every week: the reels in your niche that did 3x or more their account's normal views, why each one won in one sentence, and 3 remakes built on the same mechanism for your brand. Seven days later it tells you whether the mechanism worked for you too.

## 2. Who it is for, and not for
- For: brands and founders posting reels at least weekly who want proven ideas instead of guesses.
- For: teams that can either film 20 minutes a week or are fine with faceless reels (VO, b-roll, captions).
- Not for: anyone who wants to repost other people's videos. This agent never copies footage, audio or wording.
- Not for: accounts with no posting history. You need about 12 reels of your own before remake tracking means anything.

## 3. Setup checklist
| Item | Needed? | Time | Cost per weekly run |
|---|---|---|---|
| COMPANY.md (run company-brain) | yes | 15 min once | free |
| Instagram professional account + Meta app token | recommended | 30 to 45 min once | free |
| Apify or ScrapeCreators key | only if your watchlist has accounts Business Discovery cannot see | 5 min | roughly $1 to $5 for 30 accounts x 30 reels (check vendor pricing) |
| ffmpeg + local Whisper | optional, for transcripts | 10 min | free |
| Python 3.9+ | yes | | free |
Run `python3 scripts/check_setup.py` to see what is ready.

## 4. First run
- **Claude Code:** `Run viral-reel-cloner. My watchlist is a, b, c. Propose the rest. Faceless by default.`
- **ChatGPT (custom GPT or project with these files):** `Use the viral-reel-cloner instructions. Here is my reels export CSV. Find the outliers and write 3 remake briefs.`
- **Codex:** `Follow agents/viral-reel-cloner/SKILL.md. Run the scripts in dry-run first, then live with source ig.`
- **OpenClaw / Hermes:** load the folder as a skill, then: `viral-reel-cloner: weekly scan, watchlist in config.yaml`.
Try it without keys: `python3 scripts/fetch_reels.py --dry-run --out data/reels.json && python3 scripts/outlier_score.py --in data/reels.json`.

## 5. Running it on a schedule
- cron (Mondays 08:10): `10 8 * * 1 cd /path/to/viral-reel-cloner && claude -p "Run viral-reel-cloner weekly scan"`
- Claude Code: `/schedule weekly Monday 8am: run viral-reel-cloner`
- OpenClaw / Hermes: add a weekly job with the same prompt.
Scheduled runs stop at the pick list and wait for you, unless you change `approvals` in config.yaml.

## 6. What good output looks like
See `examples/example-output.md`: a winners table with a mechanism per reel, scored picks with reasons, a remake brief with 3 ranked hooks, a founder shot list, and last week's verdicts.

## 7. Tuning (the 3 settings that matter)
- `scoring.outlier_threshold` (3.0): lower to 2.5 in slow niches, raise to 5 when you get too many winners.
- `watchlist.accounts`: the list is the strategy. Mix small, mid and large accounts in your audience, not just competitors.
- `remake.default_mode`: faceless or founder. Founder reels usually build more trust; faceless scales.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Business Discovery error for a handle | That account is personal, not Business or Creator. Use Apify or ScrapeCreators for it, or drop it. |
| `insufficient_history` on most accounts | Accounts post too little. Raise `scoring.baseline_days` to 120 or pick more active accounts. |
| Too many outliers from one account | Its reach is falling or it boosts posts. Drop the account. |
| `similarity_check.py` fails | The script reused a phrase. Rewrite that line in your own words. |
| Remakes keep scoring under 1.5x | Check first frame and hook first. If they match the brief, the audience differs: change the watchlist. |

## 9. Safety and platform rules
- Uses Meta's official Graph API first. Third-party scrapers are your choice and your account; read their terms.
- Ideas and formats are free to use; footage, music, voice and scripts are not. The agent enforces this.
- Use paid partnership and AI labels where they apply. No buying views, no engagement pods.
- Stays under Meta rate limits (default 150 calls per hour).

# Connections

You need ONE reel data source. Instagram Graph API is the default and free.

## Instagram Graph API (Business Discovery), primary
- What: reads public reels and counts of other Business or Creator accounts.
- Get it: create a Meta app at developers.facebook.com, add the Instagram product (Instagram API with Facebook Login), connect your Instagram professional account to a Facebook Page, generate a long-lived user token.
- Permissions: `instagram_basic`, `pages_show_list`, `pages_read_engagement`; for tracking your own reels also `instagram_manage_insights`. Business Discovery on accounts you do not own may need Advanced Access via Meta App Review.
- Env vars: `IG_ACCESS_TOKEN` (long-lived, refresh every 60 days), `IG_USER_ID` (your Instagram professional account id, not the Page id).
- Cost: free. Limits: Meta's changelog reports up to 1,000 Discovery queries per user per hour (raised from 240). We default to 150. Verify on Meta's rate-limit docs.
- Cannot see: personal accounts, stories, reels audio name.

## Apify (BYOK), optional
- What: reel scraper actors for any public account.
- Get it: apify.com, Settings, Integrations, API token.
- Env var: `APIFY_TOKEN`. Actor default `apify/instagram-reel-scraper` (change with `--apify-actor`).
- Cost: pay per result; free plan includes monthly credit. A 30 x 30 pull usually costs a few dollars. Check the actor's price page. Capped by `budget.monthly_data_cap_usd`.
- MCP: `apify` in mcp.json (MIT).

## ScrapeCreators (BYOK), optional
- What: REST endpoints for Instagram reels and transcripts.
- Get it: scrapecreators.com, dashboard, API key.
- Env var: `SCRAPECREATORS_API_KEY`. Header `x-api-key`.
- Cost: prepaid credits, about one credit per request. Check current pricing.

## Manual mode (no keys)
Export a CSV with columns `handle,reel_id,timestamp,views,likes,comments,caption,permalink,duration` (from your own tools or by hand) and run `fetch_reels.py --source csv --csv file.csv`.

## Local tools, optional
- `ffmpeg` (LGPL/GPL build, install via your package manager): frames for deconstruction.
- `openai-whisper` (MIT, `pip install openai-whisper`) or `whisper.cpp` (MIT): local transcripts, free.

## treg, optional
If you have your own treg account, its social data tools can replace Apify or ScrapeCreators. Not required.

Never paste keys into chat or files. Put them in your shell profile or a `.env` that is git-ignored.
