## 1. What this agent gets you
More people visiting your profile and following you, from comments that actually say something. Every comment on your own posts gets an answer within hours.

## 2. Who it is for / not for
For: founders and brands with an active account on X, Instagram, LinkedIn, Facebook or YouTube who want reach without buying ads, and who can spend 20 to 40 minutes a day approving.
Not for: anyone wanting thousands of automated comments a day, follower buying, or engagement pods. The agent refuses all of that.

## 3. Setup checklist
- [ ] Run company-brain first (voice rules, product names, buyer pains).
- [ ] Connect at least one platform (CONNECT.md). Instagram or Facebook: 20 minutes. X: 15 minutes. LinkedIn org API: needs approval, days.
- [ ] Give the agent 3 comments you wrote yourself so it can match your voice.
- [ ] Optional: list 20 accounts in your niche you already respect. The agent builds the rest of the watchlist.
Cost per run: Meta, LinkedIn and YouTube APIs are free at this volume. X reads are paid per your X plan; a daily run reads roughly 300 to 600 posts. LLM cost is a few cents a day.

## 4. First run
Claude Code / Codex / OpenClaw / Hermes:
> Run engagement-agent. Do the inbound sweep on my Instagram and X, build today's outbound list from my watchlist, and show me the approval queue.

ChatGPT (with the files uploaded as a project):
> Use the engagement-agent skill. Here are my last 20 comments and 10 niche posts. Draft replies and the approval queue.

## 5. Running it on a schedule
- Claude Code: `/schedule` "Run engagement-agent inbound sweep" every 3 hours 9:00 to 21:00, and "outbound list" daily at 08:10.
- cron: `10 8 * * * cd ~/headcount/agents/engagement-agent && claude -p "Run engagement-agent outbound list and queue"`
- OpenClaw/Hermes: add two scheduled jobs with the same messages.
The agent still waits for your approval; scheduling only prepares the queue.

## 6. What good output looks like
See `examples/example-output.md`: a queue of specific comments, each with the reason it was picked, plus rows the gate sent back for rewriting.

## 7. Tuning (the 3 settings that matter)
- `lanes.outbound.big_account_reply_window_minutes` (30): lower to 15 if you are online often; raise only if follows per comment stay high late.
- `rate_limits` per platform: start low. Raise by 20% a week only if no warnings.
- `comment_rules.max_similarity_to_recent` (0.55): lower to 0.45 if comments start to sound samey.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "REWRITE: does not reference anything specific" on most drafts | The agent is not reading posts closely; ask it to quote the phrase it is responding to before drafting |
| X reply returns 403 | X only allows API replies when the author mentioned or quoted you. Use the web-intent link in the queue |
| Instagram error code 4 or 613 | Rate limited. The agent pauses 24 h. Lower `rate_limits.instagram` |
| Follows flat after 3 weeks | Check the profile checklist in references/reply-strategy.md; shift the watchlist to the 5k to 50k band |
| LinkedIn comments missing | Community Management API not approved yet; LinkedIn stays manual until then |

## 9. Safety and platform rules
- Official APIs only. Outbound comments on others' posts are posted by you, by clicking. No bots logging in as you.
- Hard caps per hour and day, far below platform ceilings, with random spacing.
- No generic praise, no links, no hashtags, no copy-paste comments. Product mentions always carry "I work at ...".
- Kill switch: `kill_switch: true` in config.yaml or a file named STOP stops everything.
- Read references/platform-rules.md for per-platform terms.

# Connect: engagement-agent

All keys are yours. Put them in your shell environment or a `.env` your runtime loads. The agent reads env vars only and never prints values. Connect only the platforms you use; one is enough to start.

| Env var | What it is | Where to get it | Scopes / permissions | Cost |
|---|---|---|---|---|
| `IG_ACCESS_TOKEN`, `IG_USER_ID` | Instagram professional account token (Instagram login) or Page token with IG linked (Facebook login) | developers.facebook.com: create a Business app, add Instagram product, generate a long-lived token | `instagram_business_basic`, `instagram_business_manage_comments` (IG login) or `instagram_basic`, `instagram_manage_comments`, `pages_show_list` (FB login). Insights: `instagram_manage_insights` | Free |
| `FB_PAGE_ACCESS_TOKEN`, `FB_PAGE_ID` | Long-lived Page token | Meta app, Graph API Explorer, then exchange for long-lived | `pages_manage_engagement`, `pages_read_engagement`, `pages_read_user_content` | Free |
| `X_USER_ACCESS_TOKEN`, `X_USER_ACCESS_SECRET`, `X_API_KEY`, `X_API_SECRET` | OAuth 1.0a user context for your account | developer.x.com, project and app, "Keys and tokens" | Read and write. Needed for non_public_metrics on your replies | Pay-per-use or tier plan. Reads of your own tweets and mentions are low volume; check your plan's pricing page |
| `X_BEARER_TOKEN` | App-only token for recent search of watchlist posts | same | Read | Counts toward read usage |
| `LINKEDIN_ACCESS_TOKEN`, `LINKEDIN_ORG_URN` | Organization admin token | linkedin.com/developers, Community Management API product (requires approval) | `r_organization_social`, `w_organization_social` | Free, approval takes days to weeks |
| `YOUTUBE_OAUTH_TOKEN`, `YOUTUBE_API_KEY` | OAuth for comments, API key for public search | console.cloud.google.com, enable YouTube Data API v3 | `https://www.googleapis.com/auth/youtube.force-ssl` | Free within 10,000 units per day. Comment insert is 50 units, search is 100 |

## Meta app review
For your own accounts in Development mode, no review is needed: you are an admin of the app. To run it for clients, Meta requires App Review for each permission plus Business Verification.

## MCP servers (mcp.json)
- `twitter`: EnesCinr/twitter-mcp, MIT licence. Optional: the agent can call X endpoints directly instead. Package name to verify on npm before install: `@enescinar/twitter-mcp`.
- No MCP is used for Instagram, Facebook, LinkedIn or YouTube: the agent calls the official REST endpoints listed in SKILL.md.
- Optional: treg, only if you have your own treg account, for read-only discovery of niche posts. Not required.

## Never
- Never paste tokens in chat or in config.yaml.
- Never use unofficial "private API" libraries or browser bots that log in as you. They break platform terms and get accounts restricted.
