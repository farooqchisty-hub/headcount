## 1. What this agent gets you
Drop in one long video. Get back up to 10 vertical clips with burned-in captions, a newsletter and a week of LinkedIn and X posts, all built from the best moments, queued as drafts.

## 2. Who it is for, and not for
- For: anyone recording podcasts, webinars, interviews, livestreams or talks of 20 minutes or more.
- For: teams paying an editor per episode, or skipping clips because it takes 4 hours.
- Not for: footage you do not own or have permission to clip.
- Not for: heavily produced edits (b-roll storytelling, multi-cam colour work). This makes clean, fast, captioned clips.

## 3. Setup checklist
| Item | Needed? | Time | Cost per episode |
|---|---|---|---|
| COMPANY.md (company-brain) | yes | 15 min once | free |
| FFmpeg with libass (for burned captions) | yes | 10 min | free |
| Local Whisper (openai-whisper or whisper.cpp) | yes, or hosted | 10 min | free locally; hosted Whisper about $0.006 per minute (about $0.36 for a 60 min episode) |
| Python 3.9+ | yes | | free |
| Face tracker (AI-Youtube-Shorts-Generator, MIT, local mode) | only for 2-person wide shots | 20 min | free locally |
Transcribing 60 min with Whisper `small` on a recent laptop takes roughly 5 to 15 min.

## 4. First run
- **Claude Code:** `clip-repurposer: new episode at inbox/ep41.mp4. Guest is <name> (<handle>). Drafts from Monday.`
- **ChatGPT:** upload the transcript JSON (or SRT) and this folder: `Use clip-repurposer. Score the moments and write the newsletter and posts.` Cutting runs on your machine with the printed commands.
- **Codex:** `Follow agents/clip-repurposer/SKILL.md on inbox/ep41.mp4.`
- **OpenClaw / Hermes:** load as a skill, then `clip-repurposer: inbox/ep41.mp4`.
Try it without a video: `python3 scripts/score_moments.py --dry-run` then `python3 scripts/export_drafts.py --dry-run`.

## 5. Running it on a schedule
- Weekly show, cron (Thursday 10:20): `20 10 * * 4 cd /path/to/clip-repurposer && claude -p "clip-repurposer: process the newest file in inbox/"`
- Claude Code: `/schedule weekly Thursday 10:20am: clip-repurposer newest episode`
It stops at the clip list for your approval.

## 6. What good output looks like
See `examples/example-output.md`: scored moments with reasons, what was dropped and why, reframe settings, caption cards, newsletter and posts, draft schedule.

## 7. Tuning (the 3 settings that matter)
- `clips.min_score` (55): raise to 65 for fewer, stronger clips.
- `reframe.mode` and `reframe.manual_cx`: set once per studio setup and every clip frames right.
- `scoring.weights`: after 3 episodes, shift weight toward the part your winners score highest on.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "no libass subtitles filter" warning | Install an ffmpeg build with libass (see CONNECT.md), or burn captions with motion-graphics-studio, or upload the SRT natively. |
| Face cut off in clips | Set `--mode manual --cx <value>` or use a face track. |
| Names misspelled in captions | Add them to `data/glossary.txt`; the agent applies it before captions. |
| Very few clips score 55+ | The episode is conversational with few specifics. Ship the few good ones; ask guests for numbers and stories next time. |
| Whisper too slow | Use `--model base` for drafts or whisper.cpp; use hosted Whisper with `--allow-paid` if speed matters more than cost. |

## 9. Safety and platform rules
- Only clip content you own or have consent for. Credit guests in every clip and post.
- Never edit a clip so it changes what someone said.
- Drafts only. Publishing happens through your scheduler or social-autopilot after your approval.
- Use platform AI labels if you add AI voice or AI visuals.

# Connections

## Required
| Tool | Licence | Get it | Notes |
|---|---|---|---|
| FFmpeg with libass | LGPL/GPL | Linux: distro `ffmpeg` (usually includes libass). macOS: a build with libass, for example the homebrew-ffmpeg tap (`brew tap homebrew-ffmpeg/homebrew-ffmpeg && brew install homebrew-ffmpeg/ffmpeg/ffmpeg`) or a static build from ffmpeg.org | Check with `ffmpeg -filters | grep subtitles`. Without it, clips are cut and SRTs written, captions not burned. |
| Whisper, local | MIT | `pip install openai-whisper` (needs ffmpeg) or whisper.cpp (`whisper-cli`, ggml model file) | Free. |
| Python 3.9+ | | | Scripts use the standard library only. |

## Optional
| Service | Env var | Cost | When |
|---|---|---|---|
| OpenAI Whisper API | `OPENAI_API_KEY` | about $0.006 per audio minute (check current pricing) | Faster transcripts; only with `--allow-paid` |
| AI-Youtube-Shorts-Generator (Anil-matcha, MIT) | none in local mode | free locally | Face tracking for two-person wide shots. Use `--mode local`; its default API mode calls a paid third-party service. |
| Your scheduler | none | | Import `out/drafts.csv` (most schedulers offer CSV bulk upload) or hand it to social-autopilot. |
| treg | your own account | per call | Optional alternative for hosted transcription. |

No MCP servers are needed (`mcp.json` is empty). Keys live in your shell or a git-ignored `.env`, never in files you share.
