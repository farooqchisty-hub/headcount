## 1. What this agent gets you
A guard on your Meta and Google Ads accounts that checks every hour. If spend runs away, someone you do not know changes something, Google auto-applies a recommendation, an ad gets disapproved, billing fails or tracking stops, you hear about it within the hour with the fix.

## 2. Who it is for / not for
**For:** anyone spending on Meta or Google Ads who cannot watch Ads Manager all day: founders, small teams, agencies with many client accounts.
**Not for:** optimising performance (use roas-autopilot or google-ads-waste-killer), or platforms other than Meta and Google Ads.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Meta System User token with `ads_read` | 15 min | free |
| Google Ads API keys (same as waste killer) | 30 min, plus Basic access approval | free |
| `known_actors` and `allowed_ad_domains` in config.yaml | 5 min | free |
| Optional Slack webhook | 5 min | free |

API cost: zero. About 400 free read calls a day.

## 4. First run
```
Run ad-account-watchdog on Meta and Google. Our team is Dana Whitlow and dana@ourbrand.com, our agency uses @ouragency.com, ads only go to ourbrand.com. Show me what you see right now.
```

## 5. Running it on a schedule
- **Claude Code:** `/schedule` then "every hour at minute 10 run ad-account-watchdog; at 18:00 send the digest".
- **cron:** `10 * * * * cd /path && python3 agents/ad-account-watchdog/scripts/collect.py collect && python3 agents/ad-account-watchdog/scripts/watchdog.py --config agents/ad-account-watchdog/config.yaml --snapshot runs/ad-account-watchdog/snapshot.json --state runs/ad-account-watchdog/state.json --out runs/ad-account-watchdog/alerts.json --fail-on-p1 && python3 agents/ad-account-watchdog/scripts/notify.py --config agents/ad-account-watchdog/config.yaml --alerts runs/ad-account-watchdog/alerts.json --send`
  The scripts alone do the hourly job without an AI model; the agent adds diagnosis and the digest.
- **OpenClaw / Hermes:** hourly job with the prompt "run ad-account-watchdog".

## 6. What good output looks like
`examples/example-output.md`: a fictional candle brand whose Meta account was hijacked at 03:12. The watchdog raised 4 P1s (spend at 3.2x a normal day, unknown user added, ad to a scam domain, likely compromise), 5 P2s and the exact pause command.

## 7. Tuning: the 3 settings that matter most
1. `known_actors`: everyone and every app allowed to change the accounts. Missing names cause noise; extra names hide hacks.
2. `allowed_ad_domains`: your landing page domains. This is the strongest hack detector.
3. `auto_protect.enabled`: off by default. Turn it on to let the watchdog pause (only pause) campaigns on P1 runaway spend or off-domain ads, up to `max_pauses_per_day`.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| Every change raises C3 | Add the person's name exactly as Meta shows it, or their email or agency domain |
| No spend alerts on a small account | Lower `spend.min_spend_to_alert` |
| "watchdog cannot see google" | Refresh token revoked or developer token not at Basic access |
| Alerts at 3am for normal night spend | The baseline curve needs 7 days of data; it settles after a week |
| Pause command returns permission error | Token has `ads_read` only; add `ads_management` if you want approved pauses |

## 9. Safety and platform rules
Official Meta Marketing API and Google Ads API only, with your own keys. Read only by default. The only write it can make is pausing a campaign, and only with your yes or with auto_protect on for a P1. It never deletes, edits budgets, or touches users and payment methods.

# Connect ad-account-watchdog

Bring your own keys. Read access is enough for alerts; pausing needs write access.

## Meta (if platforms.meta is true)
| Env var | What | Where |
|---|---|---|
| `META_ACCESS_TOKEN` | System User token | Business Settings, System users, generate token for your app. Scopes: `ads_read` (alerts), `ads_management` (only if you want approved pauses). Assign the ad account and pixel to the system user |
| `META_AD_ACCOUNT_ID` | digits, no `act_` | Ads Manager |
| `META_PIXEL_ID` | optional, for the pixel silence alert | Events Manager |
| `META_API_VERSION` | optional, default `v26.0` | |

Tip: a System User token does not expire and is not tied to a person who might leave. Keep the number of human admins low; the watchdog flags more than 3.

## Google Ads (if platforms.google is true)
Same keys as google-ads-waste-killer: `GOOGLE_ADS_DEVELOPER_TOKEN` (Basic access), `GOOGLE_ADS_CLIENT_ID`, `GOOGLE_ADS_CLIENT_SECRET`, `GOOGLE_ADS_REFRESH_TOKEN` (scope `https://www.googleapis.com/auth/adwords`), `GOOGLE_ADS_CUSTOMER_ID`, optional `GOOGLE_ADS_LOGIN_CUSTOMER_ID`, `GOOGLE_ADS_API_VERSION` (default `v26`). A Read only user is enough for alerts.

## Alerts channel (optional)
| Env var | What |
|---|---|
| `HC_WATCHDOG_SLACK_WEBHOOK` (name set in `alerts.slack_webhook_env`) | a Slack incoming webhook for your own channel. Create it in your Slack workspace: Apps, Incoming Webhooks |

## Cost
Meta and Google Ads APIs are free. One hourly run is about 10 Meta reads and 7 Google queries, about 400 calls a day, well inside standard rate limits for one account each.

## MCP servers (mcp.json, all optional)
meta-ads (mikusnuz/meta-ads-mcp, MIT), google-ads (googleads/google-ads-mcp, Apache-2.0) for ad hoc questions; treg only with your own account.

## Check it works
```
python3 scripts/check_setup.py
python3 scripts/collect.py collect --platform both --dry-run     # prints every call, sends nothing
```
