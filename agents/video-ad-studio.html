## 1. What this agent gets you
Finished 15 to 30 second video ads from one customer argument: AI scenes, your real product, a clear voiceover, captions in sync, in all three feed sizes. You approve the storyboard and the cost before anything is paid for.

## 2. Who it is for / not for
For: ecommerce and app brands that need more video creative than their editor can make, agencies running UGC-style tests, teams iterating hooks on winning videos.
Not for: anyone wanting fake customer testimonials (it will not make them), regulated claims you cannot prove, or long brand films (use motion-graphics-studio).

## 3. Setup checklist
- [ ] company-brain has run; angle-miner recommended
- [ ] FFmpeg installed (free; a build with libass to burn captions)
- [ ] fal or Replicate key for clips (Seedance 2.0, Veo 3.1, Kling)
- [ ] ElevenLabs key and one chosen voice
- [ ] Optional: Node.js 18+ and HyperFrames for animated type and review cards
Time to set up: 20 to 30 minutes. Cost per 20 s ad, honest range: $5 to $25 for clips (3 AI shots at 720p, 2 takes each, Seedance listed at about $0.30 per second on fal in Nov 2026; Fast and Kling are cheaper, Veo with audio dearer) plus under $1 of voiceover. A hard cap per ad is in config.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
```
Run video-ad-studio on angle A1 from the latest angle bank. 20 seconds, problem-agitate-solve. Show me the storyboard and cost first.
```
ChatGPT:
```
Use the video-ad-studio skill. Angle: "waking up hot at 3am". Write the beat sheet and storyboard, then stop for my approval.
```

## 5. Running it on a schedule
Usually on demand. For weekly hook iterations, Wednesday 11:15:
- cron: `15 11 * * 3 cd /path/to/project && claude -p "Run video-ad-studio on this week's winner-remixer video rows"`
- Claude Code: `/schedule weekly Wednesday 11:15 Run video-ad-studio on this week's winner-remixer video rows`
Paid steps still wait for your approval.

## 6. What good output looks like
`examples/output/storyboard_v01.md` (5 beats, hook by 1.5 s, product at 5 s, cost estimate), `words.json` and `captions.*` (17 caption cards, no dead air), `qa_sample.json` (a test render passing format, length, loudness and freeze checks).

## 7. Tuning (the 3 settings that matter)
- `generation.video_model`: `seedance-2` for best motion, `seedance-2-fast` or `kling` for cheap drafts, `veo-3.1` for lip-synced speech.
- `generation.max_spend_usd_per_ad`: your safety cap.
- `beats.max_words_per_second`: lower to 2.4 for a calmer, clearer voice.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "no libass" when burning captions | Install a full FFmpeg build, or render captions in HyperFrames |
| Product changes shape in a clip | Use image to video from a clean product photo; shorten the shot; add "product does not move" |
| Dead air flagged | Close the gap between VO lines or add a planned music hit with `--planned-pauses` |
| Faces change between shots | Generate one character still first and start every shot from it |
| fal or Replicate 422 error | Model schema changed; check the model page and pass `--endpoint` or adjust fields |

## 9. Safety and platform rules
AI people and AI voices carry disclosure where platforms or laws require it. AI presenters never pose as real customers. Testimonials are real and verbatim. No cloned faces or voices without written consent. Music only with an ads licence. Nothing is uploaded by this agent.

# Connections

| Connection | Needed for | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| FFmpeg | Assembly, captions, QA | ffmpeg.org or your package manager (needs libass for captions) | Local | Free | none |
| fal | Seedance 2.0, Kling clips | fal.ai, Dashboard, Keys | Model calls | Per second of video (Seedance 2.0 720p listed about $0.30/s, Nov 2026) | `FAL_KEY` |
| Replicate | Veo 3.1, Veo 3.1 Fast | replicate.com, API tokens | Predictions | Per second or per run, shown on each model page | `REPLICATE_API_TOKEN` |
| ElevenLabs | Voiceover with word timestamps | elevenlabs.io, Profile, API keys | Text to speech | Per character on your plan | `ELEVENLABS_API_KEY` |
| OpenAI (optional) | Whisper word timestamps when speech comes from clips | platform.openai.com | Audio | Per minute | `OPENAI_API_KEY` |
| Gemini (optional) | Character stills for consistent faces | aistudio.google.com | Generative Language API | Per image | `GEMINI_API_KEY` |
| HyperFrames (optional) | Animated type, review cards, split screens | `npx hyperframes` (heygen-com/hyperframes, Apache-2.0), Node.js 18+ | Local | Free locally | none |
| treg (optional) | Only if you already have your own treg account with video models | your account | per tool | per call | `TREG_TOKEN` |

One clip provider is enough. Keys stay in your environment; scripts redact them in `--dry-run` output.
