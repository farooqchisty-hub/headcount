## 1. What this agent gets you
Creator posts bought at a fair price per view, never on follower count, with every post tracked to new customers so you know who to rebook.

## 2. Who it is for / not for
For: ecommerce brands spending $1k to $50k a month on creator posts.
Not for: buying ad footage only (use ugc-creator-finder) or commission-only partners (use affiliate-recruiter).

## 3. Setup checklist
- [ ] company-brain has run; COMPANY.md has AOV, margin, target countries
- [ ] Shopify custom app with `read_orders`, `read_discounts` (add `write_discounts` if the agent may create codes after your yes)
- [ ] Optional: Instagram Graph API, YouTube API key (both free)
- [ ] Edit config.yaml: platforms, niche, monthly_budget_usd
- [ ] `python3 scripts/check_setup.py`
Time: 20 minutes. API cost per run: $0 on free tiers.

## 4. First run
Claude Code: `Use influencer-deal-desk: find and price 5 TikTok and Reels creators for <product>, budget $3,000.`
ChatGPT / Codex: load SKILL.md as the skill, same message.
OpenClaw / Hermes: `run influencer-deal-desk "find and price 5 creators, budget $3000"`

## 5. Schedule
- Claude Code: `/schedule every Tuesday 10am: run influencer-deal-desk weekly` and `/schedule daily 8am: influencer-deal-desk step 8 attribution`
- cron: `0 8 * * * cd /path/to/headcount && claude -p "run influencer-deal-desk attribution"`

## 6. What good output looks like
`examples/example-output.md`: a price table with open, step 2 and cap per creator, rejects with reasons, and a CAC readout with a rebook fee.

## 7. Tuning
- `cpm.<platform>.cap`: your walk-away price per 1,000 views.
- `target_cac_usd`: what a new customer is worth to you; drives rebook verdicts.
- `min_audience_match`: raise to 0.7 if you ship to one country only.

## 8. Troubleshooting
1. **Every creator is "need data":** creators hide views on IG. Ask for an insights screenshot of the last 10 Reels.
2. **All asks above cap:** your niche may be pricier; raise the niche multiplier in config by 0.2, or move to bundles and bonuses.
3. **Zero attributed orders:** check the code exists and the UTM link was in bio. Check orders export includes discount codes.
4. **YouTube quota exceeded:** each search costs 100 units. Cut searches to 50 a day.
5. **Code abuse from coupon sites:** set usage limit 1 per customer and watch orders from non-target countries.

## 9. Safety and platform rules
- Every sponsored post must be disclosed (FTC 16 CFR 255 in the US, ASA/CAP in the UK, platform paid-partnership tools).
- Official APIs and the creator's own screenshots only. No login scraping.
- No payments, codes or contracts without your yes. No advances by default.

# Connections: influencer-deal-desk

Nothing is strictly required: without keys the agent gives you exact searches and reads numbers from creator screenshots. Shopify read access is strongly recommended for attribution.

| What | Why | Where | Scopes | Cost | Env var |
|---|---|---|---|---|---|
| Instagram Graph API | Business discovery (followers, recent media with like and comment counts), hashtag search | developers.facebook.com app + Instagram professional account | `instagram_basic`, `pages_show_list`, `instagram_manage_insights`. Hashtag search: 30 unique tags per 7 days | Free | `META_ACCESS_TOKEN`, `IG_BUSINESS_ACCOUNT_ID` |
| YouTube Data API v3 | Channel and video search, view counts | console.cloud.google.com, enable YouTube Data API v3, create API key | Public data. search.list = 100 units, videos.list = 1 unit; 10,000 units per day free | Free | `YOUTUBE_API_KEY` |
| TikTok One | Creator search with verified stats | tiktok.com/one with TikTok Business account | UI free; API only for approved partners | Free | `TIKTOK_BUSINESS_TOKEN` (partners only) |
| X API v2 | Search posts, impressions on public posts | developer.x.com | Read | Paid tier; check current pricing | `X_BEARER_TOKEN` |
| Shopify Admin API | Orders by code and UTM; create discount codes after approval | Shopify admin, Settings, Apps, Develop apps | `read_orders`, `read_discounts`, `write_discounts` (write only if you allow code creation) | Free | `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_STORE` |

MCP servers in `mcp.json`: `shopify-mcp` (MIT, GeLi2001/shopify-mcp) for orders and discounts; `@playwright/mcp` (Apache-2.0) to open public profile pages. Optional: Seym0n/tiktok-mcp (MIT) if you want TikTok search in your runtime; install per its README.
Optional: your own treg account can replace the search APIs. Direct APIs above come first.
