## 1. What this agent gets you
Ten genuinely different reasons people buy, ranked, each backed by at least three real customer quotes. Your ad makers stop guessing and stop making the same ad fifty times.

## 2. Who it is for / not for
For: ecommerce and DTC brands with some reviews (yours or a competitor's), agencies starting a new client, anyone whose Meta ads all look alike.
Not for: brands with no reviews and no competitors with reviews (there is nothing to mine yet; start with a post-purchase survey), or B2B with long sales cycles (use sales call notes as CSV instead, it works but needs more manual tagging).

## 3. Setup checklist
- [ ] company-brain has run (../../brain/COMPANY.md exists with products and competitors)
- [ ] Your review app export as CSV (Judge.me, Yotpo, Okendo, Stamped, Loox all export). 5 minutes.
- [ ] Optional: Reddit app keys (free, 5 minutes) for higher limits
- [ ] Optional: Apify token if you want Amazon reviews pulled for you (paid per run, roughly $0.50 to $3 per 1,000 reviews depending on the actor)
Time to set up: 10 to 20 minutes. API cost per run: $0 with CSV, public pages and Reddit. The thinking (clustering) runs on your own AI plan.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
```
Run angle-miner. My review export is at ./exports/reviews.csv. Competitors are in COMPANY.md. Give me the 10 angle bank.
```
ChatGPT (upload the CSV and this folder as a project):
```
Use the angle-miner skill on the attached reviews. Follow SKILL.md step by step and stop for my approval at the end.
```

## 5. Running it on a schedule
Monthly refresh, first Monday at 08:10:
- cron: `10 8 1-7 * 1 cd /path/to/project && claude -p "Run angle-miner monthly refresh"`
- Claude Code: `/schedule monthly first Monday 08:10 Run angle-miner monthly refresh`
- OpenClaw or Hermes: add a scheduled task with the same prompt.

## 6. What good output looks like
See `examples/output/angle-bank.md`: 10 angles across pains, desires, objections and moments, each with a score, saturation, and three or more quotes, plus a dropped list explaining what failed and why.

## 7. Tuning (the 3 settings that matter)
- `scoring.saturation_penalty`: raise to 0.8 in crowded categories to push white space angles up; lower to 0.3 if you have much stronger proof than rivals.
- `scoring.min_mentions`: drop to 3 for small brands (under 100 reviews), raise to 10 for big catalogues.
- `scoring.max_per_type`: lower to 3 to force more variety.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Bank has fewer than 10 angles | Add a source (Reddit or a competitor's 1 to 3 star reviews) or lower `min_mentions` |
| "quote not verbatim" drops | The quote was paraphrased. Copy it exactly from the review text |
| Trustpilot returns nothing | Page layout changed or rate limited. Export or copy reviews into CSV |
| Two angles feel the same | Lower `duplicate_argument_overlap` to 0.45 and rerun |
| Every angle is a pain | Mine 5 star reviews for desires and moments; raise own review target |

## 9. Safety and platform rules
Read only. It never posts or replies. Go slow on public pages (2 second delay by default), respect robots.txt and site terms, and never scrape behind a login. Competitor reviews are research: never show a competitor's customer quote in your ads as a testimonial. Strip personal data from every quote.

# Connections

Nothing here is required. With only a CSV export the agent runs fully.

| Connection | Needed for | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| Review app CSV | Your own reviews | Your review app admin: Export reviews | Your data | Free | none (file path) |
| Judge.me API | Own reviews without manual export | Judge.me admin, Settings, Integrations, View API token (private token) | Read reviews | Free | `JUDGEME_API_TOKEN` |
| Yotpo public widget | Own or competitor Yotpo stores | App key from the store's review widget code | Public read | Free | none |
| Reddit API | Reddit search at higher limits | reddit.com/prefs/apps, create a "script" app | Read only, client credentials | Free within Reddit API terms | `REDDIT_CLIENT_ID`, `REDDIT_CLIENT_SECRET` |
| Apify (optional) | Amazon and Trustpilot actors | console.apify.com, Settings, Integrations | Run actors | Pay per run on your account | `APIFY_TOKEN` |
| Playwright MCP | Reading public pages and the Meta Ad Library web page | `npx @playwright/mcp` (Apache-2.0) | none | Free | none |
| treg (optional) | If you already have your own treg account for review or ad library tools | your treg account | per tool | per call | `TREG_TOKEN` |

Store keys in your shell profile or a `.env` file that is git ignored. The scripts read them from the environment and never print them.
