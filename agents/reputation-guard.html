## 1. What this agent gets you
Every review and brand mention gets a fast, specific answer in your voice. Anything about safety, legal threats or 1 to 2 stars lands in front of you within hours, and each Monday you get the themes customers praise and complain about.

## 2. Who it is for / not for
For: shops, apps and local businesses with reviews on Google, Trustpilot, the App Store or Play, and mentions on Reddit or X.
Not for: buying, filtering or removing honest reviews, or replying to every mention on the internet with promotion.

## 3. Setup checklist
- [ ] company-brain done (voice, support contact, policies).
- [ ] Google Business Profile API access requested (form approval can take days), or another source connected (CONNECT.md).
- [ ] Set `brand_terms`, `escalation.notify`, `reply_rules.public_contacts` in config.yaml.
Cost: review APIs are free (Trustpilot depends on plan); X reads per your plan. LLM cost: under a cent per reply.

## 4. First run
Claude Code / Codex / OpenClaw / Hermes:
> Run reputation-guard. Pull new reviews from Google and Trustpilot and brand mentions on Reddit and X, escalate anything risky, and show me the drafted replies.

ChatGPT:
> Use the reputation-guard skill. Here are this week's reviews as CSV. Triage them, draft replies and write the theme report.

## 5. Running it on a schedule
- Every 2 hours, 08:00 to 20:00: `Run reputation-guard pull and triage` (cron `0 8-20/2 * * *`).
- Monday 09:20: `Run reputation-guard weekly theme report` (cron `20 9 * * 1`).
Claude Code `/schedule` or the OpenClaw/Hermes scheduler.

## 6. What good output looks like
`examples/example-output.md`: a glass-in-tin safety review escalated at the top, a chargeback threat routed to legal, a draft that failed the gate for admitting liability and sharing a phone number, a passing specific reply to a 2 star shipping review, and the weekly theme report.

## 7. Tuning (the 3 settings that matter)
- `escalation.safety_words` and `legal_words`: add words specific to your product (for cosmetics: "burning", "rash"; for food: "undercooked").
- `sla_hours`: how fast each class must be answered.
- `auto_reply.five_star`: turn on after 20 approved 5 star replies with no edits.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| GBP returns 403 | API access not approved yet, or the account is not owner or manager of the location |
| GBP reply not showing | Check `ReviewReplyState`; the reply may be in moderation or rejected |
| Google Play shows no reviews | The API only returns the last 7 days and only reviews with text: run at least weekly |
| Reddit reply removed | Subreddit bans brand accounts; mark it "monitor only" |
| Too many false SAFETY flags | Words like "burn" in "freezer burn": add a phrase to the safety list instead of the single word |

## 9. Safety and platform rules
- Safety and legal items are always handled by a human. The agent never admits liability or argues in public.
- No customer personal data in public replies. No incentives for reviews, no review gating, no fake reviews (FTC rule, Google and Trustpilot policies).
- Reddit replies are disclosed and only where the subreddit allows them. X replies only where you were mentioned.

# Connect: reputation-guard

Env vars only. Connect the sources you use; one is enough.

| Env var | What it is | Where to get it | Scopes | Cost |
|---|---|---|---|---|
| `GBP_OAUTH_TOKEN`, `GBP_ACCOUNT_ID`, `GBP_LOCATION_IDS` | Google Business Profile reviews | Google Cloud project, request Business Profile API access (form, approval takes days), enable My Business APIs, OAuth as a location owner or manager | `https://www.googleapis.com/auth/business.manage` | Free |
| `TRUSTPILOT_ACCESS_TOKEN`, `TRUSTPILOT_BUSINESS_UNIT_ID`, `TRUSTPILOT_BUSINESS_USER_ID` | Trustpilot reviews and replies | developers.trustpilot.com, API key plus business user OAuth | Business user | API access depends on your Trustpilot plan |
| `ASC_KEY_ID`, `ASC_ISSUER_ID`, `ASC_PRIVATE_KEY_PATH` | App Store Connect API | App Store Connect, Users and Access, Integrations, generate key (Customer Support role) | n/a | Free |
| `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON` | Path to a service account key linked in Play Console | Play Console, API access | Reply to reviews permission | Free |
| `REDDIT_CLIENT_ID`, `REDDIT_CLIENT_SECRET` | Read-only brand mention search | reddit.com/prefs/apps, script app | read | Free within Reddit Data API limits |
| `X_BEARER_TOKEN` (+ user tokens to reply) | Mention search and replies to mentions | developer.x.com | read; read and write for replies | Per your X plan |
| `SLACK_WEBHOOK_URL` | Escalation alerts | Slack, Incoming Webhooks | n/a | Free |

## MCP servers (mcp.json)
- `reddit`: karanb192/reddit-mcp-buddy, MIT licence, read-only browsing and search. Verify the npm package name before install.
- `twitter`: EnesCinr/twitter-mcp, MIT licence. Optional; direct X API calls work too.
- No MCP for Google Business Profile, Trustpilot, App Store or Play: the agent calls the official REST endpoints in references/source-apis.md.
- Optional: treg, only with your own treg account, for Business Profile access through a connected account.

## Never
- Never use a scraper to post replies or log in as you.
- Never buy, filter or incentivise reviews.
