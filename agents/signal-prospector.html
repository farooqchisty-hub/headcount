## 1. What this agent gets you
Every morning, a short list of companies that just did something that means they may buy from you: hired for the role you serve, raised money, dropped a competitor, got a new marketing boss. Each one has a score, the person to contact and one sentence on why now.

## 2. Who it is for / not for
- **For:** B2B software, agencies and ecommerce tool sellers with a clear ICP and a deal worth a personal email (roughly 1,000 USD a year or more).
- **Not for:** selling to consumers; very broad ICPs ("any business") where every company fits; teams with no one to act on the list each day.

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| company-brain run (ICP, competitors) | yes | once | free |
| Fill the `icp` block in config.yaml | yes | 10 min | free |
| Watch list of 50 to 300 accounts | yes | 20 min first time (the agent helps) | free |
| HubSpot private app token | optional, to push to CRM | 10 min | free with HubSpot |
| Apollo key or MCP | optional, to find people | 5 min | your Apollo plan |
| BuiltWith, Crunchbase, X API, Exa | optional sources | 5 min each | their plans |

Cost per daily run with only free sources: 0 USD. Time: about 2 seconds per page fetched, so 300 accounts with 3 pages is roughly 30 minutes unattended.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run signal-prospector. Set up my ICP from the brain file, build a watch list of 100 accounts, and show me today's hot accounts.

ChatGPT:
> Use the signal-prospector skill. Here is my account list (attached). Find buying signals and score them.

Demo with no setup:
> Run signal-prospector on the example accounts in fixture mode.
(The agent runs `job_posts.py` and `detect_tech.py` with `--fixture` and scores `examples/`.)

## 5. Running it on a schedule
- cron: `30 6 * * * cd /path/to/headcount/agents/signal-prospector && python3 scripts/job_posts.py ../../data/signals/accounts.csv --out ../../data/signals/raw/jobs-$(date +\%F).jsonl && python3 scripts/detect_tech.py ../../data/signals/accounts.csv --out ../../data/signals/raw/tech-$(date +\%F).jsonl`
  then let the agent do Steps 3 to 7 (research, scoring, checking, CRM) when you open your session.
- Claude Code: `/schedule daily 06:30 run signal-prospector and post the digest`
- OpenClaw or Hermes: a daily 06:30 job with the message "Run signal-prospector daily shift".

## 6. What good output looks like
See `examples/example-output-digest.md` (example, fictional brands): four hot accounts, each with a checkable reason, for example a store that moved platforms and dropped a competitor's widget the same week.
Good means: 5 to 20 hot accounts a day per 300 watched, every why-now line true when you click it.

## 7. Tuning
1. `icp.hiring_keywords`: the job titles that mean "they need you". The single biggest lever.
2. `scoring.tiers.hot` (default 70): raise it if you get more hot accounts than you can contact in a day.
3. `scoring.signal_overrides`: after 60 days, set strengths from your own win rates (Step 8 does the maths).

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| No tech change signals | Change signals need two snapshots. They start on day two. |
| Job board returns nothing | The `ats` token is wrong. Open the careers page and copy the slug from the board URL. |
| Every site shows the same tech | A cookie wall or bot page was fetched. Check one page in a browser; consider BuiltWith for that account. |
| Too many hot accounts | Raise `tiers.hot` or narrow `hiring_keywords`. |
| HubSpot 400 on push | Run `push_crm.py --create-properties --live --approved` once to create the custom fields. |

## 9. Safety and platform rules
- Only public pages and official APIs. No scraping of LinkedIn or other logged-in sites.
- The scripts identify themselves with your contact email and wait between requests.
- Signals about layoffs raise priority only; your emails never mention them.
- Keep the `source_url` for every signal: it is your record of where the data came from.

# Connect: signal-prospector

Nothing is required to start. Free sources need no key. Everything else is optional and BYOK.

| Service | Env var | Where to get it | Scopes or plan | Cost | Used for |
|---|---|---|---|---|---|
| Greenhouse, Lever, Ashby job boards | none | public | none | free | hiring signals |
| Company homepages | none | public | none | free | tech and page-change signals |
| SEC EDGAR | none (set `limits.user_agent_contact`) | public | none | free | US Form D filings |
| HubSpot | `HUBSPOT_ACCESS_TOKEN` | Settings, Integrations, Private Apps | `crm.objects.companies.read`, `crm.objects.companies.write`, `crm.objects.contacts.read`, `crm.schemas.companies.write` (for creating properties once) | free tier works | read relationships, push hot accounts and tasks |
| Apollo | `APOLLO_API_KEY` or Apollo MCP (OAuth) | Apollo, Settings, Integrations, API | plan with API access | credits per reveal | people at accounts, company search |
| BuiltWith | `BUILTWITH_API_KEY` | builtwith.com, API | paid for full lookups | per lookup | tech history with first-seen dates |
| Crunchbase | `CRUNCHBASE_API_KEY` | data.crunchbase.com | Basic or Enterprise API | paid | funding rounds |
| X API v2 | `X_BEARER_TOKEN` | developer.x.com | a paid tier with recent search | paid | pain keyword posts |
| Exa | `EXA_API_KEY` or Exa MCP | dashboard.exa.ai | none | pay per search | news and web search |
| Google PageSpeed Insights | `PAGESPEED_API_KEY` | Google Cloud console, enable PageSpeed Insights API | none | free quota | slow-site signal |
| treg (optional) | your own treg account | treg.dev style registry | your account | per call | stand-in for any single source above, only if you already have an account |

MCP servers in `mcp.json`: Apollo (official, MIT), HubSpot (`@shinzolabs/hubspot-mcp`, MIT), Exa (official, MIT).

Verify before first live use: HubSpot task association type id 192 (task to company) is the documented HUBSPOT_DEFINED value at the time of writing; if task creation returns 400, check the associations API in your portal.
