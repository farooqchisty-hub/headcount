## 1. What this agent gets you
Search articles that rank without you rewriting them, because each one is built on what already ranks plus something only you have: a real test, story or number from your business. It also catches pages losing traffic and refreshes them.

## 2. Who it is for, and not for
- For: brands with a Search Console property and at least some impressions, who can give 15 minutes of real input per article.
- For: teams tired of AI drafts that need an editor to fix.
- Not for: "100 articles a month" volume plays. The agent caps new articles at 4 a week on purpose.
- Not for: anyone unwilling to supply first-hand input. The agent will not draft without it.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Company brain and voice file | 30 min, once | free |
| Search Console token (CONNECT.md) | 15 min | free |
| Optional DataForSEO keys for keyword gap and SERP data | 5 min | pay as you go, roughly cents per SERP and per keyword list (check pricing) |
| CMS key: WordPress application password, Webflow token or Shopify admin token | 10 min | free |
Honest cost per article on the paid path: under $1 in API calls. On the free path: $0. Your time: 15 minutes of input, 10 minutes of review.

## 4. First run
> Run seo-content-pipeline. Find my page-two queries and decaying pages from Search Console, propose this week's 4 topics, and tell me what first-hand input you need for each.

## 5. Running it on a schedule
- Monday opportunities (cron): `0 7 * * 1 cd /path/to/seo-content-pipeline && python3 scripts/gsc.py queries --site sc-domain:your-site --days 90 --out data/gsc_queries.csv && python3 scripts/opportunities.py page2 --queries data/gsc_queries.csv --out data/page2.csv`
- Friday tracking: `/schedule every Friday 9am: seo-content-pipeline tracking report`
- OpenClaw or Hermes: weekly job with the First run message.

## 6. What good output looks like
`examples/` (fictional "Trailhen"): page-two opportunities with estimated extra clicks, a SERP study, a brief, a 753-word draft with two first-hand blocks that passes the slop check, the HTML with BlogPosting and FAQ schema, link suggestions, a tracking table and a decay list with likely causes.

## 7. Tuning
1. `opportunities.page2_min_impressions`: raise on big sites to focus on queries that matter.
2. `draft.max_words_over_serp_median`: keeps articles from padding.
3. `opportunities.max_new_briefs_per_week`: 4 by default. More only if your input keeps up.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| slop_check fails on rhythm | Mix very short sentences with longer ones; read it aloud. |
| "first-hand input: 0 blocks" | You have not supplied input yet. The agent sent you the ask list. |
| WordPress 401 | Use an application password (Users, Profile, Application Passwords), not your login password. |
| Shopify userErrors | blogId must be the full gid (gid://shopify/Blog/123) and the token needs write_content. |
| Article "not_found" at day 30 | Not indexed. technical-seo-fixer checks it. |

## 9. Safety and platform rules
- Google's spam policies and helpful content guidance: no scaled low-value pages, no fake experience, no invented reviews or quotes.
- Real author names only, with their real experience. AI drafting is fine; deception about who wrote or tested something is not.
- The agent creates drafts. A human publishes.
- Polite SERP fetching: robots.txt honoured, 2 seconds between requests, top 10 only.

# Connect: keys and services

Need at least one data path. CMS keys only for Step 8.

| Env var | Service | Where to get it | Scope | Cost | Used for |
|---|---|---|---|---|---|
| `GSC_ACCESS_TOKEN` | Search Console API | Google Cloud OAuth client; scope `https://www.googleapis.com/auth/webmasters.readonly` | read only | free | page-2 queries, cannibalisation, decay, tracking |
| `DATAFORSEO_LOGIN`, `DATAFORSEO_PASSWORD` | DataForSEO Labs + SERP API | app.dataforseo.com/api-access | Basic auth | pay as you go; check current per-task pricing | keyword gap, top-10 SERP |
| `WP_URL`, `WP_USER`, `WP_APP_PASSWORD` | WordPress REST API `POST /wp-json/wp/v2/posts` | WP admin, Users, Profile, Application Passwords | user with Author or Editor role | free | draft creation |
| `WEBFLOW_TOKEN` | Webflow Data API v2 `POST /v2/collections/{id}/items` | Webflow site settings, Apps and integrations, API access | `CMS:write` | free | draft CMS item (isDraft true) |
| `SHOPIFY_ADMIN_TOKEN` | Shopify Admin GraphQL `articleCreate` (API version 2026-10) | Shopify admin, Settings, Apps, Develop apps, custom app | `write_content` | free | blog article with isPublished false |

## Notes
- WordPress: application passwords need HTTPS. Some security plugins block REST; allowlist `/wp-json/wp/v2/posts`.
- Webflow: set `publish.webflow_collection_id` and `publish.webflow_body_field` (the rich text field's slug) in config.yaml.
- Shopify: set `publish.shopify_shop` and `publish.shopify_blog_id` (find it with the `blogs` query in GraphiQL).
- Search Console tokens from gcloud last about an hour; for cron use a service account added to the property.

## MCP (optional)
mcp.json: Search Console MCP (MIT) for interactive queries, DataForSEO official MCP (Apache-2.0). The scripts do not need them.

## Optional
- treg, only with your own account, can supply SERP and keyword data. Direct DataForSEO is the primary paid path.
