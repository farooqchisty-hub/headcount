## 1. What this agent gets you
Fresh ads every week built from what already works: your own winners, improved one change at a time, plus the skeletons of competitors' longest running ads filled with your own arguments. New ads arrive in your account paused, waiting for your yes.

## 2. Who it is for / not for
For: brands and agencies spending on Meta with at least a few ads that have converted, or with competitors who advertise.
Not for: accounts with no spend history and no competitors on Meta (start with angle-miner and static-ad-factory), or anyone wanting ads switched on automatically (that is roas-autopilot, behind its own approvals).

## 3. Setup checklist
- [ ] company-brain has run (ad account id, target CPA or ROAS, competitor page ids)
- [ ] Meta system user token with `ads_read` (and `ads_management` only if you enable paused uploads). 15 minutes.
- [ ] Optional: Ad Library API access (developer identity verification, a few days the first time), or use CSV from the Ad Library website
- [ ] angle-miner has run (for net new concepts)
Time to set up: 20 to 40 minutes. API cost: $0 (Meta APIs are free). Making the new ads costs whatever static-ad-factory and video-ad-studio spend, each with its own approval.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
```
Run winner-remixer for act_XXXXXXXX. Target CPA $30. Competitors are in COMPANY.md. Build this week's iteration matrix.
```
ChatGPT:
```
Use the winner-remixer skill. Here are my ads export (CSV) and an Ad Library CSV for two competitors. Build the matrix and briefs.
```

## 5. Running it on a schedule
Weekly, Monday 10:40 (after monday-standup):
- cron: `40 10 * * 1 cd /path/to/project && claude -p "Run winner-remixer weekly"`
- Claude Code: `/schedule weekly Monday 10:40 Run winner-remixer weekly`
- OpenClaw or Hermes: scheduled task with the same prompt.
Meta reads are capped at 2 per day by default.

## 6. What good output looks like
`examples/output/`: `own_ads.json` (2 winners, 1 fatigued, 2 losers, 1 too new to judge), `competitor_ads.json` (2 unique long runners, a stopped sale ad ignored), `matrix.csv` (30 rows: 18 one-lever iterations, 4 adaptations, 8 net new).

## 7. Tuning (the 3 settings that matter)
- `own_ads.target_cpa` or `target_roas`: everything is judged against it.
- `matrix.min_net_new_share`: raise to 0.5 when results plateau; lower to 0.2 when a few winners carry the account.
- `competitors.min_days_running`: 30 is standard; use 60 in slow categories where brands leave ads on longer.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Graph API code 190 | Token expired. Use a system user token (does not expire) |
| Graph API code 17 or 613 | Rate limit. The script backs off; keep reads to twice a day |
| Ad Library API returns nothing | Commercial ads only come back for EU or UK delivery. Use EU country codes or the website CSV route |
| Everything is "not_enough_data" | Lower `min_spend_multiple_of_cpa` to 1.5, or wait a week |
| Upload error on image | Use the 4:5 or 1:1 PNG under 30 MB; check `ads_management` permission |

## 9. Safety and platform rules
Official Meta APIs first. Ad Library website reads stay at a human pace with no login bypass. Competitor ads are studied, never copied: no words, images, music or people reused. New ads are uploaded paused only, never switched on by this agent.

# Connections

| Connection | Needed for | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| Meta Marketing API | Own ad insights; paused uploads | Business Settings, Users, System users: generate a token for your app with the ad account assigned | `ads_read` (insights); add `ads_management` and `pages_read_engagement` only for paused uploads | Free | `META_ACCESS_TOKEN` |
| API version | Graph API version | developers.facebook.com/docs/graph-api/changelog | none | Free | `META_API_VERSION` (default v25.0) |
| Meta Ad Library API | Competitor long runners (EU and UK delivered commercial ads) | facebook.com/ads/library/api: confirm identity, create an app, get a user token | Ad Library access | Free | `META_ADLIB_TOKEN` |
| Ad Library website | Competitor ads in every country | None | Public | Free | none |
| Playwright MCP | Reading the Ad Library website and snapshots | `npx @playwright/mcp` (Apache-2.0) | none | Free | none |
| Meta Ads MCP (optional) | Chat access to your account for ad hoc questions | mikusnuz/meta-ads-mcp (MIT) | Same token | Free | `META_ACCESS_TOKEN` |
| Apify (optional) | Ad Library website at scale | console.apify.com | Run actors | Paid per run | `APIFY_TOKEN` |
| treg (optional) | Only if you already have your own treg account with ad library tools | your account | per tool | per call | `TREG_TOKEN` |

Do not use pipeboard meta-ads-mcp: its BSL licence forbids this kind of resale.
