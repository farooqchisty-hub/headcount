## 1. What this agent gets you
Every product page and Google Shopping title rewritten so more people find your products in search and more of them buy. Every change is backed up and can be undone in one command.

## 2. Who it is for / not for
- For: Shopify stores with 20 to 20,000 products where titles, descriptions, alt text and meta were written fast or copied from suppliers.
- Not for: stores on other platforms (the scripts are Shopify specific; the method and feed builder work anywhere), or catalogs where legal must review every word (it still drafts, but plan the review time).

## 3. Setup checklist
- [ ] Shopify custom app with `read_products`, `write_products`, `write_files`, and its Admin token. No token yet? Start from your product export (Shopify admin: Products, Export, CSV); the agent drafts and checks everything from it, and you paste the approved copy in, or add the token later to push.
- [ ] A vision model key (Anthropic, OpenAI or OpenRouter). Optional but it is what makes alt text and attributes accurate.
- [ ] Search Console access for real search queries (free). DataForSEO optional.
- [ ] company-brain run, including which claims you can prove.
- Time to set up: about 15 minutes.
- Cost per 1,000 products: Shopify free; vision about $2 to $10; demand free to $5.

## 4. First run
> Run catalog-optimizer. Back up my catalog, then draft new titles, descriptions, alt text, meta and Shopping titles for my top 100 products by revenue. Show me the 20-SKU spot check. Do not push anything.

## 5. Running it on a schedule
- Claude Code: `/schedule` "every Tuesday 07:00 run catalog-optimizer weekly (new and edited products)" and "first Tuesday of the month, CTR refresh".
- cron: `0 7 * * 2 cd ~/headcount && claude -p "run catalog-optimizer weekly"`
- OpenClaw / Hermes: same prompts in the scheduler.

## 6. What good output looks like
`examples/example-output.md`: what was wrong before (empty alt, promo titles, missing meta), before and after for an approved product, per-variant feed titles under 150 characters, a lint-clean spot check, and a dry-run push that refuses to go live without a backup.

## 7. Tuning
- `copy.allowed_claims`: the claims the agent may use. Empty means it uses none.
- `batch_size` and `canary_size`: smaller batches are easier to review.
- `feed.id_format`: must match your Merchant Center item ids or the supplemental feed will not attach.

## 8. Troubleshooting
1. `ACCESS_DENIED` on fileUpdate: add the `write_files` scope and reinstall the app.
2. Supplemental feed shows "item not found": ids do not match. Check one item id in Merchant Center and set `feed.id_format`.
3. Throttled errors: the client waits and retries; large catalogs should use smaller batches or bulk operations.
4. Vision says a different color than the variant: wrong image assigned to the variant. Fix in Shopify; the agent will not guess.
5. Clicks dropped after a change: run `restore_catalog.py <backup> --ids <id>` and the product is back as it was.
6. "product came from a CSV export" when pushing: that catalogue was read from your export, which has no API ids. Paste the approved copy in Shopify admin, or connect the Admin token, take a fresh API backup and push.
7. WooCommerce store: export Products from WooCommerce and use the same `--csv` path for drafts and feed titles; pushing is Shopify only.

## 9. Safety and platform rules
- Backup before every push, enforced by the script. Restore by product or by push log.
- Handles (URLs) are never changed.
- No promotional text or unproven claims in titles or feeds (Merchant Center editorial rules and consumer protection law).
- Nothing is pushed or uploaded without your approval.

# Connect catalog-optimizer

| What | Env var | Where | Scopes | Cost |
|---|---|---|---|---|
| Store domain | `SHOPIFY_STORE_DOMAIN` | `yourstore.myshopify.com` | | |
| Admin API token | `SHOPIFY_ADMIN_TOKEN` | Shopify admin > Settings > Apps and sales channels > Develop apps > create app > Admin API scopes > install > reveal token once | `read_products`, `write_products`, `write_files` (add `read_orders` for revenue priority) | free |
| API version (optional) | `SHOPIFY_API_VERSION` | default `2025-10` | | |
| Vision model (one of) | `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`, `OPENROUTER_API_KEY` | console.anthropic.com, platform.openai.com, openrouter.ai | | about $1 to $5 per 1,000 images on small vision models; check your provider's pricing |
| Search Console (free demand) | `GSC_SITE_URL` + Google service account (`GOOGLE_APPLICATION_CREDENTIALS`) | Search Console > Settings > Users > add the service account email | webmasters.readonly | free |
| DataForSEO (optional demand) | `DATAFORSEO_LOGIN`, `DATAFORSEO_PASSWORD` | app.dataforseo.com > API access | | pay as you go, Keywords Data search volume is cents per request; capped by `dataforseo_max_spend_usd` |
| Merchant Center (feed upload, optional) | manual upload, or Merchant API with `GOOGLE_APPLICATION_CREDENTIALS` | merchants.google.com | content | free |

## No token: your product export
Shopify admin, Products, Export, "All products", CSV (either CSV option works). WooCommerce: Products, Export. Then `python3 scripts/backup_catalog.py --csv <file> --currency INR`. Drafting, feed titles and the spot check work from it; pushing needs the token above.

## MCP servers
- `shopify-dev` (official Shopify dev MCP): schema and docs lookups, no store data.
- `shopify-admin` (GeLi2001/shopify-mcp, MIT): optional interactive reads.
- Search Console: `saurabhsharma2u/search-console-mcp` (MIT) can be added if you prefer MCP to the API.

## Cost per full pass (1,000 products, honest estimate)
Shopify API: free. Vision: about $2 to $10 for 4,000 images. Demand: free with Search Console; under $5 with DataForSEO. Model tokens for copy: depends on your runtime plan.

## Never
Never paste the Admin token in chat. Revoke it in the app settings if it leaks.
