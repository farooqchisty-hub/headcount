## 1. What this agent gets you
Every inbound lead answered in minutes, qualified, shown a demo, quoted from your real prices and sent a payment link. It keeps following up until the lead pays or says no, and hands you the big deals.

## 2. Who it is for / not for
- **For:** businesses with inbound leads and a clear price list: SaaS, agencies with packages, B2B services, high-ticket ecommerce, course and coaching sellers.
- **Not for:** fully custom enterprise deals with no price list (use it only for first response and qualification), or anyone who wants it to invent discounts.

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| Pricing file (`./data/sales/pricing.json`) | yes | 20 min | free |
| Stripe or Razorpay API key | yes, for payment links | 10 min | their normal fees per payment |
| CRM (HubSpot private app) | recommended | 10 min | free tier works |
| Cal.com API key | optional, for booking | 5 min | free plan works |
| WhatsApp Business Platform number plus approved templates | optional | 1 to 3 days for Meta approval | Meta per-message fees |
| 2 to 3 short demo recordings | recommended | 30 min | free |

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run ai-sales-closer. Here is my pricing (attached). Check the open leads and tell me what you would send to each.

ChatGPT:
> Use the ai-sales-closer skill. New lead from my site: "<paste>". Reply and qualify them.

Demo: `python3 scripts/next_best_action.py --selftest` and `python3 scripts/render_proposal.py --pricing examples/example-pricing.json --deal examples/example-deal.json --dry-run`.

## 5. Running it on a schedule
- New leads every 5 minutes in working hours: `*/5 8-20 * * * cd /path/to/headcount && claude -p "ai-sales-closer: handle new leads"` (or a form webhook that starts the same message).
- Daily follow-ups: Claude Code `/schedule daily 09:00 run ai-sales-closer follow-ups`.
- OpenClaw or Hermes: a 5-minute job and a daily 09:00 job.

## 6. What good output looks like
See `examples/` (example, fictional brands): `example-output-actions.txt` shows 13 leads with the right action for each (reply now, qualify, hand off a 48k deal, refuse a 25% discount without a human, stop after an explicit no). `example-output-proposal.md` is a finished quote.
Good means: median first response under 5 minutes, every quote matches the pricing file, no lead left without a next step.

## 7. Tuning
1. `handoff.deal_value_usd` (10,000): above this a human owns the deal.
2. `discounts.max_pct_without_approval` (10%): the most the agent may offer alone.
3. `cadence.followup_days` and `max_touches`: match your sales cycle; longer cycles need wider gaps, not more touches.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| render_proposal exits 5 | A rule failed (SKU missing, discount over limit). Read the message; get approval or fix the deal file. |
| WhatsApp message blocked (exit 6) | Outside the 24-hour window or no opt-in. Use the approved template or email. |
| Stripe 400 on price_data | Your Stripe API version may predate inline prices on Payment Links; create a Price first or update the API version. |
| Razorpay 400 "reference_id already exists" | Each link needs a unique reference; add a suffix to the deal id. |
| Leads get duplicate replies | Two triggers fire (webhook plus poll). Keep one. |

## 9. Safety and platform rules
- Every message from the agent says it is an AI assistant unless a named person approved it.
- Never collects card details: payments only through Stripe or Razorpay hosted links.
- WhatsApp: opt-in only, templates outside the 24-hour window, marketing templates off by default. Meta can lower your number's limits if people block you.
- Follow-ups stop at the first clear no or unsubscribe.

# Connect: ai-sales-closer

| Service | Env var | Where to get it | Scopes or settings | Cost | Used for |
|---|---|---|---|---|---|
| Stripe | `STRIPE_SECRET_KEY` (use a restricted key) | Dashboard, Developers, API keys, create restricted key | Payment Links write, Products and Prices write, Checkout Sessions read | Stripe fees per payment | `POST /v1/payment_links` with inline `price_data` |
| Razorpay | `RAZORPAY_KEY_ID`, `RAZORPAY_KEY_SECRET` | Dashboard, Account and Settings, API keys | Basic auth | Razorpay fees per payment | `POST /v1/payment_links` |
| HubSpot | `HUBSPOT_ACCESS_TOKEN` | Private app | `crm.objects.contacts.read/write`, `crm.objects.deals.read/write` | free tier works | leads, deals, stages |
| Cal.com | `CALCOM_API_KEY` | Settings, Developer, API keys | send the `cal-api-version` header listed on each endpoint's doc page | free plan works | slots and bookings |
| WhatsApp Business Platform (Cloud API) | `WHATSAPP_TOKEN`, `WHATSAPP_PHONE_NUMBER_ID` | Meta for Developers app, WhatsApp product, permanent system user token | `whatsapp_business_messaging` | Meta per-message rates by country and category | messages and templates |
| Gmail API | `GMAIL_OAUTH_TOKEN` | Google Cloud OAuth client | `gmail.send`, `gmail.readonly` | free | email replies |
| DocuSeal (optional e-sign) | `DOCUSEAL_API_KEY` | docuseal.com (hosted) | API | paid plans | contracts. DocuSeal is AGPL-3.0: use the hosted API as a service; do not bundle its code |

MCP servers in `mcp.json`:
- Stripe official remote MCP (`https://mcp.stripe.com`, OAuth; toolkit repo stripe/agent-toolkit is MIT).
- Razorpay official MCP (razorpay/razorpay-mcp-server, MIT) via `mcp-remote` to `https://mcp.razorpay.com/mcp` with a Basic auth header.
- HubSpot (`@shinzolabs/hubspot-mcp`, MIT).

Verify before first live use:
- Stripe inline `price_data` on Payment Links appeared in the 2025-07-30 API release; older pinned API versions need a Price created first.
- WhatsApp Graph API version in `config.yaml` (`v25.0`) must be one Meta still supports.
- HubSpot deal stage ids differ per pipeline: map `crm.stages` to your pipeline's internal stage ids on first run.
