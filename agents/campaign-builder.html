## 1. What this agent gets you
Next month's emails planned around your promos, stock and holidays, built in your ESP, checked for broken links and spam triggers, and test-sent to you. You approve, it schedules.

## 2. Who it is for / not for
For: ecommerce brands sending 8 to 20 campaigns a month on Klaviyo, Brevo, Mailchimp or HubSpot.
Not for: automations (use flow-architect) or lapsed-customer offers (use winback-analyst).

## 3. Setup checklist
- [ ] company-brain has run (voice, discount rules, design tokens)
- [ ] ESP key or MCP; Shopify read access
- [ ] `OWNER_TEST_EMAIL` set
- [ ] A master template in your ESP for the agent to clone
- [ ] Edit config.yaml: send_days, max_sends_per_week, max_discount_sends
- [ ] `python3 scripts/check_setup.py`
Time: 20 minutes. API cost: $0.

## 4. First run
Claude Code: `Use campaign-builder: plan and build December. Promos: <list>.`
ChatGPT / Codex: load SKILL.md, same message.
OpenClaw / Hermes: `run campaign-builder "plan next month"`

## 5. Schedule
- Claude Code: `/schedule monthly on the 20th 9am: campaign-builder plan next month` and `/schedule every Monday 9am: campaign-builder build next 10 days`
- cron: `0 9 20 * * cd /path/to/headcount && claude -p "run campaign-builder monthly plan"`

## 6. What good output looks like
`examples/example-output.md`: a dated table per send with segment and feature, a no-discount share, blocked low-stock products, and a QA report that blocks bad drafts.

## 7. Tuning
- `max_sends_per_week`: the main lever on revenue vs unsubscribes.
- `max_discount_sends`: protects margin.
- `low_stock_days`: stops you promoting what you cannot ship.

## 8. Troubleshooting
1. **QA fails on UTM:** links added after the build; re-run Step 5 link pass.
2. **Gmail clipping:** HTML over 102 KB; remove inline CSS duplicates or images.
3. **Brevo test send rejected:** the test address must be allowed in your Brevo account settings.
4. **Mailchimp schedule error:** times must be on the quarter hour, UTC.
5. **Too few slots:** raise `send_days` or `max_sends_per_week`; promos always take priority.

## 9. Safety and platform rules
- Nothing goes to a real audience without your yes. Tests go to you only.
- Gmail and Yahoo bulk sender rules: spam complaints under 0.3%, one-click unsubscribe.
- CAN-SPAM: postal address and working unsubscribe in every email. SMS only to consented numbers, outside quiet hours.

# Connections: campaign-builder

| What | Why | Where | Scopes | Cost | Env var |
|---|---|---|---|---|---|
| Klaviyo private key | Build drafts, test send, schedule after yes | Klaviyo, Settings, API keys | campaigns:read, campaigns:write, templates:read, templates:write, segments:read, lists:read, metrics:read | Free | `KLAVIYO_PRIVATE_KEY` |
| Brevo | Same | Brevo, SMTP and API, API keys, or the official Brevo MCP (https://mcp.brevo.com, OAuth) | Full key | Free | `BREVO_API_KEY` |
| Mailchimp | Same | Account, Extras, API keys | Full key | Free | `MAILCHIMP_API_KEY` |
| HubSpot | Marketing email drafts | Private app | content, marketing-email | Plan dependent | `HUBSPOT_ACCESS_TOKEN` |
| Shopify | Stock days of cover, new arrivals, discount codes check | Develop apps | read_products, read_inventory, read_orders, read_discounts | Free | `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_STORE` |
| Owner test inbox | Where tests go | Your email | n/a | n/a | `OWNER_TEST_EMAIL` |

MCP servers in `mcp.json`: Klaviyo MCP (official, set READ_ONLY to "false" only when you want the agent to create drafts), Brevo MCP (official, remote), `@hubspot/mcp-server` (MIT), `shopify-mcp` (MIT). Keep only your ESP.
`qa_email.py --check-links` makes HEAD requests to links in your own email only; no paid calls.
