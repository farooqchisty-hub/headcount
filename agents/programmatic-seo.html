## 1. What this agent gets you
Hundreds of pages that each answer one specific search with real data (one trail, one city, one integration), built in small batches and scaled only when Google shows it wants them.

## 2. Who it is for, and not for
- For: businesses that own or can collect structured data about many similar things: locations, products, integrations, use cases, specs.
- For: patterns with many low-volume searches (long tail).
- Not for: anyone wanting thousands of AI-written pages with swapped keywords. Google's scaled content abuse policy removes those, and this agent's gate blocks them.
- Not for: sites with under 6 months of history and no links. Start with seo-content-pipeline.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Keyword data: DataForSEO key or a keyword CSV export | 10 min | DataForSEO pay as you go, a few dollars per pattern study |
| Search Console token | 15 min | free |
| The dataset (your data, open data, manual collection) | 1 to 10 days | your time |
| A place to publish: static host, CMS import or repo | varies | |
Honest note: the dataset is most of the work and all of the value.

## 4. First run
> Run programmatic-seo. Find keyword patterns from data/keywords.csv, check intent on the best three, and tell me which one we can build real data for.

## 5. Running it on a schedule
- After the pilot ships, a weekly check (cron, Mondays; the decision script answers "wait" until day 28): `0 8 * * 1 cd /path/to/programmatic-seo && python3 scripts/gsc.py inspect --site sc-domain:your-site --urls site/urls.txt --out data/inspect-latest.csv`
- Claude Code: `/schedule every 4 weeks: programmatic-seo batch decision`
- OpenClaw or Hermes: 4-weekly job with "Run the programmatic-seo day-28 decision on the latest batch".

## 6. What good output looks like
`examples/` (fictional "Trailhen" trail guides): pattern sizing, an 11-row dataset where the gate caught a duplicate and a thin row, 9 rendered pages, and a day-35 decision to scale at 78% indexed.

## 7. Tuning
1. `gate.min_data_diff`: 0.4 is a floor. Raise it for small datasets.
2. `pilot.scale_if_indexed_at_least`: 0.70 by default. Do not lower it to scale faster.
3. `pilot.max_new_pages_per_week`: big jumps in page count are a spam signal and outrun your internal linking.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Gate fails under 90% | Add fields, fill blanks, remove near-duplicate rows. Do not loosen thresholds. |
| Many "Discovered, not indexed" | Google has not crawled them: add internal links from strong pages, submit the sitemap, slow the batch size. |
| Many "Crawled, not indexed" | Google read them and passed: pages are too similar or too thin. Add data and conditional sections. |
| Pages indexed but no impressions | Pattern has less real demand than the tool said, or intent mismatch. Re-check Step 2. |
| Unrendered tag error | A field in the template is missing from the CSV header. |

## 9. Safety and platform rules
- Google spam policies: scaled content abuse (many pages with little value, however produced) and site reputation abuse. Follow references/scaled-content-policy.md.
- Use data you own or have a licence to reuse. No scraping and republishing other sites' content.
- Every batch and every prune waits for your approval.

# Connect: keys and services

| Env var | Service | Where to get it | Scope | Cost | Used for |
|---|---|---|---|---|---|
| `DATAFORSEO_LOGIN`, `DATAFORSEO_PASSWORD` (optional) | DataForSEO: Labs keyword ideas, ranked keywords, SERP | app.dataforseo.com/api-access | API login (Basic auth) | pay as you go; check current per-task prices | pattern discovery, intent check |
| `GSC_ACCESS_TOKEN` | Search Console API | Google Cloud OAuth, scope `https://www.googleapis.com/auth/webmasters.readonly` | read only | free; URL Inspection about 2,000 per day per property | indexing rate, impressions |

Free alternative to DataForSEO: export keywords from Search Console (queries with impressions), or from any SEO tool you already pay for, as `keyword,volume` CSV.

## DataForSEO endpoints the agent uses (via MCP or direct)
- `POST https://api.dataforseo.com/v3/dataforseo_labs/google/keyword_ideas/live`
- `POST https://api.dataforseo.com/v3/dataforseo_labs/google/ranked_keywords/live` (competitor keywords)
- `POST https://api.dataforseo.com/v3/serp/google/organic/live/advanced` (intent check)
Auth: HTTP Basic with login and password.

## MCP
mcp.json: DataForSEO official server (Apache-2.0) and Search Console MCP (MIT). Both optional.
