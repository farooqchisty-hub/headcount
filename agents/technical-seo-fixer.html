## 1. What this agent gets you
A ranked list of what is stopping your pages from ranking, ordered by how many clicks each problem costs you, and the fixes shipped as pull requests or tickets your developer can build in an afternoon.

## 2. Who it is for, and not for
- For: stores and content sites with 50 to 50,000 pages, on Shopify, WordPress, Webflow or a custom stack.
- For: after a redesign, migration, theme change or an unexplained traffic drop.
- Not for: sites you do not own (the crawler is polite but this is an owner's audit).
- Not for: sites over 50,000 pages in one go; run it per section.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| config.yaml: start URL, sitemap, Search Console property | 5 min | free |
| Search Console token (CONNECT.md) | 15 min, once | free |
| Google API key for CrUX and PageSpeed | 5 min | free |
| Optional: repo access and gh CLI for PRs | 5 min | free |
Honest cost per run: $0 in API fees. A 500-page crawl at 1 request a second takes about 9 minutes.

## 4. First run
> Run technical-seo-fixer on my site. Crawl it, pull my Search Console traffic and index status, check Core Web Vitals on my main templates, and give me the fix tickets ranked by traffic at stake.

## 5. Running it on a schedule
- Monthly full crawl (cron): `0 3 1 * * cd /path/to/technical-seo-fixer && python3 scripts/crawl.py --start https://your-site/ --sitemap https://your-site/sitemap.xml --out data/crawl-$(date +\%F)`
- Weekly quick check: `/schedule every Wednesday 7am: technical-seo-fixer quick check on top 50 traffic URLs`
- OpenClaw or Hermes: monthly job with the First run message; weekly job with "quick check".

## 6. What good output looks like
`examples/example-output/tickets.md` (fictional "Trailhen" store): 15 tickets, P0 first. The top ticket is a deleted product page still earning 35 clicks a month that now returns 404, with the redirect fix and the test that proves it is done.

## 7. Tuning
1. `crawl.max_pages`: big enough to cover every template at least 20 times.
2. `priority.cosmetic_cap_below_base`: keeps meta description nitpicks from crowding out real problems.
3. `output.mode`: `pull_request` when you have a repo; `tickets` otherwise.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Lots of 403s or fetch errors | Your CDN or firewall blocks the crawler. Allowlist the user agent `HeadcountSEOCrawler` for the audit. |
| Titles and H1 empty everywhere | Site renders with JavaScript only. That is finding number one; ask your developer about server rendering. |
| "Traffic data: NO" in tickets | Set GSC_ACCESS_TOKEN and run gsc.py pages first. |
| CrUX returns no data | Not enough Chrome traffic on that URL; use the origin row. |
| URL Inspection 429 | Daily quota hit (about 2,000 per property). Lower `inspection.max_urls_per_run`. |

## 9. Safety and platform rules
- Crawls only the host you give it, honours robots.txt and Crawl-delay, 1 request a second by default.
- Uses official Google APIs (Search Console, CrUX, PageSpeed Insights) within their quotas.
- Never pushes to your main branch or edits production settings. Every PR and ticket waits for your yes.

# Connect: keys and services

| Env var | Service | Where to get it | Scope | Cost | Needed for |
|---|---|---|---|---|---|
| (none) | Crawler | built in | | free | Step 1 |
| `GSC_ACCESS_TOKEN` | Search Console API: Search Analytics + URL Inspection | Google Cloud console: create OAuth client (Desktop), enable "Google Search Console API", get a token with scope `https://www.googleapis.com/auth/webmasters.readonly` (for example via `gcloud auth application-default login --scopes=...` then `gcloud auth application-default print-access-token`). The account must have access to the property. | read only | free; URL Inspection about 2,000 calls per day per property, 600 per minute | traffic at stake, index status |
| `GOOGLE_API_KEY` | Chrome UX Report API and PageSpeed Insights API | Google Cloud console, Credentials, API key; enable both APIs; restrict the key to them | | free | Core Web Vitals |
| `GITHUB_TOKEN` (optional) | GitHub via `gh` | `gh auth login` | repo | free | PRs and issues |

Tokens from `gcloud` expire after about an hour. For cron, use a service account added as a user on the Search Console property and mint the token in your wrapper script.

## MCP (optional)
- `search-console` (MIT, saurabhsharma2u/search-console-mcp): interactive Search Console queries in chat.
- `chrome-devtools` style or `playwright` MCP (Apache-2.0, microsoft/playwright-mcp): render a JavaScript page to compare with the crawler's raw HTML.
Neither is needed for the scripted workflow.
