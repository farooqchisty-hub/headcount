## 1. What this agent gets you
A list of the email and SMS automations you are missing or running badly, each with a monthly dollar estimate, and the missing ones built as drafts with copy, timing and splits.

## 2. Who it is for / not for
For: ecommerce stores on Klaviyo, Brevo, Mailchimp or HubSpot with 20k+ monthly sessions.
Not for: stores with under 200 orders a month (benchmarks get noisy; build welcome, cart and checkout and stop).

## 3. Setup checklist
- [ ] company-brain has run
- [ ] ESP key with read scopes (see CONNECT.md), or a CSV export of your flows
- [ ] Shopify read_orders (optional but better numbers)
- [ ] Edit config.yaml: esp, channels, discount_policy
- [ ] `python3 scripts/check_setup.py`
Time: 15 minutes. API cost: $0 (ESP and Shopify APIs are free).

## 4. First run
Claude Code: `Use flow-architect: audit my Klaviyo flows and show me revenue at stake.`
ChatGPT / Codex: load SKILL.md, same message.
OpenClaw / Hermes: `run flow-architect "audit flows"`

## 5. Schedule
- Claude Code: `/schedule monthly on the 1st 9am: run flow-architect re-audit`
- cron: `0 9 1 * * cd /path/to/headcount && claude -p "run flow-architect monthly re-audit"`

## 6. What good output looks like
`examples/example-output.md`: a ranked table of flows with dollars at stake, cause and fix per weak flow, and draft specs waiting for your yes.

## 7. Tuning
- `identified_visitor_share`: the biggest driver of browse and cart estimates. Check it in your ESP's identified-profile report.
- `discount_policy.max_discount_pct`: protects margin across every flow.
- `skip_flows`: drop replenishment if you do not sell consumables.

## 8. Troubleshooting
1. **Klaviyo 429 on flow-values-reports:** limit is 2 per minute and 225 per day; the script makes one call. Wait a minute.
2. **"no Placed Order metric":** connect Shopify to Klaviyo first.
3. **Estimate looks too big:** the script warns over 25% of revenue; lower identified share.
4. **Brevo flows not listed:** Brevo has no workflow list API. Export the list to CSV.
5. **Create flow rejected:** build in the UI from the spec; templates are already created.

## 9. Safety and platform rules
- Drafts only. You switch flows live.
- Follow Gmail and Yahoo bulk sender rules: one-click unsubscribe, spam rate under 0.3%.
- SMS only with recorded consent; quiet hours respected.

# Connections: flow-architect

You need one of: an ESP API key, the ESP's official MCP, or a CSV export of your flows.

| What | Why | Where | Scopes | Cost | Env var |
|---|---|---|---|---|---|
| Klaviyo private key | Read flows and performance; create draft templates and flows after your yes | Klaviyo, Settings, API keys, Create private key | Read: flows:read, metrics:read, lists:read, segments:read, templates:read. Write (optional): flows:write, templates:write | Free | `KLAVIYO_PRIVATE_KEY` |
| Klaviyo MCP (official) | Same, inside your runtime | `uvx klaviyo-mcp-server@latest` (PyPI, Klaviyo Developer Experience Team); guide at developers.klaviyo.com/en/docs/klaviyo_mcp_server | Uses the private key. Set READ_ONLY true for audits | Free | `KLAVIYO_PRIVATE_KEY` |
| Brevo | Workflow revenue, template creation | Brevo, SMTP and API, API keys; or the official Brevo MCP (https://mcp.brevo.com, OAuth, all plans) | API key full access (Brevo keys are not scoped) | Free | `BREVO_API_KEY` |
| Mailchimp | Classic automations, emails | Account, Extras, API keys | Full key; dc is the suffix after the dash | Free | `MAILCHIMP_API_KEY` |
| HubSpot | Workflows, marketing emails | Settings, Integrations, Private apps | automation, content, crm.objects.contacts.read | Free on your plan | `HUBSPOT_ACCESS_TOKEN` |
| Shopify | Sessions, orders, AOV, reorder gaps | Settings, Apps, Develop apps | read_orders, read_reports | Free | `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_STORE` |

MCP servers in `mcp.json`: klaviyo-mcp-server (official Klaviyo; check its licence on PyPI before redistributing, it is installed by the buyer, not bundled), Brevo MCP (official, remote, OAuth), `@hubspot/mcp-server` (MIT, official), `shopify-mcp` (MIT). Delete the ones for ESPs you do not use.
Unverified: the env variable names for klaviyo-mcp-server (`PRIVATE_API_KEY`, `READ_ONLY`) follow Klaviyo's setup guide at time of writing; confirm on developers.klaviyo.com.
