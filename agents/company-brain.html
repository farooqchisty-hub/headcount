## 1. What this agent gets you
A 20 minute interview that writes `brain/COMPANY.md`: your offer, prices, customer, voice, competitors, numbers, claims and brand look in one file. Every other Headcount agent reads it first, so you never explain your business twice.

## 2. Who it is for / not for
- For: every Headcount buyer. Run it before anything else.
- For agencies: run it once per client (agency mode).
- Not for: writing your brand strategy from scratch. It records what is true today; it does not invent positioning.

## 3. Setup checklist
- Keys: none. It reads your public website with plain HTTP.
- Time: about 20 minutes with you, 2 minutes of prep.
- Cost per run: zero API cost beyond your AI model subscription or tokens (roughly 30k to 60k tokens per interview).
- Have ready: your website URL, last month's revenue, AOV and margin (or product cost), your logo file, 3 pieces of writing you like, 10 customer reviews if you have them.

## 4. First run
Start your AI tool from your Headcount home (`cd ~/headcount`), then type:
- Claude Code: `Run company-brain. My website is https://yourbrand.com`
- ChatGPT (Custom GPT "Company Brain"): `Interview me for my company brain. Website: https://yourbrand.com`. Download the COMPANY.md it gives you and upload it to each other Headcount GPT.
- Codex: `Use the company-brain skill to interview me. Website https://yourbrand.com`
- OpenClaw: `/company-brain https://yourbrand.com` or just ask "set up my company brain"
- Hermes: `hermes chat -s company-brain` then `My website is https://yourbrand.com`

Agencies: `Run company-brain in agency mode for client "Acme Pets", website https://acmepets.example`

## 5. Running it on a schedule
It does not need a schedule. Set a quarterly reminder to refresh:
- cron: `0 9 1 */3 * cd ~/headcount && claude -p "Run company-brain in refresh mode"`
- Claude Code: `/schedule quarterly: run company-brain refresh mode`
- Hermes: `hermes cron create "0 9 1 */3 *" "Refresh the company brain" --skill company-brain --workdir ~/headcount`

## 6. What good output looks like
See `examples/example-output/COMPANY.md` (fictional tea brand) and the interview that produced it in `examples/example-input/interview.md`. Check yours by asking your AI tool "Validate my company brain", or run it yourself from your Headcount home (`cd ~/headcount`):
- Claude Code: `python3 ~/.claude/skills/company-brain/scripts/validate_brain.py brain/COMPANY.md`
- Codex: `python3 ~/.agents/skills/company-brain/scripts/validate_brain.py brain/COMPANY.md`
- OpenClaw: `python3 ~/.openclaw/skills/company-brain/scripts/validate_brain.py brain/COMPANY.md`
- Hermes: `python3 ~/.hermes/skills/headcount/company-brain/scripts/validate_brain.py brain/COMPANY.md`
- From the downloaded package folder: `python3 agents/company-brain/scripts/validate_brain.py ~/headcount/brain/COMPANY.md`

Numbers must be plain numbers: `aov: 1400`, not `Rs 1,400` or `14 hundred`; `monthly_revenue: 1000000`, not `10 lakh`. The validator tells you the plain number to write.

## 7. Tuning (config.yaml)
- `interview_minutes`: shorten to 12 if you prefill from a rich website.
- `target_roas_multiplier`: how far above breakeven the suggested ROAS target sits (1.4 default).
- `default_banned_words`: words every agent avoids. Remove any you actually use.

## 8. Troubleshooting
1. "Cannot read website", "robots.txt disallows" or "almost no text without JavaScript": your site blocks scripts or renders with JavaScript. The script then tries your sitemap and Shopify collections by itself; if it still finds no products or prices, the agent asks you to paste your homepage text or your product list into the chat. Quickest for a store: send your product export (Shopify admin: Products, Export, CSV; WooCommerce: Products, Export) and the agent reads every product and price from it (`prefill_from_site.py --catalog <file> --currency INR`). You can also save your homepage from the browser (File, Save Page As) and run `prefill_from_site.py --html saved.html --base-url https://yourbrand.com`.
2. Validator says placeholders remain: search the file for `{{fill}}` and answer those lines, or rerun and say "only ask about what is missing".
3. Breakeven warning: your breakeven_roas does not equal 1 / margin. Recheck margin includes shipping and payment fees.
4. Logo path not found: put the file in `brain/assets/` and update `logo_path`.
5. Agents ignore the brain: ask your AI to rerun the Headcount installer. It saves your home in `~/.headcount/config.json` and links the brain next to your skills folder, so every agent finds it from any folder. No shell profile or environment variable is needed (`HEADCOUNT_HOME`, if set, still wins).

## 9. Safety
The brain holds business numbers. Keep it out of public repos. It never contains API keys; those live in your environment or `.env`, never in COMPANY.md.

# Connections for company-brain

No API keys are required.

| What | Why | How | Cost | Env var |
|---|---|---|---|---|
| Your public website | prefill drafts so you confirm instead of typing | plain HTTPS via `scripts/prefill_from_site.py`, or your AI tool's web fetch | free | none |
| Your AI tool's web fetch (optional) | read JavaScript-heavy sites and competitor homepages | built in to Claude Code, ChatGPT, Codex, OpenClaw, Hermes | included | none |
| Review export (optional) | real customer phrases for ICP and voice | export CSV from your review app or Shopify, drop in `brain/proof/` | free | none |

Optional environment variable:
- `HEADCOUNT_HOME` (optional): where `brain/` and `logs/` live. Not needed: install.py saves the home (default `~/headcount`) in `~/.headcount/config.json` and every agent reads it. Set the variable only to override that.

Nothing else. Data source keys (Meta, Google, Shopify, ESP) belong to the agents that use them; see `guides/`.
