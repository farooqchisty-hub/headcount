## 1. What this agent gets you
Each company on your target list sees LinkedIn ads and a landing page written for its situation. When one of them engages, it lands in your outbound queue that week.

## 2. Who it is for / not for
- **For:** B2B sellers with a named list of 20 to 500 target accounts and a deal size that justifies paid reach (roughly 10,000 USD a year or more per account).
- **Not for:** low-ticket products, consumer brands, or lists of thousands with no signal (use cold email first).

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| company-brain run (offer, proof, brand colours) | yes | once | free |
| A place to host static pages (any static host on a subdomain or path) | yes | 15 min | often free |
| LinkedIn developer app with Advertising API access | for drafts by API | days (LinkedIn approves manually) | free |
| LinkedIn ad account and budget | to run ads | 10 min | LinkedIn CPMs are high; plan a 30 to 60 day test budget |
| Web analytics that can filter by URL parameter | for engagement | existing | your tool |
Without API access, the agent still writes the pages, the ad copy CSV and the company list for you to upload by hand.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run abm-personalizer on my top 20 accounts in data/abm/targets.csv. Write tier 1 pages and ads and show me before anything goes live.

ChatGPT:
> Use the abm-personalizer skill. Here are 10 target companies (attached). Write a landing page and LinkedIn ad for each.

Demo: `python3 scripts/account_research.py examples/example-targets.csv --fixture --out /tmp/a.json` then `python3 scripts/render_pages.py examples/example-accounts.json --dry-run`.

## 5. Running it on a schedule
- Weekly content refresh: Claude Code `/schedule mondays 09:30 run abm-personalizer weekly refresh`.
- Daily engagement: `0 10 * * * cd /path/to/headcount/agents/abm-personalizer && python3 scripts/engagement_sync.py --accounts ../../data/abm/accounts.json --events ../../data/abm/events.csv --out-dir ../../data` (after your analytics export lands).
- OpenClaw or Hermes: the same two jobs.

## 6. What good output looks like
See `examples/` (example, fictional brands): `example-accounts.json` (two tier 1 accounts with bespoke copy, an ecommerce cluster for the rest), `output/pebblequay/index.html` (a finished page), `output/ads.csv`, and `output/data/` (an engaged account handed to outbound).
Good means: tier 1 pages read like they were written for that one company, and 10 to 20% of tier 1 and 2 accounts engage within 30 days.

## 7. Tuning
1. `engagement.engaged_threshold` (25) and `weights`: raise `cta_click` and `form_submit` if engaged accounts do not reply.
2. `targets.max_tier1` (25): more tier 1 means more writing time; keep it to what you can sell to.
3. `ads.daily_budget_usd` (50): set by you; the agent never activates spend.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| render_pages FAIL "ad_intro N chars" | Shorten to 150 characters; the rest is hidden behind "see more" anyway. |
| No logo found | Many sites hide icons behind scripts. The page still renders without the logo block. |
| LinkedIn 403 | App lacks Advertising API access or the token lacks `rw_ads`. |
| LinkedIn 400 on version | `ads.linkedin_version` is sunset. Set a current YYYYMM. |
| Campaign will not serve | Audience under 300 members. Add accounts or combine tiers. |

## 9. Safety and platform rules
- Ad campaigns are created as drafts only; you activate them.
- No other company's logo in paid ads. Their logo appears only on the page addressed to them, with an ownership note, and you can turn that off.
- Personalised pages are `noindex`.
- Follow-up emails never mention that someone saw an ad or visited a page.
- LinkedIn advertising policies apply to all copy and images.

# Connect: abm-personalizer

| Service | Env var | Where to get it | Scopes or settings | Cost | Used for |
|---|---|---|---|---|---|
| Company homepages | none | public | polite fetch with your contact in the User-Agent | free | account research |
| LinkedIn Marketing API | `LINKEDIN_ACCESS_TOKEN`, `LINKEDIN_AD_ACCOUNT_ID`, `LINKEDIN_ORG_URN` | developer.linkedin.com: create an app, request the Advertising API product, OAuth 2.0 member token | `rw_ads`, `w_organization_social`, `r_ads_reporting` | free API; ad spend separate | DRAFT campaign groups, campaigns, sponsored posts, creatives; company-level analytics |
| HubSpot | `HUBSPOT_ACCESS_TOKEN` | Private app | `crm.objects.companies.read`, `crm.objects.contacts.read` | free tier | contacts at target accounts, open opportunities |
| Exa | `EXA_API_KEY` or Exa MCP | dashboard.exa.ai | none | per search | extra account research for tier 1 |
| Image generation | `IMAGE_API_KEY` (your chosen provider) | your provider | per provider | per image | used by static-ad-factory from `image-briefs.json` |
| Web analytics | export only | GA4, PostHog or similar | filter by the `a` URL parameter | your tool | page engagement events |

MCP servers in `mcp.json`: HubSpot (`@shinzolabs/hubspot-mcp`, MIT), Exa (official, MIT). No LinkedIn MCP is bundled: community LinkedIn servers mostly drive a logged-in browser session, which LinkedIn's terms prohibit. The official REST API is used through `scripts/linkedin_ads.py`.

Optional: treg (tool registry) only if you already have your own account.

Verify before first live use:
- `ads.linkedin_version` is a currently supported YYYYMM.
- The creative and posts request shapes follow LinkedIn's documented Posts API and creatives API; send one account first and inspect it in Campaign Manager.
- The company list CSV headers match the current Matched Audiences company template (download the template in Campaign Manager and compare).
