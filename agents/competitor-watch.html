## 1. What this agent gets you
You hear the same day when a competitor starts a sale, changes prices, launches a product, floods Meta with new ads or publishes a page comparing itself to you. Every Monday you get one page: what they did, what still runs, and what we should do.

## 2. Who it is for / not for
**For:** ecommerce and DTC brands with 2 to 10 direct competitors who sell online and advertise on Meta.
**Not for:** spying on private data, B2B deal tracking, or social listening across millions of posts.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Competitor list, pages, Shopify flag, Page ids in config.yaml | 20 min (the agent drafts it) | free |
| Your contact address in `site.user_agent` | 1 min | free |
| Meta Ad Library API access + token | 15 min plus Meta's ID check (can take a day) | free |
| Optional Playwright MCP for JavaScript pages | 5 min | free |

API cost per run: zero by default. About 5 page requests per competitor per day plus one Ad Library call per 10 Pages.

## 4. First run
```
Run competitor-watch. Our competitors are Kettle & Kin (kettleandkin.example) and Moonbrew (moonbrew.example). Set them up, take today's baseline and tell me what you can and cannot see.
```

## 5. Running it on a schedule
- **Claude Code:** `/schedule` then "every day at 07:30 run competitor-watch; Mondays include the weekly brief".
- **cron:** `30 7 * * * cd /path/to/workspace && claude -p "run competitor-watch daily"`
- **OpenClaw / Hermes:** daily job at 07:30 with the prompt "run competitor-watch daily".

## 6. What good output looks like
`examples/example-output.md`: a fictional tea brand's two competitors. Day two caught a 25% sitewide sale with a code and end date, an advent calendar launch, a 6-ad burst, a "Moonbrew vs Fernhollow" comparison page, a 36 day ad switched off, and two long-running ads sent to winner-remixer.

## 7. Tuning: the 3 settings that matter most
1. `competitors.<slug>.pages`: watch the pages that change when they make moves (home, pricing, bestseller collection). More pages is more noise.
2. `ad_library.countries`: EU markets they sell in. Wrong countries means zero ads.
3. `severity.alert_same_day`: which event types interrupt you. Everything else waits for Monday.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| Ad Library returns zero ads | They do not deliver in the countries you set, or the Page id is wrong. Check their ads on the Ad Library website |
| Error code 10 or 2332 from the Ad Library API | Your Facebook account has not finished identity confirmation, or you did not accept the API terms |
| No prices captured | Prices load with JavaScript: use the Playwright MCP and `--from-dir` |
| "skip (robots.txt)" | That path is disallowed. Pick another public page; do not override |
| Too many HEADLINE_CHANGE events | The page rotates headlines; remove it from `pages` or rely on promos and prices |

## 9. Safety and platform rules
Public pages and the official Meta Ad Library API only. robots.txt respected, honest user agent with your contact, 2 seconds between requests, no logins or fake accounts. Competitor ads are used as reference for original work, never copied. This agent changes nothing and publishes nothing.

# Connect competitor-watch

Most of this agent needs no keys: it reads public web pages with the Python standard library.

## Meta Ad Library API (for competitor ads)
| Env var | What | Where |
|---|---|---|
| `META_ADLIB_ACCESS_TOKEN` | user access token from a Facebook account that completed Meta's identity confirmation | developers.facebook.com: create an app, accept the Ad Library API terms at facebook.com/ads/library/api, generate a user token (Graph API Explorer). Falls back to `META_ACCESS_TOKEN` if you already have one with access |
| `META_API_VERSION` | optional, default `v26.0` | |

Cost: free. Limits: standard Graph API rate limits; commercial ads only when delivered in the EU (see references/meta-ad-library-access.md). Long-lived user tokens expire after 60 days: renew them.

## Optional
| What | Env var | Cost | Why |
|---|---|---|---|
| Playwright MCP (microsoft/playwright-mcp, Apache-2.0) | none | free | pages that render prices with JavaScript; reading the Ad Library website by eye for non-EU markets |
| Exa MCP (exa-labs/exa-mcp-server, MIT) | `EXA_API_KEY` | paid per search, your own account | press, launches and reviews that mention competitors |
| changedetection.io (dgtlmoon/changedetection.io, Apache-2.0) | none | free self-hosted | if you prefer a visual page-diff tool alongside this agent; install separately |
| treg | `TREG_MCP_URL`, `TREG_API_KEY` | your own account | only if you have one, e.g. for Ad Library data in markets outside the EU |

## Check it works
```
python3 scripts/check_setup.py
python3 scripts/site_snapshot.py --config config.yaml --dry-run    # lists every URL it would fetch
python3 scripts/ad_library.py --config config.yaml --dry-run       # prints the exact API requests
```
