## 1. What this agent gets you
AI assistants cite a small set of pages for each question. This agent finds the pages they cite instead of you and works each one: a pitch to the list editor, an honest forum answer, a missing comparison page, or a crawler fix. Then it checks three weeks later whether you got in.

## 2. Who it is for, and not for
- For: brands already tracking AI visibility (ai-visibility-tracker) who want the number to move.
- For: teams willing to have a real person post disclosed forum answers and send pitches.
- Not for: anyone wanting fake reviews, sock-puppet accounts or vote buying. It will refuse.
- Not for: brands with no product pages worth citing yet. Fix the site first.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| ai-visibility-tracker has run at least once | see that agent | its API cost |
| config.yaml brand and competitors (same as the tracker) | 5 min | free |
| 30 days of access logs in combined format | 10 min to export | free |
| robots.txt copy | 1 min | free |
| Optional: Search Console token, Ahrefs or DataForSEO keys (CONNECT.md) | 10 min | pay as you go |
Honest cost per run: no API calls needed for the core loop. Your time: 30 to 60 minutes a week to approve and send.

## 4. First run
> Run geo-citation-closer on the latest ai-visibility-tracker gaps. Audit my AI crawler access from logs/access.log and robots.txt, then draft the top actions for my approval.

## 5. Running it on a schedule
- Cron, Tuesday 07:00 (after the tracker's Monday run): `0 7 * * 2 cd /path/to/geo-citation-closer && python3 scripts/citation_gaps.py --gaps ../ai-visibility-tracker/data/gaps/$(date +\%G-W\%V).json --out data/worklist-$(date +\%G-W\%V).csv`
- Monthly crawler audit: `0 7 1 * * cd /path/to/geo-citation-closer && python3 scripts/crawler_log_audit.py --logs 'logs/access.log*' --robots robots.txt --out reports/crawler-audit-$(date +\%F).md`
- Claude Code: `/schedule every Tuesday 7am: run geo-citation-closer weekly shift`
- OpenClaw or Hermes: weekly job with the First run message.

## 6. What good output looks like
`examples/example-output/` (fictional brand "Trailhen"): a ranked worklist, a crawler audit that caught a blocked Claude-SearchBot and a CDN blocking PerplexityBot, an llms.txt, and a drafted comparison page, pitch and forum answer.

## 7. Tuning
1. `gaps.min_citations`: raise to 3 if the list is long and noisy.
2. `outreach.max_new_pitches_per_week`: 10 keeps quality high. Do not raise above 20.
3. `remeasure.wait_days`: 21 by default. Engines re-crawl at different speeds; under 14 days you will mark wins as losses.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| "gaps file not found" | Run ai-visibility-tracker `score.py --gaps-out` first. |
| Audit says under half the lines parsed | Logs are not combined format. Export again or change your server log_format. |
| Search bot shows zero visits | Check CDN or WAF bot settings; many have one-click AI bot blocking that catches search bots too. |
| Lots of "spoofed" hits | Normal. Bots are impersonated often. Count only verified IPs. |
| Wins not showing after 3 weeks | Check the page is indexed (technical-seo-fixer), cited pages were updated, and the prompt set did not change. |

## 9. Safety and platform rules
- Forum answers always disclose affiliation and are posted by a real employee from their own account. Follow each community's self-promotion rules; Reddit's rules and each subreddit's rules apply.
- No fake reviews, no review gating where a platform forbids it, no incentives tied to rating (FTC rule on fake reviews and testimonials, 2024).
- Paid placements must be labelled by the publisher as sponsored.
- Never edit Wikipedia about your own company.
- No sends or posts by the agent. Everything is a draft until you approve and send it yourself.

# Connect: keys and services

The core loop needs no keys. It runs on: the gaps JSON from ai-visibility-tracker, your access logs, robots.txt and sitemap.

| Env var | Service | Where to get it | Scope | Cost | Used for |
|---|---|---|---|---|---|
| `GSC_ACCESS_TOKEN` (optional) | Google Search Console API | Google Cloud console, OAuth client, scope `https://www.googleapis.com/auth/webmasters.readonly` | read only | free | Impressions for new comparison and tool pages |
| `AHREFS_API_KEY` (optional) | Ahrefs API v3 | ahrefs.com account, API keys | Enterprise or API plan | per row | Referring pages and authors of listicles |
| `DATAFORSEO_LOGIN`, `DATAFORSEO_PASSWORD` (optional) | DataForSEO SERP API | app.dataforseo.com/api-access | pay as you go | about $0.002 per SERP (check pricing) | Finding more "best X" lists for a prompt |

## Free files you supply
- Access logs: nginx or apache combined format, 30 days. Cloudflare users: export via Logpush or use the dashboard's AI crawl report; convert to combined format.
- Vendor IP range files (free, optional) for spoof detection:
  - https://openai.com/searchbot.json, https://openai.com/gptbot.json, https://openai.com/chatgpt-user.json
  - https://www.perplexity.ai/perplexitybot.json, https://www.perplexity.ai/perplexity-user.json
  - https://claude.com/crawling/bots.json
  - https://developers.google.com/static/search/apis/ipranges/googlebot.json
  Save each as `ranges/<BotToken>.json`.

## MCP (optional)
mcp.json lists the Search Console MCP (MIT) and DataForSEO MCP (Apache-2.0, official). Neither is required.

## Optional
- treg, only with your own account, can stand in for SERP lookups. Direct vendor APIs are the primary path.
