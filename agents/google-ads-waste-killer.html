## 1. What this agent gets you
Every Monday it finds the money your Google Ads spends on searches, ads, products and settings that never pay back, shows the amount per week, and fixes what you approve. The next Monday it shows whether the fixes worked.

## 2. Who it is for / not for
**For:** advertisers spending about 1,000 to 100,000 a month on Search, Shopping or Performance Max who want weekly hygiene done properly.
**Not for:** accounts with no conversion tracking (fix that first), YouTube or Display-only accounts, or anyone who wants bids and budgets managed (this agent removes waste; it does not bid).

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Developer token, Basic access | 10 min to apply, a few days to approve | free |
| Google Cloud OAuth client + refresh token | 15 min | free |
| Customer id (and manager id if any) | 1 min | free |
| Target CPA or ROAS, brand terms in config.yaml | 5 min | free |

API cost per run: zero. Google Ads API calls are free.

## 4. First run
In Claude Code, Codex, OpenClaw or Hermes (ChatGPT: upload the folder to a project and paste):
```
Run google-ads-waste-killer. Target CPA is 45. Our brand terms are "acme" and "acme gear". Do the full first audit and show me the approval list.
```

## 5. Running it on a schedule
- **Claude Code:** `/schedule` then "every Monday 07:00 run google-ads-waste-killer".
- **cron:** `0 7 * * 1 cd /path/to/workspace && claude -p "run google-ads-waste-killer weekly"`
- **OpenClaw / Hermes:** weekly job, Monday 07:00, prompt "run google-ads-waste-killer weekly".

## 6. What good output looks like
`examples/example-output.md`: a fictional outdoor gear account with 483.80 a week of waste found across 17 actions, the brand term it refused to negate, the approval list, and the exact validate-only request that was sent after approval.

## 7. Tuning: the 3 settings that matter most
1. `targets.target_cpa` (or `target_roas` with `mode: roas`): every threshold is a multiple of it.
2. `search_terms.no_conv_cost_x_cpa` (2.0): lower to 1.5 for tight budgets, raise to 3.0 for long buying cycles.
3. `protect.brand_terms` and `never_negate`: the safety list. Add product names and any competitor terms you bid on deliberately.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| `DEVELOPER_TOKEN_NOT_APPROVED` | Token is at Test access: apply for Basic access in API Center |
| `USER_PERMISSION_DENIED` | Set `GOOGLE_ADS_LOGIN_CUSTOMER_ID` to the manager account id |
| Validate fails on a PMax negative | Campaign-level negatives are not enabled for that campaign; add the term to an account-level negative list in the UI |
| Report shows zero conversions everywhere | Tracking is broken; the agent stops and hands off to ad-account-watchdog |
| A good term was proposed | Add it to `protect.never_negate`; it will never be proposed again |

## 9. Safety and platform rules
Official Google Ads API only, your own credentials. Every change is shown as a dry run, validated by Google with `validateOnly`, and sent only after your yes. The one optional exception is exact-match negatives for zero-conversion terms, capped per week. Auto-apply subscriptions are paused, never deleted.

# Connect google-ads-waste-killer

Bring your own keys. Everything is read from environment variables.

## Required
| Env var | What | Where to get it |
|---|---|---|
| `GOOGLE_ADS_DEVELOPER_TOKEN` | API developer token | Google Ads manager account, Tools, API Center. New tokens start at Test access (test accounts only): apply for Basic access (free, usually a few days) to touch live accounts |
| `GOOGLE_ADS_CLIENT_ID` and `GOOGLE_ADS_CLIENT_SECRET` | OAuth client | Google Cloud console: enable "Google Ads API", create an OAuth client of type Desktop app |
| `GOOGLE_ADS_REFRESH_TOKEN` | long-lived OAuth refresh token | run Google's OAuth flow once with scope `https://www.googleapis.com/auth/adwords` (for example the `generate_user_credentials` example in the official client libraries, or the OAuth Playground with your own client) |
| `GOOGLE_ADS_CUSTOMER_ID` | the account to audit, digits only | top right of Google Ads |

## Optional
| Env var | What |
|---|---|
| `GOOGLE_ADS_LOGIN_CUSTOMER_ID` | your manager (MCC) id, if you reach the account through one |
| `GOOGLE_ADS_API_VERSION` | default `v26` (released 14 Oct 2026; v26.1 on 28 Oct 2026 is the same major path). Bump when Google sunsets it |

## Scopes and permissions
- OAuth scope: `https://www.googleapis.com/auth/adwords`.
- The Google user behind the refresh token needs Standard or Admin access on the account to apply changes; Read only is enough for audits.

## Cost
The Google Ads API is free. Basic access allows 15,000 operations a day, far above what this agent uses (about 11 read queries and up to a few hundred mutate operations a week).

## Optional MCP servers (mcp.json)
- **google-ads**: the official `googleads/google-ads-mcp` server (Apache-2.0). Good for ad hoc GAQL questions in chat. It uses Application Default Credentials (`GOOGLE_APPLICATION_CREDENTIALS`, `GOOGLE_PROJECT_ID`). The agent's changes still go through `scripts/google_ads_api.py`.
- **treg**: only if you have your own treg account. Not needed.

## Check it works
```
python3 scripts/check_setup.py            # offline
python3 scripts/check_setup.py --live     # refresh token + list accessible customers
```
