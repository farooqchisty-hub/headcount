## 1. What this agent gets you
Every morning: the trends worth your time (rising sounds, formats, searches and niche discussions), filtered for relevance and brand safety, with up to 3 ready concepts you can approve and post the same day.

## 2. Who it is for, and not for
- For: brands that post short video or social content at least 3 times a week and can turn something around in hours.
- For: founders who want to join conversations early without doomscrolling.
- Not for: brands that need legal review on every post (the windows are too short).
- Not for: newsjacking tragedies, politics or celebrity gossip. The safety filter blocks them by default.

## 3. Setup checklist
| Item | Needed? | Time | Cost per day |
|---|---|---|---|
| COMPANY.md (company-brain) | yes | 15 min once | free |
| Relevance terms in config.yaml | yes, agent drafts them | 5 min once | free |
| Reddit app (client id and secret) | recommended | 5 min | free at low volume |
| 5-minute manual TikTok Creative Center and IG audio check | recommended | 5 min daily | free |
| Apify key for TikTok Creative Center actors | optional | 5 min | pay per result, usually cents per day |
| Python 3.9+ | yes | | free |
The automated scan uses only free public sources (Google Trends RSS, Hacker News API, Reddit).

## 4. First run
- **Claude Code:** `trend-jacker: first run. Fill my relevance terms from COMPANY.md and ask me for subreddits.` Then daily: `trend-jacker: morning run.`
- **ChatGPT:** add the folder as project files: `Use trend-jacker. Here is today's trends list (paste). Score it and write concepts.` (ChatGPT browsing can stand in for the scan.)
- **Codex:** `Follow agents/trend-jacker/SKILL.md for today.`
- **OpenClaw / Hermes:** load the skill, schedule `trend-jacker: morning run` daily.
Try it without setup: `python3 scripts/score_trends.py --dry-run`.

## 5. Running it on a schedule
- cron (07:40 daily): `40 7 * * * cd /path/to/trend-jacker && claude -p "trend-jacker: morning run"`
- Claude Code: `/schedule daily 7:40am: trend-jacker morning run`
- OpenClaw / Hermes: daily job, same prompt. The brief waits for your approvals.

## 6. What good output looks like
See `examples/example-output.md`: scored table, the agent's upgrades and downgrades with reasons, blocked items shown, 3 concepts with bridge, format, slot and hours left.

## 7. Tuning (the 3 settings that matter)
- `relevance.core_terms` and `adjacent_terms`: the whole filter. Add the words your customers use, not industry jargon.
- `relevance.go_score` (60): raise if you get too many weak concepts, lower if the brief is empty most days.
- `safety.blocklist` and `allow_politics`: add your own sensitive topics. Politics stays off unless you have a stated position.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Brief is empty most days | Add adjacent terms from your audience's daily life; add 2 more subreddits; lower go_score by 5. |
| Reddit returns 429 or 403 | Set REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET; set a real User-Agent username. |
| Google Trends RSS fails | Retry later; the scan continues with other sources and lists the error. |
| Concepts feel forced | Your bridge sentences are weak. Require "Direct" or "Audience life" bridges only. |
| Trend posts underperform | Check hours from first seen to post in the ledger. Most late posts fail. |

## 9. Safety and platform rules
- Brand safety blocks are on by default and listed in every brief.
- Trending audio is added in the app from the platform library, never ripped into files.
- No real people's names or likeness without consent; link sources for any news fact.
- Respect Reddit's Data API terms and rate limits. TikTok Creative Center scraping is unofficial; the default is a manual check.

# Connections

## Free, no key (used by default)
| Source | Endpoint | Notes |
|---|---|---|
| Google Trends daily trending searches | `https://trends.google.com/trending/rss?geo=<CC>` | Public RSS. Change `scan.geo`. |
| Hacker News | `https://hn.algolia.com/api/v1/search?tags=front_page` | Public API. Most useful for tech, SaaS and dev-tool brands. |

## Reddit (recommended)
- Create a "script" or "web" app at reddit.com/prefs/apps. Env vars: `REDDIT_CLIENT_ID`, `REDDIT_CLIENT_SECRET`.
- Uses app-only OAuth (read access). Without keys, the scan falls back to public `.json` listings with a User-Agent; edit `UA` in scan_trends.py to include your Reddit username.
- Cost: free at low volume under Reddit's Data API terms. Read them before commercial use at scale.
- Optional MCP: `reddit` in mcp.json (karanb192/reddit-mcp-buddy, MIT).

## TikTok Creative Center and Instagram trending audio (manual by default)
- No official public API for trend data. 5-minute daily manual check (references/trend-sources.md), written to `data/manual_trends.csv`.
- Optional BYOK: an Apify Creative Center actor via the `apify` MCP (MIT server). Env var `APIFY_TOKEN`. Unofficial endpoints; may break; costs per result.

## X (optional, paid)
- X API v2 is pay-per-use by default (reports cite about $0.005 per post read in 2026). Not used unless you add it. Env var `X_BEARER_TOKEN`.

## treg (optional)
If you have your own treg account, its trends and social tools can replace Apify. Not required.

Keys live in your shell or a git-ignored `.env`.
