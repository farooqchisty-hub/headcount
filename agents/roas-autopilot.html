## 1. What this agent gets you
Tell it the ROAS you need and what you can spend a day. It checks your tracking, builds the Meta campaigns, and every morning pauses losers, scales winners in safe steps and asks for fresh creative before ads tire. Every Monday it tells you straight whether the target is being hit, and if the data says it cannot be hit at this budget, it says that too.

## 2. Who it is for / not for
**For:** ecommerce and DTC brands spending roughly 50 to 5,000 a day on Meta who sell online with a working pixel, and want a disciplined media buyer that follows written rules.
**Not for:** lead gen or app installs (rules are built for purchases and purchase value), brands with no purchase tracking, special ad categories (housing, jobs, credit) without manual setup, or anyone who wants a black box that spends without asking.

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Meta app + System User token (`META_ACCESS_TOKEN`) | 20 min | free |
| Ad account id (`META_AD_ACCOUNT_ID`) | 1 min | free |
| Page id, pixel id, countries in config.yaml | 5 min | free |
| Target ROAS, daily budget, AOV in config.yaml | 2 min | free |
| Run `python3 scripts/check_setup.py --live` | 1 min | free |

API cost per run: zero. The Meta Marketing API is free; a daily run makes about 6 read calls. The only money spent is your ad budget, and only after you approve. Optional: static-ad-factory for first creatives if you have none (its own costs apply).

## 4. First run
Type this in Claude Code, Codex, OpenClaw or Hermes (in ChatGPT, upload the folder as a project and paste the same):

```
Run roas-autopilot. Target ROAS 2.5, budget 300 a day, selling our bestseller bundle at
https://example.com/products/bundle. Use the 8 creatives in ./creatives. Plan first, check tracking, then show me the launch pack.
```
It will show the plan and tracking check, then a launch pack. Nothing is created until you say yes, and nothing goes live until a second yes.

## 5. Running it on a schedule
- **Claude Code:** `/schedule` then "every day at 08:00 run roas-autopilot daily loop; Mondays also run the weekly report".
- **cron (any runtime with a CLI):** `0 8 * * * cd /path/to/workspace && claude -p "run roas-autopilot daily loop"` and `30 8 * * 1 ... "run roas-autopilot weekly report"`.
- **OpenClaw / Hermes:** add a daily job at 08:00 ad account time with the prompt "run roas-autopilot daily loop".
Run it after 07:00 in the ad account time zone so yesterday's numbers are mostly in.

## 6. What good output looks like
See `examples/example-output.md`: a plan, a tracking check, a day-22 decision table (3 pauses, 1 scale, 2 creative requests), the approval message, two weekly reports (on target, and an honest "not reachable at this budget"), and the exact API request for an approved change. All from a fictional brand.

## 7. Tuning: the 3 settings that matter most
1. `goal.target_roas` and `goal.average_order_value`: together they set target cost per purchase, which every kill and scale line is a multiple of. Get AOV right.
2. `rules.kill_no_purchase_spend_x_cpa` (default 2.0): lower to 1.5 if cash is tight, raise to 3.0 if your product has a long consideration cycle.
3. `approvals.autopilot_band`: off by default. Turn on with `allow_pause_ad: true` first; add budget classes once you trust the calls. `max_account_daily_budget` is the hard cap it can never cross.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| `check_setup` says token cannot see the account | Assign the ad account to the System User in Business Settings, then regenerate the token |
| Health gate blocks on "purchases carry no value" | Pass `value` and `currency` in the Purchase event (platform plugin settings), then re-run |
| Meta error 100 on create-adset mentioning DSA | You target an EU country: fill `eu_dsa_beneficiary` and `eu_dsa_payor` |
| Every ad shows zero purchases today | Tracking broke. The agent holds all kills and re-runs the health gate; check Events Manager |
| "refused: above the 20% step limit" | Working as designed. Approve +20% today, the next step tomorrow |

## 9. Safety and platform rules
- Uses only the official Meta Marketing API with your own token. No scraping, no browser automation on Ads Manager.
- Creates everything PAUSED. Every launch, pause, budget and bid change needs your yes unless you enabled that class in the autopilot band, which has hard caps.
- Respects Meta's rate limits with backoff. Follows Meta advertising policies: the agent checks copy against your COMPANY.md claims list and will not write restricted health, finance or before-and-after claims.

# Connect roas-autopilot

Bring your own keys. Nothing here ships with a token. Keys live in environment variables only.

## Required

### 1. Meta Marketing API access token
- **Env var:** `META_ACCESS_TOKEN`
- **What:** a System User token from your Business Manager (recommended, does not expire) or a long-lived user token (60 days).
- **Scopes:** `ads_read`, `ads_management`. Add `business_management` for the match quality call. `catalog_management` only if you run catalog ads.
- **Where:**
  1. Create an app at developers.facebook.com (type Business), add the Marketing API product.
  2. Business Settings, Users, System users: add a system user with Admin or Employee role.
  3. Assign assets to it: the ad account (Manage campaigns), the pixel / dataset, the Page, the catalog.
  4. Generate token for your app with the scopes above. Copy it once into your secret store.
- **Access level:** new apps start with standard access and lower rate limits. That is enough for one ad account. Apply for advanced access only if you manage many accounts.
- **Cost:** free. Ad spend is billed by Meta to your ad account as normal.

### 2. Ad account id
- **Env var:** `META_AD_ACCOUNT_ID` (numbers only, no `act_`). Ads Manager, account dropdown.

### 3. In config.yaml (not secret)
`account.page_id`, `account.pixel_id`, optional `instagram_user_id`, `catalog_id`, `countries`, and for EU targeting `eu_dsa_beneficiary` and `eu_dsa_payor` (Meta requires both for any ad reaching the EU).

## Optional
| Env var | What | Why |
|---|---|---|
| `META_APP_SECRET` | your app secret | adds `appsecret_proof` to every call; turn on "Require app secret" in app settings for extra safety |
| `META_API_VERSION` | e.g. `v26.0` | default is v26.0, the latest version in Meta's changelog as of Nov 2026. Bump it when Meta ships a new one |
| `HC_SLACK_WEBHOOK` (name is yours, set in `approvals.notify_slack_webhook_env`) | Slack incoming webhook | approval messages to a channel instead of a file |

## Optional MCP servers (mcp.json)
- **meta-ads** (mikusnuz/meta-ads-mcp, MIT licence, npm `@mikusnuz/meta-ads-mcp`): handy for ad hoc questions in chat. The agent's writes still go through `scripts/meta_api.py` so the step limits and PAUSED default always apply.
- **treg**: only if you have your own treg account. Not needed for anything in this agent.

## API version notes
- Graph API v26.0 released 29 July 2026; v25.0 expires 29 July 2028. Check https://developers.facebook.com/docs/graph-api/changelog/versions before bumping.
- From v25.0, `smart_promotion_type` is no longer used to create Advantage+ campaigns. The agent creates a normal `OUTCOME_SALES` campaign with campaign budget, Advantage+ audience and no placement targeting; Meta reports it as `ADVANTAGE_PLUS_SALES` in `advantage_state_info`.

## Rate limits
Ads Management calls are rate limited per ad account (business use case limits). The script retries codes 4, 17, 32, 613, 80000 and 80004 with 30, 60 second waits. A daily run uses about 6 read calls.

## Check it works
```
python3 scripts/check_setup.py            # offline checks
python3 scripts/check_setup.py --live     # one free read call: lists your ad accounts
```
