## 1. What this agent gets you
Phone photos in, a full product image set out: Amazon white main image, store hero, brand colour studio shot and lifestyle scenes. Your product is never redrawn by AI, so what shoppers see is what they get.

## 2. Who it is for / not for
For: ecommerce brands launching products or variants, Amazon and Shopify sellers, teams that need consistent catalogue imagery fast.
Not for: products that need a model wearing them (use a real shoot or a disclosed AI model workflow), heavily reflective or transparent products without a clean phone photo (cutouts struggle), or anyone wanting the product "improved" by AI.

## 3. Setup checklist
- [ ] company-brain has run (brand colours, style, where images are used)
- [ ] Google Chrome or Chromium (free)
- [ ] Background removal: `pip install "rembg[cli]"` (MIT, free) or a Replicate or fal key
- [ ] Optional image key (Gemini, OpenAI, Replicate or fal) for lifestyle scenes
Time to set up: 15 minutes. Cost per product: $0 for white, store and studio shots (all local); roughly $0.10 to $0.50 per lifestyle plate depending on provider and resolution, so about $0.50 to $2 per product with 3 scenes and a retry.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
```
Run product-photoshoot on ./photos/pillow-front.jpg. I sell on Amazon and Shopify. Make the full set.
```
ChatGPT:
```
Use the product-photoshoot skill on the attached photo. Plan the set and wait for my approval before generating scenes.
```

## 5. Running it on a schedule
Usually on demand. To process a drop folder every evening at 19:20:
- cron: `20 19 * * * cd /path/to/project && claude -p "Run product-photoshoot on new files in ./photos/inbox"`
- Claude Code: `/schedule daily 19:20 Run product-photoshoot on new files in ./photos/inbox`
Paid scenes still wait for approval.

## 6. What good output looks like
`examples/output/`: Amazon main (passes white border and 85% fill), Shopify hero, brand studio shot with shadow and reflection, plus a deliberately wrong Amazon image (60% fill) that the check catches.

## 7. Tuning (the 3 settings that matter)
- `brand_bg` and `brand_bg2`: the studio sweep colours.
- `generation.allow_edit_task`: off for strict product truth; on for more natural lifestyle shots with stricter QA.
- `marketplaces.amazon.shadow_on_main`: off is safest for Amazon review.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| Halo around the product | Try the other removal route or model; shoot on a contrasting background |
| Product looks pasted in a scene | Match the light side and camera height in the plate prompt; lower `floor_y` to the surface edge |
| Amazon check fails on fill | Raise `fill` to 0.85 (the cutout padding is trimmed automatically) |
| "unsupported PNG" | Re-save as 8 bit RGB or RGBA PNG; JPEGs get size checks only |
| Label wrong in an edit shot | Discard it and use a composite |

## 9. Safety and platform rules
Images show the real product only, at real scale. No invented features, accessories or badges. Marketplace main images follow each marketplace's rules. Lifestyle scenes with AI people are labelled where required. Nothing is uploaded without your yes.

# Connections

| Connection | Needed for | Where to get it | Scopes / access | Cost | Env var |
|---|---|---|---|---|---|
| Chrome or Chromium | Compositing and export | google.com/chrome | Local | Free | `CHROME_PATH` (optional) |
| rembg (recommended) | Free local background removal | `pip install "rembg[cli]"` (danielgatis/rembg, MIT) | Local | Free | none |
| Replicate | Background removal (`851-labs/background-remover`, `recraft-ai/recraft-remove-background`), scenes (Nano Banana Pro, Seedream 4, Flux Kontext Pro) | replicate.com, API tokens | Predictions | Per run (see each model page) | `REPLICATE_API_TOKEN` |
| fal | Background removal and scene edits (`fal-ai/nano-banana-pro/edit`, `fal-ai/bytedance/seedream/v4/edit`) | fal.ai, Keys | Model calls | Per image | `FAL_KEY` |
| Google Gemini API | Scenes and edits (`gemini-3-pro-image-preview`) | aistudio.google.com | Generative Language API | Per image | `GEMINI_API_KEY` |
| OpenAI API | Edits with `input_fidelity: high` (`gpt-image-1.5`) | platform.openai.com | Images | Per image | `OPENAI_API_KEY` |
| Shopify Admin (optional) | Upload approved images to your store | Shopify admin, Develop apps | `write_products` | Free | `SHOPIFY_ACCESS_TOKEN`, `SHOPIFY_STORE_DOMAIN` |
| treg (optional) | Only if you already have your own treg account with image models | your account | per tool | per call | `TREG_TOKEN` |

Pick one paid image provider at most. Keys stay in your environment; `--dry-run` output redacts them.
