## 1. What this agent gets you
Send a one-paragraph brief, get back a branded motion reel in 9:16 and 1:1, rendered and checked frame by frame. Kinetic type, stat count-ups, product walkthroughs, animated reviews and carousels turned into video.

## 2. Who it is for, and not for
- For: brands that post often and want clean, on-brand motion without an editor or an After Effects subscription.
- For: product, SaaS and ecommerce teams with numbers, reviews and features to show.
- Not for: live-action or talking-head edits (use clip-repurposer) or AI-generated footage (use video-ad-studio).
- Not for: long explainers over 60 s. These templates are built for 5 to 15 s reels.

## 3. Setup checklist
| Item | Needed? | Time | Cost per reel |
|---|---|---|---|
| COMPANY.md with a brand-tokens block (company-brain) | yes | 15 min once | free |
| Node.js 22+ and FFmpeg | yes | 10 min | free |
| HyperFrames CLI (`npx hyperframes`, Apache-2.0) | yes, fetched by npx on first use | 1 min | free, renders locally |
| HyperFrames agent skills (`npx hyperframes skills update`) | recommended | 1 min | free |
| Python 3.9+ | yes | | free |
No API keys. A 6 s reel renders in about 8 s on a recent laptop (draft quality).

## 4. First run
- **Claude Code:** `motion-graphics-studio: make a stat reel. 42% fewer abandoned carts in 30 days, source: our store data. 9:16 and 1:1.`
- **ChatGPT:** upload this folder as project files, then `Use motion-graphics-studio. Write the content.json for a kinetic-type reel on: <claim>.` (ChatGPT cannot run the renderer; run the printed commands on your machine.)
- **Codex:** `Follow agents/motion-graphics-studio/SKILL.md for this brief: <brief>. Render with npx hyperframes.`
- **OpenClaw / Hermes:** load as a skill, then `motion-graphics-studio: brief: <brief>`.
Try it with no setup beyond Node: `python3 scripts/apply_brand.py --template stat-countup --tokens examples/fixtures/brand.json --out out/test && cd out/test && npx hyperframes render --quality draft --output test.mp4`.

## 5. Running it on a schedule
Usually on demand. For a weekly batch from your calendar:
- cron: `40 9 * * 2 cd /path/to/motion-graphics-studio && claude -p "motion-graphics-studio: make this week's batch from the content calendar"`
- Claude Code: `/schedule weekly Tuesday 9:40am: motion-graphics-studio weekly batch`
Batches stop at the preview step for your approval.

## 6. What good output looks like
See `examples/example-output.md`: format decisions, the exact commands, check and frame-check results for each export, and the post pack.

## 7. Tuning (the 3 settings that matter)
- `exports`: add `16x9` for YouTube or your site (needs a `#root.wide` CSS rule in the template).
- `qa.max_freeze_seconds` (1.5): the dead-air limit. Lower it for faster-feeling reels.
- `copy.max_words_per_line` (3): kinetic type readability. Raise only for LinkedIn audiences who read slower content.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| `check` fails contrast | Your accent is too light for white text. apply_brand.py picks black or white automatically; rerun it, or darken `muted`. |
| `first_frame_empty` | The hook must be visible at 0 s. Do not fade the first element in from opacity 0. |
| frame_check "frozen stretch" | A hold is static too long. Add slow drift (scale 1.00 to 1.05) to the hold. |
| Render uses your system font instead of the brand font | Ship the font file in the project and add an `@font-face` rule. |
| `npx hyperframes` errors on Node | Install Node 22 or newer. |

## 9. Safety and platform rules
- Numbers need a source; reviews must be real and verbatim. Never fake a post, a like count or a verified badge.
- Use the platform's AI or paid partnership label where it applies.
- Fonts, music and images must be licensed for video. Templates use system fonts and no audio by default.

# Connections

No API keys and no MCP servers are required. Everything renders on your machine.

## Required tools
| Tool | Licence | Get it | Check |
|---|---|---|---|
| Node.js 22+ | MIT | nodejs.org or your package manager | `node --version` |
| FFmpeg (ffmpeg, ffprobe) | LGPL/GPL | ffmpeg.org or `brew install ffmpeg` | `ffmpeg -version` |
| HyperFrames CLI | Apache-2.0 (heygen-com/hyperframes) | runs via `npx hyperframes` (tested 0.9.31) | `npx hyperframes --version` |
| GSAP | Standard "no charge" GSAP licence, free for commercial use | loaded from jsDelivr, pinned to 3.14.2 in each template | |

## Recommended
- HyperFrames agent skills: `npx hyperframes skills update` (or `claude plugin marketplace add heygen-com/hyperframes` then `claude plugin install hyperframes@hyperframes`). Gives your agent the full composition contract, 450 registry blocks and media helpers.
- HyperFrames Studio desktop app (free) to preview and hand-edit timelines.

## Optional
- Remotion: only if you are eligible for its free licence or hold a Company License (see references/engine-choice.md).
- HyperFrames cloud render or Pro plan: paid, optional, never called by this agent unless you ask.
- treg: if you have your own account, its image and voice tools can supply assets. Not required.

## Environment variables
None. `HYPERFRAMES_RENDER_DETACHED=1` is optional for long renders.

`mcp.json` is intentionally empty: this agent works through the CLI.
