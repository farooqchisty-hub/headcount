## 1. What this agent gets you
LinkedIn Ads run to the customer cost you can afford. Every morning it checks spend, cost per conversion and creative fatigue, asks you to pause the ads that went stale when cost jumps, and moves budget from the campaigns that lose money to the ones that win. Named target accounts get their own ads and landing pages, and the ones that engage reach your outbound queue that week.

## 2. Who it is for / not for
- **For:** B2B sellers spending roughly 3,000 USD a month or more on LinkedIn, with a customer value that justifies LinkedIn prices, and anyone with a named-account list of 20 to 500 companies.
- **Not for:** budgets under about 1,000 USD a month (too few conversions to judge; the plan step says so), consumer products, or lists of thousands with no signal (start with cold email).

## 3. Setup checklist
| Item | Needed? | Time | Cost |
|---|---|---|---|
| company-brain run (CAC target, approver, offer, proof, brand colours) | yes | once | free |
| Lead to customer rate from your CRM (LinkedIn leads that became customers) | yes | 15 min | free |
| LinkedIn Insight Tag and one conversion rule, or Lead Gen Forms | yes | 30 min | free |
| LinkedIn developer app with Advertising API access, token with `r_ads_reporting`, `rw_ads` | to read numbers and make approved changes | days (LinkedIn approves by hand) | free |
| A static host for ABM pages | ABM lane only | 15 min | often free |
| Growth ledger (installed with Headcount) | recommended | none | free |
API calls are free; your ad spend is separate. AI tokens: about 15k to 40k per daily run. Without API access the agent still plans, writes ABM pages and ads, and judges an export you upload.

## 4. First run
Claude Code, Codex, OpenClaw, Hermes:
> Run linkedin-ads-agent. Plan first with my CAC target, then pull the last 28 days and show me today's decisions. Change nothing until I say yes.

ChatGPT (Custom GPT "LinkedIn Ads Agent"): upload a Campaign Manager export (creative performance by day, last 28 days) and your COMPANY.md, then:
> Judge these LinkedIn ads against a CAC of 900 with 15 percent of leads becoming customers.

Try it with no keys (example, fictional brand):
```
python3 scripts/rules_engine.py plan --format md
python3 scripts/linkedin_insights.py pull --fixture --no-ledger --out /tmp/snap.json
python3 scripts/rules_engine.py daily --snapshot /tmp/snap.json --format md
python3 scripts/linkedin_ads.py pause-creative --creative-urn urn:li:sponsoredCreative:9002
```

## 5. Running it on a schedule
- cron (daily 09:00): `0 9 * * * cd ~/headcount && claude -p "Run linkedin-ads-agent daily loop. Ask before any change." >> logs/cron.log 2>&1`
- Claude Code: `/schedule every day at 9am: run linkedin-ads-agent daily loop` and `/schedule mondays 9:30am: linkedin-ads-agent weekly verdict and ABM refresh`
- OpenClaw: `openclaw cron add --cron "0 9 * * *" --session isolated --message "Run linkedin-ads-agent daily loop"`
- Hermes: `hermes cron create "every day 9am" "Run the LinkedIn Ads daily loop" --skill linkedin-ads-agent --workdir ~/headcount`
Scheduled runs still stop at approvals: they draft the decisions, log "waiting for approval" and wait for you.

## 6. What good output looks like
`examples/` (example, fictional brands):
- `performance/`: a 28 day snapshot, today's decisions (one fatigued ad paused after cost jumped 64 percent, one ad with no conversions paused, 12 a day shifted from retargeting to the best prospecting campaign, an audience hold flagged), the weekly verdict and the plan.
- `abm/`: target accounts, two tier 1 pages written for one company each, ads, and an engaged account handed to outbound.
Good means: CAC within 15 percent of target by week 4, at least 3 live ads per campaign, and 10 to 20 percent of tier 1 and 2 ABM accounts engaging within 30 days.

## 7. Tuning (config.yaml)
1. `goal.lead_to_customer_rate`: the most important number. Too high and the agent scales campaigns that bring leads who never buy. Recheck it quarterly, or export closed customers by campaign so the agent uses true CAC.
2. `rules.cac_jump_share` (1.25) and `fatigue.frequency_7d_max` (4): how fast fatigued ads get paused. Small audiences: raise frequency to 6.
3. `approvals.autopilot_band`: turn on `allow_pause_creative` once you trust the pauses; keep `allow_pause_campaign` off.

## 8. Troubleshooting
| Symptom | Fix |
|---|---|
| 401 or 403 | Token expired (LinkedIn tokens last 60 days) or lacks `r_ads_reporting` / `rw_ads`, or your ad account role is VIEWER. |
| 400 about the version header | `api.version` is sunset. Set the current YYYYMM (references/linkedin-ads-api.md). |
| Everything says WAIT | Campaigns under 7 days or under one target cost per conversion of spend. Normal in week 1. |
| Zero conversions everywhere | The Insight Tag or conversion rule broke. The agent stops judging until you fix it. |
| A1 audience hold | Audience under 300 matched members. Widen or merge campaigns. |
| Pause fails with 400 | The ad is still in LinkedIn review; it cannot be paused until review ends. |

## 9. Safety and platform rules
- Nothing is ever activated by the agent. New campaigns and ads are created as DRAFT; you switch them on in Campaign Manager.
- Every pause and budget change waits for your yes unless you enable that class in the autopilot band, and budget steps are capped at 20 percent.
- Official LinkedIn Marketing API only. No browser automation of LinkedIn (it breaks the User Agreement).
- ABM: no other company's logo in paid ads, personalised pages are `noindex`, and follow-ups never mention that someone saw an ad or visited a page.
- LinkedIn advertising policies apply to all copy and images.

# Connect: linkedin-ads-agent

| Service | Env var | Where to get it | Scopes or settings | Cost | Used for |
|---|---|---|---|---|---|
| LinkedIn Marketing API | `LINKEDIN_ACCESS_TOKEN`, `LINKEDIN_AD_ACCOUNT_ID` | developer.linkedin.com: create an app, verify it with your company page, request the Advertising API product; OAuth 2.0 member token from a member with CAMPAIGN_MANAGER (or higher) on the ad account | `r_ads_reporting` (numbers), `rw_ads` (pause, budgets, drafts), `w_organization_social` (ABM sponsored-only posts) | free API; ad spend separate | daily pull, approved changes, ABM drafts |
| Your company page | `LINKEDIN_ORG_URN` | the number in your page admin URL: `urn:li:organization:<number>` | page role ADMINISTRATOR or DIRECT_SPONSORED_CONTENT_POSTER | free | author of ABM sponsored posts |
| API version | `LINKEDIN_API_VERSION` (optional) | learn.microsoft.com/linkedin/marketing/versioning | YYYYMM, default `202610` from config | free | Linkedin-Version header |
| LinkedIn Insight Tag | none | Campaign Manager, Analyze, Insight Tag; then a conversion rule | 30 day click, 7 day view windows by default | free | the conversions the agent judges |
| CRM export (optional) | none | your CRM: closed-won deals with the LinkedIn campaign id (UTM or LinkedIn's CRM sync) | CSV `date,campaign_id,customers` | free | true CAC instead of implied |
| Growth ledger | none | installed with Headcount (`../growth-ledger`) | none | free | budget change history, every live change recorded |
| HubSpot (optional) | `HUBSPOT_ACCESS_TOKEN` | private app | `crm.objects.companies.read`, `crm.objects.contacts.read`, `crm.objects.deals.read` | free tier | contacts at target accounts, closed customers |
| Exa (optional) | `EXA_API_KEY` or Exa MCP | dashboard.exa.ai | none | per search | extra tier 1 account research |
| Image generation | your provider's key | via static-ad-factory | per provider | per image | ABM and refresh creatives |
| Web analytics | export only | GA4, PostHog or similar | filter on the `a` URL parameter | your tool | ABM page engagement |

Tokens: LinkedIn member access tokens last 60 days; refresh tokens are issued only to approved partner apps. Put a reminder in your calendar, or re-run the OAuth flow when check_setup reports 401.

MCP servers in `mcp.json`: HubSpot (`@shinzolabs/hubspot-mcp`, MIT) and Exa (official, MIT), both optional. No LinkedIn MCP is bundled: community LinkedIn servers mostly drive a logged-in browser session, which LinkedIn's terms prohibit. The official REST API is used through the scripts. The growth ledger's own read only MCP server (`../growth-ledger/scripts/ledger_mcp.py`) lets your AI tool ask what this agent changed.

Optional: treg (tool registry) only if you already have your own account.

Verify before first live use:
- `api.version` is a supported YYYYMM (202610 was the latest on 11 Nov 2026; 202511 sunsets 16 Nov 2026).
- Run `python3 scripts/linkedin_insights.py pull --dry-run`, then one live pull, and compare yesterday's spend with Campaign Manager.
- Make one approved change by hand-picked decision and check it in Campaign Manager's change history before trusting the loop.
- ABM: the company list CSV headers match the current Matched Audiences company template (download it in Campaign Manager and compare).
