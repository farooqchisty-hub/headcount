## 1. What this agent gets you
One page every Monday: the up to 4 numbers that moved beyond normal, why each moved, and what each of your agents does next. Replaces the weekly "what changed and why" report that takes most operators hours.

## 2. Who it is for / not for
- For: anyone running two or more Headcount agents, or with at least ads plus a store or ESP.
- For agencies: one page per client plus an index (agency mode).
- Not for: live dashboards or daily alerts. ad-account-watchdog covers hourly problems.

## 3. Setup checklist
- Required: brain/COMPANY.md (run company-brain first) and at least one revenue source (Shopify, Stripe or GA4).
- Recommended: Meta, Google Ads, ESP export, Search Console. See CONNECT.md.
- Time: 20 to 40 minutes for keys the first time, mostly Google OAuth.
- Cost per run: no API fees (all read APIs used are free). AI tokens roughly 20k to 50k per run.
- Check: `python3 agents/monday-standup/scripts/check_setup.py`
- Growth ledger (installed with Headcount): when `~/headcount/ledger/headcount.db` exists the page also uses it: structured changes with before, after and approver, approvals by number, and weekly numbers your CSV lacks (LinkedIn included). `--no-ledger` turns it off.

## 4. First run
Start from your Headcount home (`cd ~/headcount`):
- Claude Code: `Run monday-standup for last week`
- ChatGPT (Custom GPT "Monday Standup"): upload `data/weekly.csv` and your `logs/*.md`, then `Run the standup on these files`
- Codex: `Use the monday-standup skill for last week`
- OpenClaw: `/monday-standup` or "run the standup"
- Hermes: `hermes chat -s monday-standup` then `Run the standup for last week`
Try it with no keys: `python3 agents/monday-standup/scripts/build_standup.py --dry-run`

## 5. Running it on a schedule
- cron (Mondays 07:00): `0 7 * * 1 cd ~/headcount && claude -p "Run monday-standup for last week" >> logs/cron.log 2>&1`
- Claude Code: `/schedule every Monday at 7am: run monday-standup for last week`
- OpenClaw: `openclaw cron add --cron "0 7 * * 1" --tz "America/New_York" --session isolated --message "Run monday-standup for last week"`
- Hermes: `hermes cron create "every monday 7am" "Run the standup for last week" --skill monday-standup --workdir ~/headcount`

## 6. What good output looks like
`examples/example-output/standup.md` (fictional tea brand). The script draft it came from: `examples/example-output/standup-draft.md`.

## 7. Tuning (config.yaml)
- `sigma_threshold` and `pct_threshold`: how unusual a move must be to make the page (2.0 and 25 percent). Raise them if the page feels noisy.
- `min_material_pct`: stops tiny but statistically unusual wobbles (5 percent).
- `metrics` weights and `north_star`: what matters most for your business. SaaS: raise `stripe.*`, drop `shopify.*`.

## 8. Troubleshooting
1. "No source returned data": keys missing. Run check_setup.py; it lists the env var names it needs.
2. Google 403: the OAuth account is not a user on the GA4 property or GSC site, or the API is not enabled in your Cloud project.
3. Everything flagged in week 1: you have fewer than 4 weeks of history. Metrics show "new" until 3 baseline weeks exist.
4. Numbers differ from Ads Manager: attribution windows differ. Meta reports its own attributed purchases; Shopify is ground truth for revenue. The page uses each source as is and says which.
5. "Not explained yet" on a big move: no agent logged a change. Answer the one question it asks (promo, stock, site change) and it adds it to the page.

## 9. Safety
Read only. It never changes budgets, campaigns or flows. Approvals it lists go back to the owning agent, which waits for your yes.

# Connections for monday-standup

All read only. Connect what you use; the page works with any subset. Full walkthroughs in `guides/`.

| Source | What it gives | Where to get it | Scopes / permissions | Cost | Env vars |
|---|---|---|---|---|---|
| GA4 | sessions | Google Cloud project, enable "Google Analytics Data API"; OAuth client; add the account as Viewer on the GA4 property | `analytics.readonly` | free | `GA4_PROPERTY_ID` + Google OAuth |
| Google Search Console | clicks, impressions, position | enable "Search Console API"; the account must be a user on the property | `webmasters.readonly` | free | `GSC_SITE_URL` (e.g. `sc-domain:example.com`) + Google OAuth |
| Google Ads | spend, conversions, value | Google Ads API Center: developer token (Basic access is enough to read your own accounts); OAuth | `adwords` | free | `GOOGLE_ADS_CUSTOMER_ID`, `GOOGLE_ADS_DEVELOPER_TOKEN`, optional `GOOGLE_ADS_LOGIN_CUSTOMER_ID` (manager), `GOOGLE_ADS_API_VERSION` |
| Meta ads | spend, impressions, clicks, purchases, value | Meta Business Suite: System User with access to the ad account, generate token | `ads_read` | free | `META_AD_ACCOUNT_ID`, `META_ACCESS_TOKEN`, `META_API_VERSION` |
| Shopify | revenue, orders, new customers | Shopify admin: Settings, Apps, Develop apps, create app, Admin API access token | `read_orders`, `read_customers` (orders older than 60 days also need `read_all_orders`) | free | `SHOPIFY_STORE_DOMAIN` (`store.myshopify.com`), `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_API_VERSION` |
| Stripe | revenue, new customers | Stripe dashboard: Developers, API keys, create restricted key | read on Charges and Customers | free | `STRIPE_API_KEY` (restricted `rk_` key) |
| ESP (Klaviyo, Mailchimp, Brevo, Omnisend, etc.) | attributed revenue, delivered, clicks, unsubscribes | weekly CSV export from your ESP, or an ESP MCP server | read only key if using MCP | free | `--esp-csv path`; Klaviyo MCP: `KLAVIYO_API_KEY` |

Google OAuth for GA4, GSC and Google Ads (pick one):
- `GOOGLE_ACCESS_TOKEN` (short lived, for testing), or
- `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`, `GOOGLE_REFRESH_TOKEN` (one Desktop OAuth client with all three scopes; see guides/connect-google.md).

MCP route (optional): `mcp.json` lists the official Google Analytics and Google Ads MCP servers (Apache-2.0) plus MIT community servers for Search Console, Shopify, Meta and Klaviyo. The agent uses them when a script source is skipped.

Cost per run: zero API fees (all these APIs are free to read). AI tokens: roughly 20k to 50k per run, more in agency mode (per client).

Never paste keys into chat or COMPANY.md. Put them in your shell profile or a `.env` file that is not committed.
