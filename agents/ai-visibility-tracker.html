## 1. What this agent gets you
Every week you learn how often ChatGPT, Claude, Perplexity and Gemini recommend you, where you rank in their answers, and which pages they cite instead of you. Real moves are separated from random noise, so you stop chasing phantom wins.

## 2. Who it is for, and not for
- For: brands that sell in a category people ask AI assistants about ("best X for Y", "X vs Y", "alternatives to X").
- For: teams doing content, PR or GEO work who need proof it moved anything.
- Not for: local services that live on Google Maps (use your Business Profile insights), or brands with under 10 branded searches a month. The assistants will not know you yet; work on getting mentioned first (geo-citation-closer).

## 3. Setup checklist
| Item | Time | Cost |
|---|---|---|
| Company brain filled (company-brain agent) | 20 min, once | free |
| At least one key: OpenAI, Anthropic, Perplexity or Gemini (CONNECT.md) | 5 min each | pay as you go |
| Brand, aliases, domains, competitors in config.yaml | 5 min | free |
| Review the generated prompt set | 15 min, once a quarter | free |

Honest running cost: 60 prompts x 4 models x 3 samples is about 720 calls. At planning rates in config.yaml (2 to 4 cents a call including the search fee) that is roughly $15 to $25 a week. One model only: about $5. Check each vendor's pricing page; prices change.

## 4. First run
Type this in Claude Code, ChatGPT (with the files uploaded), Codex, OpenClaw or Hermes:

> Run ai-visibility-tracker. Build my prompt set from the company brain, show me the prompts and the cost, then run it and give me the report.

The agent writes prompts, shows the cost, waits for your yes, runs, checks 20 answers by hand, and writes `reports/<week>.md`.

## 5. Running it on a schedule
- Cron (Monday 06:00): `0 6 * * 1 cd /path/to/ai-visibility-tracker && python3 scripts/run_prompts.py --yes && python3 scripts/score.py --run data/runs/$(date +\%G-W\%V).jsonl --report-out reports/$(date +\%G-W\%V).md --gaps-out data/gaps/$(date +\%G-W\%V).json`
- Claude Code: `/schedule every Monday 6am: run ai-visibility-tracker weekly shift`
- OpenClaw or Hermes: add a weekly job with the same message as First run.
Cron skips the hand check in Step 5. Ask the agent to review the answers when you read the report.

## 6. What good output looks like
See `examples/example-output/report-2026-W46.md` (fictional brand "Trailhen"). Good output has: one headline number, a table by model with a 95% range, a clear "real move" or "noise" label on every change, and the exact pages winning instead of you.

## 7. Tuning (the 3 settings that matter)
1. `competitors`: the share of voice is only as good as this list. Add every brand that shows up in "Who wins instead".
2. `brand.aliases`: missed product line names cause false "not mentioned". Add them; re-scoring is free.
3. `run.samples_per_prompt`: keep at 3 or more. AI answers change from one call to the next; 1 sample tells you nothing.

## 8. Troubleshooting
| Problem | Fix |
|---|---|
| 404 or "model not found" | Model ids changed. Update `models.*` from the vendor's model list. |
| 401 | Key wrong or not exported in this shell. `echo ${OPENAI_API_KEY:+set}` |
| 429 rate limit | Raise `run.pause_seconds` to 4; keep concurrency at 1. |
| Brand never found but you see it in answers | Missing alias. Read 10 answers, add the spelling used. |
| Gemini gaps show only domains | Gemini cites through Google redirect links. The agent resolves the page in Step 7. |

## 9. Safety and platform rules
- Uses only official vendor APIs with your keys. No scraping of chat apps, no logged-in browser automation.
- API answers are close to, but not identical to, what users see in the consumer apps (different defaults, personalisation, location). Treat numbers as a consistent panel, not an exact replica.
- Citations returned by OpenAI and Anthropic must be shown as links when you display answers to others (vendor terms).
- Budget cap in config.yaml blocks runs over your limit.

# Connect: keys and services

All keys are read from environment variables. Never paste keys into config.yaml or chat.

| Env var | Service | Where to get it | Scopes / plan | Cost (check vendor page) |
|---|---|---|---|---|
| `OPENAI_API_KEY` | OpenAI Responses API with `web_search` tool | platform.openai.com, API keys | Project key with Responses access | Tokens plus a per-search fee |
| `ANTHROPIC_API_KEY` | Claude Messages API with web search tool | platform.claude.com, API keys | Web search must be enabled by your org admin in Console settings | $10 per 1,000 searches plus tokens |
| `PERPLEXITY_API_KEY` | Perplexity Agent API (`POST /v1/agent`) | perplexity.ai, API settings | Any API tier | Per request and tokens; response `usage` shows cost |
| `GEMINI_API_KEY` | Gemini `generateContent` with `googleSearch` grounding | aistudio.google.com, API keys | Paid tier for volume; free tier has low daily limits | Tokens plus grounding fee above free quota |

## Setting keys
```bash
export OPENAI_API_KEY=...        # add to ~/.zshrc or a .env your runtime loads
export ANTHROPIC_API_KEY=...
export PERPLEXITY_API_KEY=...
export GEMINI_API_KEY=...
python3 scripts/check_setup.py
```

## Notes per provider
- **OpenAI:** request `{"model", "input", "tools": [{"type": "web_search"}]}` to `https://api.openai.com/v1/responses`. Citations are `url_citation` annotations on `output_text`.
- **Anthropic:** header `anthropic-version` is set in `models.anthropic_version`. Tool `web_search_20250305` with `max_uses: 5`. If your org disabled web search the API returns 400; ask your admin.
- **Perplexity:** Sonar chat completions support ended 27 Sep 2026; this agent uses the Agent API. With `models.perplexity_model` empty it uses the `effort` preset (closest to the Perplexity app). Set a `provider/model` id to pin a model.
- **Gemini:** cited links are Google redirect URLs; the title field carries the source domain.

## Optional
- **treg (only if you have your own account):** some registries resell AI visibility checks. Not needed; direct APIs above are the primary path.
- **Open-source alternative:** elmohq/elmo (MIT) is a self-hostable AEO tracker with a UI. Install separately if you want dashboards; this agent does not bundle it.

## MCP
mcp.json lists no required servers. The scripts call vendor APIs directly so runs are reproducible from cron.
