Root: `/Users/azirahat/claude fc/gtm-agents/headcount/agents/<folder>/`

## Files

```
<folder>/
  SKILL.md          # REQUIRED. Agent Skills standard. Frontmatter + the full operating procedure.
  README.md         # REQUIRED. Human guide (see below).
  CONNECT.md        # REQUIRED. Every API/key/MCP it needs: where to get it, scopes, cost, env var name.
  config.yaml       # REQUIRED. Every threshold/rule the buyer can edit, with comments and safe defaults.
  mcp.json          # REQUIRED. MCP servers it uses (mcpServers format). Only MIT/Apache/BSD servers, or official vendor servers.
  references/       # REQUIRED. 2 to 5 playbook files: the methods, frameworks, benchmarks, templates the agent uses. Original writing, synthesised from research. Cite sources at the bottom of each file.
  scripts/          # Deterministic helpers. Python 3 STANDARD LIBRARY ONLY (urllib, json, csv, argparse). Every script: --help, --dry-run, reads keys from env, never hardcodes secrets, exits non-zero on error.
  examples/         # REQUIRED. One worked example run: example-input + example-output, realistic, clearly labelled "example, fictional brand".
  templates/        # Output templates (reports, briefs, emails) where the agent produces documents.
```

## SKILL.md structure

```markdown
---
name: <folder>
description: <one sentence: the outcome + when to use it. Under 300 chars. This is what triggers it.>
---

# <Agent name>
**Outcome:** <the result it owns>
**Shift:** <trigger and cadence>
**Reads:** ../../brain/COMPANY.md (always first)

## Before you start
- checks: keys present (run scripts/check_setup.py if present), COMPANY.md exists (if not, tell user to run company-brain first)

## Workflow
### Step 1: <name>
<exact instructions, tools to call, decision rules, what to save where>
... (6 to 10 steps, each with decisions, not vague)

## Quality gates
- <hard checks before any output is shown/used>

## Human checkpoints
- <exactly where it stops for approval; nothing public, paid or sent without a yes unless config.yaml explicitly allows a class of action>

## Outputs
- <files written, where, naming>

## Log
Append a dated entry to ./logs/<folder>.md: what ran, what changed, numbers, next actions. monday-standup reads this.
- Ledger: also record this run in the growth ledger (paths relative to this skill folder; skip if `../growth-ledger` is not installed): `python3 ../growth-ledger/scripts/ledger.py log-action ...` for each change, `log-metric ...` for each number, `log-run ...` once at the end.

## Hand-offs
- <which agents it feeds and how>
```

## README.md structure (the handoff guide for the buyer)
1. What this agent gets you (outcome, 2 lines)
2. Who it is for / not for
3. Setup checklist (keys, time to set up, cost of APIs per run, honest)
4. First run: exact message to type in Claude Code / ChatGPT / Codex / OpenClaw / Hermes
5. Running it on a schedule (cron line, Claude Code /schedule, or OpenClaw/Hermes scheduler)
6. What good output looks like (point to examples/)
7. Tuning (the 3 config.yaml settings that matter most)
8. Troubleshooting (5 common failures and fixes)
9. Safety and platform rules (ToS, disclosure, rate limits) where relevant

## Hard rules
- Brand-agnostic. No real brand names as defaults. Examples use fictional brands.
- No em dashes or en dashes anywhere. Use commas, colons, full stops.
- Bring your own keys. Never ship any token. Never call a paid API during build/testing; use --dry-run and fixture data.
- Never bundle code from repos without MIT/Apache/BSD licence. You may point to other repos as optional installs with their licence named.
- Anything that posts, sends, spends or publishes is behind a human approval checkpoint by default. Config can relax it per action class, never globally.
- Platform-safety: official APIs first. Disclose affiliation in community replies. AI personas carry AI disclosure labels. No fake reviews, no vote manipulation, no impersonating real people, no buying engagement.
- Outcome language for humans: plain, short sentences, no jargon the buyer must learn.
- Depth beats breadth: an agent must contain real decision rules, thresholds and benchmarks, not "analyse the data".
- treg (treg.dev style tool registry) may be listed as an OPTIONAL connector only if the buyer has their own account. Direct vendor APIs (Meta Marketing API, Google Ads API, etc.) are the primary path.
