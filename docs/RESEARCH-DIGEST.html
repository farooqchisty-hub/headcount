## Licences
Safe to bundle: MIT, Apache-2.0, BSD. AGPL (firecrawl, postiz): call as a service only. BSL pipeboard/meta-ads-mcp: no resale, do NOT use. No-licence repos (anthropics/skills, awesome lists): reference only.

## Verified repos by function (stars, licence)
- Ads: googleads/google-ads-mcp (Apache), kLOsk/adloop (MIT, Google+Reddit Ads+GA4 guarded writes), mikusnuz/meta-ads-mcp (MIT, Marketing API v25, 135 tools), brandu-mos/konquest-meta-ads-mcp (MIT), gomarble-ai/google-ads-mcp-server (MIT), irinabuht12-oss/google-ads-meta-ads-mcp (MIT).
- Creative/video: heygen-com/hyperframes (Apache), remotion-dev/remotion (company licence above size threshold), harry0703/MoneyPrinterTurbo (MIT), Anil-matcha/AI-Youtube-Shorts-Generator (MIT).
- SEO: AgriciDaniel/claude-seo (MIT), dataforseo/mcp-server-typescript (Apache), saurabhsharma2u/search-console-mcp (MIT), FlorianBruniaux/google-search-console-mcp (MIT).
- GEO: elmohq/elmo (MIT), onvoyage-ai/gtm-engineer-skills (MIT), yaojingang/GEORank (Apache), addyosmani/agentic-seo (MIT).
- Outbound: Othmane-Khadri/YALC (MIT, Clay alternative), gtmagents/gtm-agents (Apache), LeadMagic/gtm-skills (MIT), apolloio/apollo-mcp-plugin (MIT), stickerdaniel/linkedin-mcp-server (Apache), Linked-API/linkedin-skills (MIT).
- Commerce/CRM: Shopify/Shopify-AI-Toolkit (MIT), GeLi2001/shopify-mcp (MIT), doinglean/klaviyo-mcp (MIT), shinzo-labs/hubspot-mcp (MIT).
- Analytics: googleanalytics/google-analytics-mcp (Apache), PostHog/mcp (MIT).
- Social: karanb192/reddit-mcp-buddy (MIT), jordanburke/reddit-mcp-server (MIT), EnesCinr/twitter-mcp (MIT), Seym0n/tiktok-mcp (MIT), gitroomhq/postiz-app (AGPL, service only).
- Research/infra: dgtlmoon/changedetection.io (Apache), exa-labs/exa-mcp-server (MIT), apify/apify-mcp-server (MIT), unclecode/crawl4ai (Apache), browser-use/browser-use (MIT), vercel-labs/agent-browser (Apache), microsoft/playwright-mcp (Apache), ComposioHQ/composio (MIT).
- Base skills: coreyhaines31/marketingskills (MIT, 59.6k). Format standard: agentskills/agentskills (SKILL.md). Multi-runtime packaging pattern: wshobson/agents, unifapi-agent/agents (closest rival).

## X/Twitter playbooks (views)
- Anthropic one-person growth team: ad CSV, flag weak ads, regen copy into 100 Figma templates (1.1M).
- "Eddie" self-improving ad agent: Apify Ad Library scrape, sort by longevity, clone, TikTok Spark ads, learn (1.3M).
- Perplexity Computer ran $30K Meta spend, 63% higher ROAS than agency (190K).
- Greg Isenberg: looping agent runs ad account (Reddit pains, statics, vision brand check, UGC, kill/scale); 23 trigger growth agents (Stripe cancel reason to winback, competitor outage to "alternative" ads, self-pruning PostHog test).
- mikefutia: 50 static concepts daily from reviews/winners; product+prompt to Seedance UGC video; JSON prompts for studio product shots; video teardown skill; Klaviyo audit.
- maverickecom: 24 AI creators, 300+ TikTok Shop videos/day using GMV-ranked hooks (Fastmoss/Kalodata). spwfeijen: 550 UGC videos/day engine.
- coldemailchris 115-step GTM playbook; ColdIQ runs outbound on 15 Claude skills; Matt Berman $130/mo open-source GTM system.
- codyschneider: Claude Code SEO via .env of APIs; $5K bounty for programmatic IG creator DM outreach (unmet demand).
- startupideaspod pSEO "best X for Y" with Firecrawl; borjafat 232 GEO tactics; wespreadjam AI-crawler log audit; geektao tool pages win ChatGPT traffic.
- recap_david content agent replaced $100K media team (Reddit/HN/X scrape to newsletter, threads, shorts).
- Gaps: posts stop at generation (no closed loop); workflows gated behind "comment X"; no shared brand-context store; GEO manual; lifecycle and creator outreach barely covered.

## Reddit operator pain (top recurring jobs)
1 client reporting with "what changed and why" (10 hrs/week); 2 fresh creative angles, not near-duplicates (Andromeda: 50 similar ads = 1); 3 SEO without slop; 4 outbound that doesn't read as AI, with memory of winning angles; 5 competitor monitoring; 6 PPC hygiene; 7 ad account watchdog ($600 auto-apply loss); 8 AI visibility tracking; 9 bulk PDP SEO; 10 ecom flows and revenue recovery; 11 AI UGC video ($600/week editors, $25 to 50/hr); 12 founder-voice LinkedIn ($40 to 50/post, "100% human"); 13 review replies; 14 long-form to clips (4 hrs/episode); 15 cheaper enrichment than Clay.
Cross-cutting: generic AI output is the #1 objection; trusted = real inputs + human check; narrow boring agents work; "autonomous" is distrusted.

## Competitors
Free skill packs (marketingskills, Anthropic marketing plugin, 120-skill packs), $167 167-skill Gumroad bundle, n8n template stores $5 to $97, Okara AI CMO $129 to $249/mo, Arcads "Mark" (Claude Code for Meta Ads, $16M raised), Gooseworks skills, Clay $185 to $495/mo, Artisan/11x $1.5k to $5k/mo, Maven cohorts $500 to $1,300. Gaps: single-runtime, no live data, count-based, no done-for-you middle, no ecom focus, no closed loop.
