</style></head><body><nav><div class="w"><b>Headcount</b><a href="../index.html">Overview</a><a href="../index.html#agents">40 agents</a><a href="../index.html#pricing">Pricing</a><a href="https://ecomagents.ai/headcount/">Sales page</a><a href="../index.html#docs">Docs</a></div></nav><main class="w"><article class="doc" id="doc"></article><script type="text/markdown" id="md"># The prompt (reuse this for any "research and package agents" job)

ROLE: GTM product strategist + agent architect.

GOAL: 30 sellable AI marketing/GTM agent packages, installable in Claude Code, ChatGPT, Hermes, OpenClaw and similar. Sold as ONE product via Meta ads.

THE BAR (reject anything that fails):
- An agent runs a multi-step workflow with tools. It pulls live data, decides, produces, checks itself, and hands off.
- It is NOT a prompt. If a user could get the same result by pasting one instruction into ChatGPT, it is out. (Copywriter, UGC script writer, caption generator: out.)
- Each one owns a specific job with a trigger, a cadence and a measurable output.

STEPS:
1. Scout. X/Twitter viral playbook threads (with engagement numbers). GitHub repos of marketing skills, agents, MCP servers. Reddit threads where operators describe real workflows and pain. Competing paid products (agent packs, skill bundles, n8n/Make template stores, Gumroad). Every claim gets a URL.
2. Extract. Turn each playbook into a candidate workflow: trigger, steps, data sources, decisions, output.
3. Score. Agentic depth, pain/willingness to pay, demo-ability in a 15s ad, build effort, uniqueness vs. what's free.
4. Pick 30. For each: name, job, trigger and cadence, workflow steps, tools/APIs/MCPs, source repos and playbooks it packages, files in the package (AGENT.md, skills, assets, config), output, quality gates, human checkpoints.
5. Package. Product name, positioning, tiers, pricing, install path per platform, and 5 Meta ad angles.
6. Publish as a shareable page. Crisp. No em dashes.
