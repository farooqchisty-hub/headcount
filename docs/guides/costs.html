Honest ranges, in USD, checked 11 Nov 2026. Two kinds of cost:
1. AI runtime: your Claude Code, Codex, ChatGPT, OpenClaw or Hermes model usage. On a subscription this is included up to its limits; on pay-as-you-go APIs a typical agent run is 20k to 150k tokens, roughly 0.05 to 1.50 USD depending on model.
2. Third-party API fees: listed below. Reading your own ad, analytics, store and ESP data is free on every platform we use.

Prices change. Each agent shows an estimate before any paid batch and waits for a yes. Set provider budget caps (guides/connect-ai-models.md).

## Assumptions behind the ranges
- Image generation 0.02 to 0.20 per image depending on model and size.
- AI video 0.05 to 0.50 per second of output depending on model and resolution; most 15 to 30 s ads need 2 to 4 generations per usable clip.
- Voiceover about 0.10 to 0.30 per minute of audio on mid tier voice plans.
- LLM answer checks (AI visibility) about 0.002 to 0.02 per prompt per engine.
- Contact enrichment 0.01 to 0.10 per lookup, 0.003 to 0.01 per email verification.
- Web data (SERP, backlinks, scraping) 0.001 to 0.05 per request depending on provider.
