Run an agent by hand once and check its output before you schedule it. Scheduled runs still stop at every approval checkpoint: they draft, log "waiting for approval", and you approve later.

Recommended cadence for all 42 agents: HANDOFF.md section 4. Always run from the Headcount home so `brain/` and `logs/` resolve.

## Claude Code
Two options:
1. Scheduled tasks inside Claude Code: type `/schedule` and describe it, e.g. `/schedule every Monday at 7am: run monday-standup for last week`. Manage with `/schedule list`. Depending on your setup these run as cloud routines or on your machine; cloud runs cannot see local files, so keep `brain/` in a synced repo or run locally.
2. cron (macOS or Linux) with headless mode:
```
crontab -e
# Monday standup, 07:00
0 7 * * 1  cd ~/headcount && claude -p "Run monday-standup for last week" >> logs/cron.log 2>&1
# ad watchdog, hourly
5 * * * *  cd ~/headcount && claude -p "Run ad-account-watchdog" >> logs/cron.log 2>&1
```
Headless runs cannot click "allow", so give them only the tool permissions they need (`--allowedTools`, or project `.claude/settings.json`). Never pass a flag that skips all permission checks for agents that can post or spend.

## OpenAI Codex
No verified built-in scheduler. Use cron with `codex exec "..."` (see runtimes/codex/README.md).

## OpenClaw
Built-in Gateway cron:
```
openclaw cron add --cron "0 7 * * 1" --tz "Europe/London" --session isolated --message "Run monday-standup for last week" --no-deliver
openclaw cron add --cron "5 * * * *" --tz "Europe/London" --session isolated --message "Run ad-account-watchdog" --no-deliver
openclaw cron list
```
Use `--announce` with a channel to get the output in chat. Mutations need `operator.admin`.

## Hermes Agent
```
hermes cron create "every monday 7am" "Run the standup for last week" --skill monday-standup --workdir ~/headcount
hermes cron create "every 1h" "Run hourly ad checks" --skill ad-account-watchdog --workdir ~/headcount
```
Attach several skills with repeated `--skill`. `--timezone Area/City` pins a timezone. `--paused` creates it disabled.

## ChatGPT
Custom GPTs do not run on a schedule. Run scheduled agents in one of the runtimes above and use ChatGPT for on-demand work.

## Windows
Use Task Scheduler with `cmd /c "cd /d %USERPROFILE%\headcount && claude -p \"Run monday-standup for last week\""`, or run Linux cron inside WSL.

## Good habits
- Stagger jobs a few minutes apart (5 past, 10 past) so APIs are not hit at once.
- Daily jobs before 06:00 local, standup at 07:00 Monday, so the page sees Sunday's logs.
- Keep `logs/cron.log` and check it weekly. monday-standup lists idle agents that stopped logging.
- To stop everything fast: `crontab -l > ~/crontab.bak && crontab -r`, `openclaw cron list` then remove, `hermes cron list` then remove, `/schedule list` in Claude Code.
