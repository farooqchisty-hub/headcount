Used by: roas-autopilot, ad-account-watchdog, winner-remixer, static-ad-factory (upload), video-ad-studio (upload), influencer-deal-desk (whitelisting), monday-standup, competitor-watch (Ad Library).

## What you need
| Item | Env var | Notes |
|---|---|---|
| Ad account ID | `META_AD_ACCOUNT_ID` | Ads Manager URL `act=123...`; agents accept with or without `act_` |
| Long-lived token | `META_ACCESS_TOKEN` | System User token (does not expire) is best |
| Pixel or dataset ID | `META_PIXEL_ID` | Events Manager |
| Page ID | `META_PAGE_ID` | for ad creation and comments |
| App ID and secret | `META_APP_ID`, `META_APP_SECRET` | only if an agent or MCP server asks |
| API version | `META_API_VERSION` | default `v25.0` in our scripts; change when Meta deprecates |

## Steps (about 15 minutes)
1. Business settings (business.facebook.com/settings): make sure the ad account, Page and pixel belong to your Business portfolio.
2. Create an app at developers.facebook.com, type Business, add the Marketing API product. Your own accounts only need Standard access; Advanced access is for apps managing other businesses' accounts.
3. Business settings, Users, System users: add a system user (Admin for write agents, Employee for read only). Assign assets: the ad account (Manage campaigns for write agents, View performance for read only), the Page, the pixel.
4. Generate token for the system user with your app. Scopes:
   - read only (monday-standup, ad-account-watchdog): `ads_read`, `read_insights`
   - creating and editing ads (roas-autopilot, uploads): add `ads_management`, `business_management`, `pages_read_engagement`, `pages_show_list`
   - comments and DMs (engagement-agent, dm-closer, reputation-guard): see connect-social.md
5. Put the values in your shell profile or a `.env` file outside any git repo. Test: `curl -s "https://graph.facebook.com/$META_API_VERSION/act_$META_AD_ACCOUNT_ID?fields=name,currency&access_token=$META_ACCESS_TOKEN"`.

## Ad Library (competitor-watch, winner-remixer)
The official Ad Library API covers ads about social issues, elections or politics everywhere and all ads delivered in the EU and UK (with EU transparency fields). For other commercial ads outside the EU, agents use the public Ad Library website through a browser tool or a licensed data provider; respect the site's terms and rate limits.

## Rules agents follow
- New campaigns, ad sets and ads are created PAUSED. You switch them on, or approve the agent doing it.
- Budget changes beyond `daily_spend_change_limit_pct` in COMPANY.md need a yes.
- Rate limits: Marketing API uses per-account business use case limits; agents back off on error codes 17, 32, 613 and 80004.

## MCP option
mikusnuz/meta-ads-mcp (MIT) and brandu-mos/konquest-meta-ads-mcp (MIT) expose the Marketing API as MCP tools. Do not use pipeboard-co/meta-ads-mcp (BSL, no resale).

Sources: developers.facebook.com/docs/marketing-api (authorization, system users, rate limiting); facebook.com/ads/library/api.
