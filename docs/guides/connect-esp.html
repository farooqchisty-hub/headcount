Used by: flow-architect, campaign-builder, winback-analyst, dm-closer (consented contacts), ai-sales-closer, clip-repurposer (newsletter drafts), monday-standup.

Agents build flows and campaigns as drafts. Nothing is scheduled or sent without your yes.

| ESP | Where to get a key | Scopes to grant | Env vars |
|---|---|---|---|
| Klaviyo | Settings, Account, API keys, Create private API key | Read for reporting; Full on Flows, Campaigns, Templates, Lists, Segments for builders | `KLAVIYO_API_KEY` |
| Mailchimp | Profile, Extras, API keys | key is full access; use a separate user with limited role if possible | `MAILCHIMP_API_KEY`, `MAILCHIMP_SERVER_PREFIX` (e.g. `us21`) |
| Brevo | Settings, SMTP and API, API keys | key is account wide; create one per tool so you can revoke it | `BREVO_API_KEY` |
| HubSpot | Settings, Integrations, Private apps | `crm.objects.contacts.read`, `marketing-email` read or write, `automation` for workflows | `HUBSPOT_ACCESS_TOKEN` |
| Omnisend | Store settings, API keys | read for reporting, write for campaigns | `OMNISEND_API_KEY` |
| Postscript or Attentive (SMS) | developer settings in each app | read for reporting; write only for drafts | `POSTSCRIPT_API_KEY`, `ATTENTIVE_API_KEY` |

## Weekly export (works with any ESP)
monday-standup accepts a CSV with columns `week_start,revenue,delivered,clicks,unsubscribes` (`--esp-csv`). Most ESPs export campaign and flow performance by date; sum by Monday-start week. Use the ESP's own attributed revenue and keep the same attribution window every week.

## Rules agents follow
- Opens are not used for decisions (Apple Mail Privacy Protection inflates them). Clicks, orders and revenue are.
- Every send respects consent: only subscribed profiles, unsubscribe link, physical address in the footer (CAN-SPAM, GDPR, CASL).
- SMS only to people who opted in to SMS specifically, with quiet hours from COMPANY.md (TCPA in the US; check local rules).
- Bulk senders to Gmail and Yahoo need SPF, DKIM, DMARC and one click unsubscribe; flow-architect checks your domain before building.

## MCP option
doinglean/klaviyo-mcp (MIT, small project: review first), shinzo-labs/hubspot-mcp (MIT). Check whether your ESP now publishes an official MCP server and prefer it.

Sources: developers.klaviyo.com/en/reference/api_overview; mailchimp.com/developer/marketing/docs/fundamentals; developers.brevo.com; developers.hubspot.com/docs/api/private-apps; Google and Yahoo bulk sender requirements (support.google.com/a/answer/81126).
