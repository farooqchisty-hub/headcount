One Google Cloud project and one OAuth client cover all three. About 25 minutes the first time.

Used by: google-ads-waste-killer, ad-account-watchdog, roas-autopilot (if running Google), catalog-optimizer (Merchant Center), seo-content-pipeline, technical-seo-fixer, programmatic-seo, ai-visibility-tracker, cro-test-runner, monday-standup.

## 1. Cloud project and APIs
1. console.cloud.google.com, create a project (e.g. `headcount`).
2. APIs and Services, Library, enable: Google Ads API, Google Analytics Data API, Google Analytics Admin API (optional), Google Search Console API, Content API for Shopping or Merchant API (catalog-optimizer only).
3. OAuth consent screen: User type External (or Internal on Workspace), add yourself as a test user. Scopes:
   - `https://www.googleapis.com/auth/adwords`
   - `https://www.googleapis.com/auth/analytics.readonly`
   - `https://www.googleapis.com/auth/webmasters.readonly` (use `webmasters` only if an agent submits sitemaps)
4. Credentials, Create credentials, OAuth client ID, type Desktop app. Note client ID and secret.

## 2. Get a refresh token
Any OAuth helper works. One stdlib way: open this URL (replace CLIENT_ID), approve, copy the `code` from the redirect:
```
https://accounts.google.com/o/oauth2/v2/auth?client_id=CLIENT_ID&redirect_uri=http://localhost&response_type=code&access_type=offline&prompt=consent&scope=https://www.googleapis.com/auth/adwords%20https://www.googleapis.com/auth/analytics.readonly%20https://www.googleapis.com/auth/webmasters.readonly
```
Then exchange it:
```
curl -s https://oauth2.googleapis.com/token -d client_id=$GOOGLE_CLIENT_ID -d client_secret=$GOOGLE_CLIENT_SECRET \
  -d code=PASTE_CODE -d grant_type=authorization_code -d redirect_uri=http://localhost
```
Save `refresh_token`. Apps left in "Testing" publishing status issue refresh tokens that expire after 7 days; publish the consent screen (no verification needed for your own use with under 100 users, you will see an "unverified app" warning) to keep tokens alive.

Env vars: `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`, `GOOGLE_REFRESH_TOKEN`.

## 3. Google Ads
- Developer token: Google Ads manager account (create one free if you have none), Tools, API Center. Test access works only on test accounts; apply for Basic access (usually approved in a few days) to use real accounts.
- `GOOGLE_ADS_DEVELOPER_TOKEN`, `GOOGLE_ADS_CUSTOMER_ID` (10 digits, no dashes), `GOOGLE_ADS_LOGIN_CUSTOMER_ID` (the manager account ID, if access is through a manager), `GOOGLE_ADS_API_VERSION` (our scripts default to `v22`; Google retires versions roughly yearly, update when it warns).
- Turn off auto-apply recommendations (Recommendations, Auto-apply) unless you want them; ad-account-watchdog flags them.

## 4. GA4
- `GA4_PROPERTY_ID`: Admin, Property settings (a number, not the G- measurement ID).
- The Google account you authorised needs Viewer on the property.

## 5. Search Console
- `GSC_SITE_URL`: `sc-domain:example.com` for a domain property, or the exact URL prefix `https://www.example.com/`.
- The account needs at least Restricted user access. Data lags 2 to 3 days.

## MCP option
Official: googleanalytics/google-analytics-mcp (Apache-2.0), googleads/google-ads-mcp (Apache-2.0). Community: saurabhsharma2u/search-console-mcp (MIT), kLOsk/adloop (MIT, Google Ads plus GA4 with guarded writes).

Sources: developers.google.com/google-ads/api/docs (OAuth, developer token access levels, versioning); developers.google.com/analytics/devguides/reporting/data/v1; developers.google.com/webmaster-tools/v1; developers.google.com/identity/protocols/oauth2 (refresh token expiry for apps in testing).
