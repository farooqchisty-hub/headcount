Your runtime (Claude Code, Codex, ChatGPT, OpenClaw, Hermes) already has a model for thinking and writing. These keys are only for agents that call other models directly: image, video, voice, search grounded answers, or tracking how AI engines answer (ai-visibility-tracker).

| Provider | Used for | Agents | Get a key | Env var |
|---|---|---|---|---|
| OpenAI | GPT answers for AI visibility checks, image generation (GPT Image), embeddings | ai-visibility-tracker, static-ad-factory, product-photoshoot | platform.openai.com, API keys; set a monthly budget limit | `OPENAI_API_KEY` |
| Anthropic | Claude answers for AI visibility checks, batch writing jobs outside your runtime | ai-visibility-tracker, programmatic-seo | console.anthropic.com, API keys; set spend limits per workspace | `ANTHROPIC_API_KEY` |
| Google Gemini | Gemini answers, Gemini image models, Veo video | ai-visibility-tracker, static-ad-factory, product-photoshoot, video-ad-studio | aistudio.google.com, Get API key (or Vertex AI) | `GEMINI_API_KEY` |
| Perplexity | Sonar answers with citations | ai-visibility-tracker, geo-citation-closer | perplexity.ai, Settings, API | `PERPLEXITY_API_KEY` |
| Replicate | open image and video models, upscalers, background removal | product-photoshoot, static-ad-factory, video-ad-studio, ai-influencer-farm | replicate.com, account, API tokens | `REPLICATE_API_TOKEN` |
| fal | fast image and video model hosting | product-photoshoot, video-ad-studio, motion-graphics-studio | fal.ai, dashboard, keys | `FAL_KEY` |
| ElevenLabs | voiceover, AI voices (with consent), dubbing | video-ad-studio, clip-repurposer, ai-influencer-farm | elevenlabs.io, profile, API keys | `ELEVENLABS_API_KEY` |

Optional: a tool registry such as treg, only if you already have your own account. Direct vendor APIs stay the default path.

## Keep spend safe
1. Set a hard monthly limit in each provider's billing page before you add the key.
2. Each agent's config.yaml has a per-run cap (for example images per batch); keep the defaults until you have seen a run.
3. Agents show an estimated cost before any batch generation and wait for a yes. Real prices: guides/costs.md.
4. Use a separate key per tool so you can revoke one without breaking others.

## Rules for generated media
- AI generated people and voices in ads carry the platform's AI label where the platform provides one (Meta, TikTok, YouTube all have them).
- Never clone a real person's face or voice without their signed consent. ElevenLabs voice cloning requires you to confirm rights.
- Product images must show the real product. Agents ground generation in your real product photos and reject outputs that change the product.

Sources: each provider's API docs and pricing pages (platform.openai.com/docs, docs.anthropic.com, ai.google.dev, docs.perplexity.ai, replicate.com/docs, docs.fal.ai, elevenlabs.io/docs), checked 11 Nov 2026.
