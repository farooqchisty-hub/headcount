Headcount agents are built to keep your accounts alive and your brand trusted. These rules are on by default. Some can be relaxed per action class in an agent's config.yaml; none can be relaxed globally.

## 1. Approval by default
- Anything public (posts, replies, reviews responses), paid (budgets, bids, creator fees) or sent (emails, DMs, proposals) waits for your yes.
- config.yaml may allow a named, bounded class, for example "pause ad sets with CPA above 2x target" or "reply to 5 star reviews with a thank you". Each allowance is logged every time it is used.
- Budget changes are capped by `daily_spend_change_limit_pct` in COMPANY.md.

## 2. Honesty and disclosure
- Claims only from COMPANY.md "We can say (with proof)". Never-say items are hard blocks.
- Community replies (Reddit, forums, comments) disclose affiliation ("I work at X" or "founder here").
- Paid creators, affiliates and gifted posts use the platform's paid partnership label or a clear #ad.
- AI personas (ai-influencer-farm) are labelled as AI in the bio and with platform AI labels on content. They never claim to be human, never give personal testimonials of using a product, and never impersonate a real person.
- No fake reviews, no review gating (asking only happy customers), no incentives for positive reviews.
- No vote manipulation, no sockpuppets, no buying followers, likes or engagement.

## 3. Platform rules agents follow
| Platform | Rules that matter |
|---|---|
| Meta | official Marketing and Graph APIs only; ads created paused; special ad categories declared (credit, employment, housing, politics); no personal attributes in ad copy ("Are you struggling with..."); comment and DM automation only inside Meta's messaging windows |
| Google Ads | no auto-apply without your yes; trademark terms in ads only with rights; healthcare and financial policies respected |
| X | automation rules: no automated mentions or replies to people who did not engage, no duplicate content across accounts, disclose automated accounts |
| LinkedIn | no browser bots or scraping of logged-in pages; agents draft, you post comments and DMs |
| Reddit | follow each subreddit's self-promotion rules; disclose; space replies out; never use multiple accounts |
| TikTok, YouTube | label AI generated realistic content; respect upload quotas; no reused content farms |
| Email and SMS | consent only, unsubscribe in every message, physical address, SPF, DKIM and DMARC, SMS quiet hours (CAN-SPAM, GDPR and PECR, CASL, TCPA) |
| Cold email (outbound-operator) | B2B only where lawful, real sender identity, opt out honoured within 1 business day, low daily volume per inbox, warmed domains separate from your main domain |

## 4. Rate limits
Every script backs off on HTTP 429 and platform throttling codes, and agents keep daily caps in config.yaml (posts per day, replies per hour, emails per inbox per day). Do not raise caps above platform guidance.

## 5. Data and keys
- Keys live in environment variables or a `.env` file outside git. Never in COMPANY.md, never in chat.
- Use read only keys where an agent only reads (Stripe restricted keys, Meta `ads_read`, GA4 Viewer).
- Customer personal data stays in your accounts. Agents export only what a step needs to `data/` and you can delete it.
- Enrichment (enrichment-waterfall, signal-prospector) uses providers that state a lawful basis; respect opt outs and GDPR rights requests.

## 6. Licences
Headcount bundles only MIT, Apache-2.0 or BSD code. AGPL tools (Firecrawl, Postiz) are used as separate services, never bundled. BSL licensed pipeboard meta-ads-mcp is not used. See LICENSES.md.

## 7. If something goes wrong
Stop schedules (guides/scheduling.md), revoke the key at the platform, check the agent's log for exactly what it did, and set the relevant config.yaml action class back to "ask".

Sources: FTC Endorsement Guides (16 CFR 255) and Consumer Reviews and Testimonials Rule (2024); Meta Advertising Standards and Platform Terms; Google Ads policies; X Automation rules; LinkedIn User Agreement section 8.2; Reddit Content Policy and self-promotion guidance; CAN-SPAM Act; GDPR; CASL; TCPA; YouTube and TikTok AI content labelling policies.
