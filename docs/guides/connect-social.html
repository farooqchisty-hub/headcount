Used by: social-autopilot, engagement-agent, dm-closer, reputation-guard, founder-brand-engine, clip-repurposer, trend-jacker, viral-reel-cloner, ai-influencer-farm, reddit-buying-signals, influencer-deal-desk, ugc-creator-finder, affiliate-recruiter.

Official APIs first. Agents never log in with your password, never use browser automation to post, and stay inside each platform's rate limits.

## Instagram (Graph API through Meta)
- Needs an Instagram professional account (Business or Creator) linked to a Facebook Page, plus a Meta app (see connect-meta.md).
- Permissions: `instagram_basic`, `instagram_content_publish` (posting), `instagram_manage_comments` (replies), `instagram_manage_messages` (DMs), `pages_show_list`, `pages_read_engagement`, `instagram_manage_insights` (stats). Messaging and comment permissions on accounts you do not own need App Review.
- Env vars: `IG_USER_ID`, `META_ACCESS_TOKEN`.
- Limits to respect: content publishing is capped per account per 24 hours (check the current number in the docs; it has been 50 to 100 posts). Private replies to comments must be sent within 7 days of the comment, and DMs follow Meta's 24 hour messaging window. dm-closer builds its funnels inside these rules.

## X (Twitter) API
- developer.x.com: create a project and app. Paid tiers decide read and post volume; the free tier is write mostly and very limited.
- OAuth 2.0 with PKCE (user context) scopes: `tweet.read`, `tweet.write`, `users.read`, `offline.access`; add `dm.read`, `dm.write` only for dm-closer.
- Env vars: `X_CLIENT_ID`, `X_CLIENT_SECRET`, `X_REFRESH_TOKEN` (or `X_BEARER_TOKEN` for read only).
- Automation rules: no bulk or automated replies to people who did not engage with you, no duplicate posts across accounts, label automated accounts.

## LinkedIn
- Personal posting: a LinkedIn app with "Share on LinkedIn" and "Sign In with LinkedIn using OpenID Connect" products. Scope `w_member_social` (post), `openid profile email`.
- Company page posting and stats: "Community Management API" product (needs approval), scopes `w_organization_social`, `r_organization_social`.
- Env vars: `LINKEDIN_CLIENT_ID`, `LINKEDIN_CLIENT_SECRET`, `LINKEDIN_ACCESS_TOKEN` (60 day token; refresh tokens only for approved partners).
- LinkedIn Ads (linkedin-ads-agent): the "Advertising API" product (manual approval), scopes `r_ads_reporting`, `rw_ads`, plus `LINKEDIN_AD_ACCOUNT_ID`. Every call sends `Linkedin-Version: YYYYMM` (202610 on 11 Nov 2026). Full setup in agents/linkedin-ads-agent/CONNECT.md.
- LinkedIn does not offer an API for comments on other people's posts or DMs for normal apps. engagement-agent drafts those for you to post by hand. Do not automate LinkedIn with browser bots: it breaks the User Agreement and gets accounts restricted.

## YouTube
- Google Cloud project (connect-google.md), enable YouTube Data API v3. Upload scope `youtube.upload`, read `youtube.readonly`, comments `youtube.force-ssl`.
- Default quota is 10,000 units a day; an upload costs about 1,600 units, so plan around 6 uploads a day unless you request more quota.
- Env vars: reuse `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`, plus a refresh token with YouTube scopes, `YOUTUBE_CHANNEL_ID`.
- Uploads from unverified API projects may be locked to private until the project passes an audit.

## TikTok
- developers.tiktok.com: Content Posting API (direct post requires an audit; until then posts are private to the account), Display API for stats. Research API is for academic access only.
- Env vars: `TIKTOK_CLIENT_KEY`, `TIKTOK_CLIENT_SECRET`, `TIKTOK_ACCESS_TOKEN`.

## Reddit
- reddit.com/prefs/apps: create a "script" app for personal use. Use a descriptive User-Agent, respect the free tier rate limit (100 queries per minute per OAuth client at the time of writing).
- Env vars: `REDDIT_CLIENT_ID`, `REDDIT_CLIENT_SECRET`. Agents use the read only app flow, so no Reddit password is ever stored, and you post replies yourself.
- reddit-buying-signals drafts disclosed replies; you post them. Read each subreddit's rules on self-promotion first.

## Schedulers (optional)
If you already use a scheduler with an API (Buffer, Later, Metricool, or self-hosted Postiz under AGPL as a separate service), social-autopilot can hand posts to it as drafts instead of posting directly.

Sources: developers.facebook.com/docs/instagram-platform (content publishing, comment moderation, messaging); docs.x.com (authentication, automation rules); learn.microsoft.com/linkedin (Share on LinkedIn, Community Management API); developers.google.com/youtube/v3/getting-started (quota costs); developers.tiktok.com/doc/content-posting-api-get-started; support.reddithelp.com (Data API terms, rate limits).
