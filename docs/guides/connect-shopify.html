Used by: catalog-optimizer, roas-autopilot (catalog and revenue truth), flow-architect, campaign-builder, winback-analyst, cro-test-runner, static-ad-factory (product photos), product-photoshoot, monday-standup.

## Shopify: custom app token (about 10 minutes)
1. Shopify admin, Settings, Apps and sales channels, Develop apps. Allow custom app development if asked.
2. Create an app (e.g. `Headcount`), Configure Admin API scopes. Pick only what your agents need:
   - read only reporting (monday-standup, winback-analyst): `read_orders`, `read_customers`, `read_products`; add `read_all_orders` if you need orders older than 60 days.
   - catalog edits (catalog-optimizer): add `write_products` (drafts first; it shows a diff before publishing).
   - discounts (campaign-builder, winback-analyst): `read_discounts`, `write_discounts`.
   - analytics (cro-test-runner): `read_analytics` (ShopifyQL where available).
3. Install the app, reveal the Admin API access token once, copy it.
4. Env vars: `SHOPIFY_STORE_DOMAIN` (`yourstore.myshopify.com`), `SHOPIFY_ADMIN_TOKEN`, `SHOPIFY_API_VERSION` (our scripts default to `2026-10`; Shopify releases a version each quarter and supports each for at least 12 months).
5. Test: `curl -s -X POST "https://$SHOPIFY_STORE_DOMAIN/admin/api/$SHOPIFY_API_VERSION/graphql.json" -H "X-Shopify-Access-Token: $SHOPIFY_ADMIN_TOKEN" -H "Content-Type: application/json" -d '{"query":"{shop{name currencyCode}}"}'`

Note: Shopify is moving custom app creation into the Dev Dashboard with client credentials for new apps. If your admin no longer offers "Develop apps", create the app in the Dev Dashboard and use the client ID and secret flow (GeLi2001/shopify-mcp supports both).

Rate limits: GraphQL Admin API uses a cost based leaky bucket; scripts read the `throttleStatus` and slow down.

## WooCommerce
WooCommerce, Settings, Advanced, REST API, Add key (Read for reporting, Read/Write for catalog edits). Env vars: `WOO_URL`, `WOO_CONSUMER_KEY`, `WOO_CONSUMER_SECRET`. Use HTTPS only.

## Stripe (SaaS, services, coaching)
Dashboard, Developers, API keys, Create restricted key: read on Charges, Customers, Subscriptions, Invoices; write on Payment Links only if ai-sales-closer should create links (it still asks before sending). Env var: `STRIPE_API_KEY` (an `rk_` key). Never use the secret `sk_` key with agents.

## MCP option
Shopify/Shopify-AI-Toolkit (MIT), GeLi2001/shopify-mcp (MIT). Stripe publishes an official MCP server; check its licence before enabling.

Sources: shopify.dev/docs/api/admin-graphql, shopify.dev/docs/api/usage/versioning, shopify.dev/docs/api/usage/access-scopes; woocommerce.github.io/woocommerce-rest-api-docs; docs.stripe.com/keys (restricted keys).
