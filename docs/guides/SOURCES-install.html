## Where files live when a skill runs without install.py (checked 11 Nov 2026)
Used by `scripts/hc_home.py`, the home rule copied into every agent.

| Claim | Source |
|---|---|
| Claude app chat runs code in "an isolated, sandboxed container"; created files are downloaded "directly from the conversation"; "Files remain available for download throughout your conversation" (nothing said about later chats); 30 MB per file; "Files in your projects are now accessible through Claude's computing environment while remaining in context" | support.claude.com/en/articles/12111783-create-and-edit-files-with-claude (fetched) |
| Paths in the chat sandbox: working files in `/home/claude`, files the user can download in `/mnt/user-data/outputs`, attached files in `/mnt/user-data/uploads`; outputs survive a container restart within the chat, `/home/claude` does not. **Not official**: third-party write-ups | dev.to/h1gbosn/inside-claudes-sandbox-what-happens-when-claudeai-creates-a-file-4gna; datastudios.org post on missing downloads and `/mnt/user-data/outputs` (search results, not opened) |
| Project files at `/mnt/project` are not reliable (reported missing or partial since early October 2026); attaching the file to the chat puts it in `/mnt/user-data/uploads` | claudeissues.com/issue/101501 and /issue/94659 (search results, not opened) |
| Cowork mounts the folder the user picks at `/sessions/<id>/mnt/<folder>` inside its VM; writes there land on the user's computer; nothing else on the computer is visible. **Not official** | deadneurons.substack.com "How Anthropic's Cowork actually works"; claudeissues.com/issue/37617, /issue/32538 (search results, not opened) |
| Cowork reads and writes local files in the folder you give it | claude.com/docs/cowork/overview (round 1) |

What we decided from this:
- Claude app chat: the home is `/mnt/user-data/outputs/headcount`, so COMPANY.md and reports can be downloaded. Nothing lasts to the next chat, so company-brain hands COMPANY.md back as a download for the Project, and agents read it from an attached file or the Project. The working folder (`/home/claude`) is not used: it cannot be downloaded and is not kept.
- Cowork: the picked folder is the home (detected from `/sessions/<id>/mnt/<folder>`, or `hc_home.py --init --here`).
- Claude Code and other local runtimes with no install.py (plugin installs): `~/headcount`, created and saved to `~/.headcount/config.json` by company-brain's first run.
- The sandbox paths come from third-party reports, so the rule falls back safely: if `/mnt/user-data/outputs` is missing it uses `~/headcount`, or the working folder when the home folder cannot be written.

## What we built on these facts
- `app-uploads/headcount-plugin.zip`: one plugin, all 42 skills, about 1,100 files and 3 MB, no `bin/`, passes `claude plugin validate`.
- `app-uploads/skills/<agent>.zip`: one skill per zip, folder at the top level, description at most 200 characters.
- `INSTALL-WITH-AI.md`: the paste-one-message path for Claude's Code tab, Claude Code and Codex. It runs `install.py --friendly`, which prints one plain line per step.
- Builder: `runtimes/claude-app/build_skill_zips.py` (`--check` re-verifies).
- `~/.headcount/config.json`: written by `install.py` (or by company-brain's first run, `hc_home.py --init`) with the Headcount home and each runtime's skills folder. Agents and their scripts read it, so the buyer never sets an environment variable or edits a shell profile (`HEADCOUNT_HOME` still overrides it). Our design, tested by installing into a throwaway home folder.
- ChatGPT exports: every agent's text files bundled into 8 knowledge files (under the 10 and 20 file caps reported above), with a per-GPT `KNOWLEDGE.md` and nothing dropped.
