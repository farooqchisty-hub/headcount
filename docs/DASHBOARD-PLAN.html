Goal: buyers never get a forwardable download link. Everything they bought lives behind an email + password login at `ecomagents.ai/headcount/app/`, tied to the purchase email. The dashboard is also our upsell surface: locked products, short product explainers, and one timed offer per session.

## 1. Accounts and login
- **Who can have an account:** only an email that has a paid order. The account is created by the payment, never by self sign-up.
- **First access:** the delivery email has no download links, only a one-time "Set your password" link (single use, expires in 24 h, re-sendable from the login page with "Email me a new link"). This proves they own the inbox.
- **Login:** email + password every time. Session cookie is HttpOnly, Secure, SameSite=Strict, ends after 12 h or when the browser closes. One session = one login.
- **Passwords:** PBKDF2-SHA256 via WebCrypto with a per-user salt (the Worker-safe standard), minimum 8 characters, checked against a short common-password list.
- **Protection:** rate limit per IP and per email, lockout after 8 bad tries for 15 min, Cloudflare Turnstile shown after 3 failures, "Forgot password" by emailed link, every login logged (time, IP, device).
- **Sharing control:** at most 2 active sessions per account; a third login signs out the oldest. Same account seen from more than 3 cities or 5 devices in a day raises an ops alert.

## 2. What is inside the dashboard
- **Home:** greeting, "Start here" (3 setup steps for their plan), what's new.
- **My products:** one card per owned product (Headcount agents, Crew Pro extras, Ecom Agent OS, Winning Statics bundle, AI Video Templates, Niche Brain Pack), each with its setup steps and a Download button.
- **Bonuses:** read and use in the browser (Rulebook, Swipe File, Hook Vault, scripts, outreach pack as built-in viewers; motion kit as a download). Viewing in the browser is harder to forward than a file.
- **Locked products:** every add-on and product they do not own, shown greyed with a lock. Tap to expand: a 3-line pitch, 3 to 6 visuals (the preview images we already have), what's inside, price, and one-tap Buy (email prefilled, Cashfree). Buying unlocks it instantly on the payment webhook.
- **Services:** brief forms and status for done-for-you work (ad creatives, video, install, Company Brain).
- **Account:** change password, sign out everywhere, order history, GST details.
- **Future products:** the catalog is data (a products table), so adding a new product = one catalog entry + one private file. It shows up as "Locked" for everyone and "Coming soon" if not yet on sale.

## 3. Downloads that resist sharing
- No public links. The Download button asks the API for a signed link valid for 5 minutes, tied to the session.
- Limits: 5 downloads per product per day per account; every download logged.
- **Watermarking:** the agent packs (the core product) are stamped per buyer at download: a licence file and a hidden ID in each agent's files carrying the buyer's email and order ID. Leaked copies can be traced. Very large media packs (walkthrough videos) are streamed, not stamped.
- Honest limit: anything that has to be installed in Claude or Codex must be downloaded at some point. Login, short links, limits and watermarks make sharing traceable and inconvenient, not impossible.

## 4. The once-per-session offer
- **When:** 2 minutes after login, once per session, never during checkout or a brief form.
- **What:** one product they don't own, 10% off, with a live 30-minute countdown.
- **Rotation:** we keep each buyer's offer history and pick the next unowned product in turn, so every session shows a different one.
- **The deadline is real:** the discount is held by the server for 30 minutes. A product's 10% offer is shown to the same buyer at most once every 30 days. So "ends in 30 minutes" is true. India's 2023 dark-pattern rules ban false urgency, and this design stays clear of it.
- **Close or buy:** "Not now" closes it for the session. "Buy" opens checkout at the discounted price.

## 5. Changes to what exists
- Delivery emails and lifecycle emails: replace download links with "Open your dashboard" or "Set your password". Offers in emails link to the dashboard's locked cards.
- Thank-you page after payment: "Check your inbox to set your password", plus a button to resend.
- Remove the old download-token links (no real buyers yet, so no migration).
- Slack alerts unchanged; add ops alerts for suspected account sharing.

## 6. Build and test
- **API (headcount-api Worker):** accounts, sessions, password set and reset, catalog, entitlements, signed downloads, watermarking, offers and rotation, admin commands. Storage in D1 `headcount-orders` (new migration), files in R2 `headcount-private`.
- **Dashboard (Pages, same design system):** login, set password, home, products, bonuses, locked cards with explainers, services, account, the offer pop-up.
- **Emails:** delivery and lifecycle updates.
- **Tests:** login and lockout, session limit, password reset, entitlement checks (no access to unowned files), link expiry, download limits, watermark present, offer rotation, single pop-up per session, discount expires at 30 minutes, buying unlocks instantly, phone (390 px) and desktop (1440 px) screens checked by eye.
- **Deploy:** same commands as now, with a new D1 migration.
