Headcount is 40 marketing agents, each owning one outcome, plus company-brain, which every agent reads. You run them inside the AI tool you already use. You bring your own API keys; nothing is sent, posted or spent without your yes.

## Minute 0 to 3: install
You need Python 3.8 or newer (`python3 --version`) and one of: Claude Code, OpenAI Codex, OpenClaw, Hermes Agent, or a ChatGPT plan that can create GPTs.

```
cd headcount
python3 install.py --runtime claude --agents all --dry-run   # shows what it will do
python3 install.py --runtime claude --agents all
```
Swap `claude` for `codex`, `openclaw`, `hermes` or `chatgpt`. For ChatGPT the installer writes one folder per agent in `dist/chatgpt/`; follow `runtimes/chatgpt/README.md` to create the GPTs.

The installer also creates your Headcount home at `~/headcount` (brain, logs, outputs). Add this line to your shell profile so every agent finds it:
```
export HEADCOUNT_HOME=~/headcount
```

## Minute 3 to 13: run company-brain (once)
```
cd ~/headcount
claude            # or codex, openclaw, hermes chat -s company-brain
```
Type: `Run company-brain. My website is https://yourbrand.com`

It reads your site, then interviews you for about 10 to 20 minutes: offer, prices, customer, voice samples, competitors, numbers (AOV, margin, CAC target), claims you can and cannot make, banned words, brand colours and fonts. Have ready: last month's revenue and AOV, your margin or product cost, your logo, three pieces of writing you like, ten customer reviews.

It writes `brain/COMPANY.md` and checks it. You can edit that file any time.

## Minute 13 to 15: pick your first 3 agents
Start with three. Add more once these run cleanly for a week.

| Business | First 3 | Why these first |
|---|---|---|
| Ecommerce | flow-architect, angle-miner, static-ad-factory | Missing email flows are the fastest money with no ad spend. Then real selling angles and ads built on them. Spending 3k+ a month on Meta? Add roas-autopilot and ad-account-watchdog next. |
| SaaS | ai-visibility-tracker, signal-prospector, outbound-operator | See how AI answers describe you, then reach accounts showing buying signals today with a reason to talk now. |
| Agency | monday-standup (agency mode), ad-account-watchdog, google-ads-waste-killer | Client reporting is the biggest weekly time sink; the watchdog and waste killer catch the money leaks clients notice. Run company-brain once per client. |
| Creator or coach | clip-repurposer, founder-brand-engine, dm-closer | Turn one long video into a week of posts, grow on X and LinkedIn in your voice, and turn comments into booked calls or sales. |
| Local business | reputation-guard, social-autopilot, google-ads-waste-killer | Reviews decide local choices; steady posting keeps you visible; local search ads leak money fast. No ads? Swap in seo-content-pipeline. |

For each one:
1. Open `agents/<agent>/README.md` and do its setup checklist (keys and costs are listed honestly).
2. Connect the platforms it needs with the guides in `guides/` (connect-meta.md, connect-google.md, connect-shopify.md, connect-esp.md, connect-social.md, connect-ai-models.md).
3. Run it once by hand: the README gives the exact first message.
4. Put it on a schedule (guides/scheduling.md) only after one good manual run.

## Then: Monday
Add monday-standup. Every Monday it reads every agent's log and your data and gives you one page: up to 4 numbers that moved, why, and what each agent does next.

## Good to know
- Approvals: agents draft; you say yes. Each agent's `config.yaml` lists what it may do alone (default: nothing public, paid or sent).
- Costs per run: `guides/costs.md`. Most agents cost cents to a few dollars per run in API fees.
- Platform rules: `guides/safety-and-platform-rules.md`. Read it before turning on social or outreach agents.
- How it all fits together: `HANDOFF.md`.
