Date: 11 Nov 2026. Scope: landing page + checkout for "Headcount" (40 installable AI marketing agents, one-time, INR 2,999 base, mobile-first, UPI/Razorpay).

Evidence quality note: almost every published conversion number comes from a vendor or agency. Treat figures below as planning ranges, not truths. "Verified" = page fetched on 11 Nov 2026. "Pattern" = known page structure from the category, re-check before copying.

Category takeaways
- Indian low-ticket pages (1, 4 to 10) win on: price in the CTA, strike-through, live proof counts, payment logos, WhatsApp delivery. They lose on product clarity; most never show the product.
- Global AI packs (13 to 17) win on: counts, one-time framing, runtime compatibility. They lose on outcome; they sell files, not results.
- Template empires (3, 18) win on: 2 tiers, bundle math, named testimonials, demo video, generous refund.
- Headcount should combine: Indian price mechanics + template-empire proof + a real product demo. Nobody in the Indian category shows the agent actually working on a phone screen. That is the gap.

What to plan for Headcount
- LP view to purchase on cold Meta: 1.0% to 2.0% at Rs 2,999 (higher than Rs 99 pages convert, but each buyer is 30x the value). Below 0.7% after 2,000 LP views = message match or price problem, not a creative problem.
- Bump take: plan 20%. OTO take: plan 8%. Blended AOV target: Rs 3,600 to 3,900 on a Rs 2,999 base.
- Break-even CPA check: at Rs 3,700 AOV and 1.5% LP CVR, max CPC to LP = Rs 55.

## 3. The recommended page

Format: long-form mobile page, text-first with a 60 to 90 second demo video (not a 20 minute VSL). Reason: buyers are casual ChatGPT/Claude users who need to SEE an agent work; a long VSL loses the 80%+ who never press play, and the VWO data says video helps only when it is short and the page still sells without it.

Width: designed at 375px. One column. Body 17px, H1 28 to 32px, line length under 40 characters on mobile. Page weight under 1.5 MB, LCP under 2.5s on 4G (Meta in-app browser is slow; every second costs).

### Above the fold spec (375 x 667, no scroll)

1. Top bar (32px): honest urgency line. "Launch price Rs 2,999 until 30 Nov. Then Rs 4,999." No fake timer. A real countdown to the real date is fine.
2. H1 (the ad's promise, word for word, see section 5).
3. Sub (1 line): "40 AI agents for ads, content, SEO, sales and email. Pay once. Yours forever."
4. Proof line: star row + "Used by X founders and D2C brands" (only real numbers; if zero at launch, use "Built from 2,000+ real ad and growth playbooks" type product truth instead of fake counts).
5. Hero visual: phone screenshot or 6 second autoplay muted loop of an agent producing a real output (ad brief, 10 hooks, SEO page) in ChatGPT/Claude. Not an abstract illustration.
6. Price + CTA block: "~~Rs 4,999~~ Rs 2,999 one-time (launch price)" with small "Rs 7,999 worth" value line, then button "Get all 40 agents for Rs 2,999". Under button: "UPI, cards, netbanking. Instant access on email + WhatsApp."
7. Runtime logo row: Claude Code, ChatGPT, Codex, OpenClaw, Hermes.

### Section by section wireframe

| # | Section | Purpose | Headline formula | Proof required |
|---|---|---|---|---|
| 0 | Hero (above) | Confirm the ad, state offer, first CTA | Ad hook restated: "[Outcome] without hiring [role]" | Real output visual, real count or product truth |
| 1 | Pain mirror | Make the reader nod | "You are the marketing team. And the sales team. And the content team." | 3 short pain lines in buyer words (from comments/DMs) |
| 2 | The swap (cost anchor) | Reframe price vs hiring | "One marketer costs Rs 40,000 a month. Headcount costs Rs 2,999 once." | Simple table: role, monthly cost in India, agent that covers it (cite salary source, e.g. Naukri/AmbitionBox) |
| 3 | Demo video 60 to 90s | Show, not tell | "Watch one agent write a week of ads in 4 minutes" | Unedited screen recording on a phone, timer visible |
| 4 | The 40 agents, by department | Make 40 scannable | "Your new team: 9 departments, 40 hires" | Grid of 9 cards (Ads, Creative, Viral, Social, SEO/GEO, Outbound, Creators, Lifecycle, Intel); tap to expand agent names + one-line outcome each |
| 5 | Before / after outputs | Prove output quality | "What you get on day 1" | 3 to 4 real outputs as images (ad brief, content calendar, cold email sequence, SEO brief) |
| 6 | How it works (3 steps) | Kill "too technical" fear | "Install in 10 minutes. No code." | Step 1 buy, Step 2 copy into ChatGPT/Claude, Step 3 type first command. Show the exact first message |

| 8 | Testimonials | Social proof | "Founders who hired Headcount" | Face + name + brand + city + specific result. Video testimonial from 1 Indian D2C founder beats 10 text quotes. Screenshot of WhatsApp messages works in India |

| 12 | FAQ (8 to 10) | Answer objections | Questions in buyer words | See list below |
| 13 | Final CTA | Close | Restate H1 + price + guarantee | Payment logos, launch date line |
| Sticky | Bottom bar (appears after hero scrolls out) | Always one tap away | "Rs 2,999 . Get Headcount" | Hide when pricing section is on screen to avoid double buttons |

FAQ objections to answer (in this order)
1. Do I need to know coding? (No. Show the first message you type.)
2. Does it work on free ChatGPT? (Be exact: which agents need paid plans or Claude Code.)
3. Is it monthly? (No. One payment. Updates included for 12 months.)
4. What extra costs are there? (API keys, with typical rupee ranges.)
5. How do I get it after paying? (Instant email + WhatsApp link, download in 1 minute.)
6. Is this just prompts? (No: each agent has a procedure, config, scripts, templates, examples. Show folder screenshot.)
7. Will it work for my niche (D2C, agency, creator, B2B)?
8. Can I use it for clients? (Only in Agency tier.)
9. Refund? (Guarantee terms.)
10. GST invoice? (Yes, enter GSTIN at checkout.)

### CTA rules
1. One action on the whole page: buy. No "book a call", no newsletter, no nav menu, no footer links except legal.
2. Button text = verb + what + price: "Get all 40 agents for Rs 2,999". Never "Submit" or "Buy now" alone.
3. CTA after hero, after demo, after agent grid, after testimonials, in pricing, at end. Plus sticky bar.
4. Button: full width on mobile, min 52px tall, brand colour that appears nowhere else on page.
5. Microcopy under every CTA: "One-time payment . UPI . Instant access".
6. Tier CTAs scroll to the same one-page checkout with the tier preselected; never send to a new site.

### Checkout flow (Razorpay, one page)

Step 1. LP CTA opens checkout on the same domain (or Razorpay payment page / Magic Checkout styled to brand). Fields: name, email, WhatsApp number. Optional collapsed "Add GSTIN". Nothing else.
Step 2. Order summary with tier and price, then the ORDER BUMP checkbox, then payment logos, then pay button. UPI intent (GPay, PhonePe, Paytm) first on mobile; cards and netbanking below.
Step 3. Payment success opens the ONE-TIME OFFER page. UPI has no true one-click charge, so make it one tap: contact details prefilled, amount prefilled, single "Add for Rs 1,999" button that fires a fresh UPI intent. Cards saved via Razorpay can be charged in one tap.
Step 4. If OTO declined: one downsell (half price, smaller version). Then thank-you page with download, WhatsApp community link, and the first command to type.
Step 5. Delivery: email + WhatsApp message within 60 seconds with download link and a 2 minute setup video. Abandoned checkout: WhatsApp nudge at 30 minutes, email at 24 hours (with consent captured at checkout).

Order bump (Rs 499, checkbox above pay button): "Add the Setup Kit: 40 ready-to-paste first commands + 2 hour video walkthrough of every department. Rs 499 (normally Rs 1,499)." Rule: bump must be cheap (10% to 25% of base), instantly useful, and related to getting value faster. Plan 20% take.

One-time offer (Rs 1,999, after payment): "Done-for-you install: we set up your top 5 agents on your brand in a 45 minute call, plus your brand brain file written for you." Or, for Solo/Team buyers, "Upgrade to Agency for Rs 3,000 more (only on this page)". Plan 8% take. Downsell: "Brand brain file only, Rs 999."

### Trust elements for India
- Razorpay badge + UPI/GPay/PhonePe/Paytm/Visa/Mastercard/RuPay logos near every price.
- GST invoice line ("GST invoice sent to your email").
- Registered business name, city, support WhatsApp number and email in footer. Indian buyers check for a real person.
- WhatsApp chat button (bottom left, not covering sticky CTA) answering pre-sale questions.
- Indian faces, names and cities in testimonials; rupee results ("saved Rs 60,000 a month on an agency").
- Founder photo and LinkedIn link.
- Refund, privacy, terms pages linked (also needed for Razorpay KYC and Meta ad review).
- No fake counters, no "only 20 slots left" on a digital file. Sharper buyers screenshot these and post them.

### Guarantee recommendation
7-day "Run it or refund" guarantee: "Install it and run any 3 agents. If they do not save you a week of work, WhatsApp us within 7 days for a full refund." 7 days (not 30) because files are instantly copyable; the "run 3 agents" condition filters out freeloaders while staying simple. Show it as a badge next to the price and as its own section. Expect refund requests in the 3% to 8% range; budget 5%. (Owner decision: if a no-refund policy is preferred, replace with a "setup guarantee": free install help on WhatsApp until it works. Do not show both.)

## 4. Pricing presentation (3 one-time tiers)

| | Solo | Team (default) | Agency |
|---|---|---|---|
| Price | Rs 1,499 | Rs 2,999 | Rs 5,999 |
| Strike-through (real post-launch price) | ~~Rs 2,499~~ | ~~Rs 4,999~~ | ~~Rs 9,999~~ |
| Agents | 1 department pack of your choice (4 to 6 agents) | All 40 agents, 9 departments | All 40 + client-use license |
| Updates | 3 months | 12 months | Lifetime + every new agent |
| Extras | | Setup guide + first commands | Brand brain setup template for 10 clients, white-label README, priority WhatsApp support |
| Badge | | "Most picked" | "For agencies and freelancers" |
| CTA | Get Solo for Rs 1,499 | Get all 40 for Rs 2,999 | Get Agency for Rs 5,999 |

Presentation rules
- Order on mobile: Team first (preselected, tallest card), then Agency, then Solo. Solo exists as a decoy that makes "all 40 for 2x the price" feel obvious.
- Show per-agent math only on Team: "Rs 75 per agent".
- Show hiring anchor above the cards: "A junior marketer in India: Rs 25,000 to 40,000 a month."
- Strike-through must be a price the product is actually sold at later (post-launch price) to be honest and defensible under Indian consumer law. Make Rs 4,999 the real post-launch Team price and show it as "after 30 Nov"; the Rs 7,999 "worth" anchor goes in the value stack, not as a fake previous price.
- Value stack (Hormozi style) directly above the cards: list each department with a rupee "worth", total "Rs 7,999 worth", then "Today Rs 2,999".
- Add-on placement:
  - On page: only the 3 tiers. No add-ons on the LP (they add decisions before the first yes).
  - Order bump (checkout): Setup Kit Rs 499.
  - OTO (post-payment): Done-for-you install Rs 1,999, or tier upgrade at the difference.
  - Downsell: Brand brain file Rs 999.
  - Later (email, day 3 and day 10): new agent packs, team training session.

## 5. Headlines and message match

### 10 headline options
1. Hire 40 AI marketers for Rs 2,999. Once.
2. Your marketing team, installed in 10 minutes.
3. Stop paying Rs 40,000 a month for marketing you can run yourself.
4. 40 AI agents that run your ads, content, SEO and sales. No monthly fee.
5. The AI marketing team for founders who are the marketing team.
6. Write a week of ads in 4 minutes. Then do SEO, email and outreach the same way.
7. You already use ChatGPT. Now give it a job.
8. Turn ChatGPT into a 40-person marketing department.
9. Every marketing hire a D2C brand needs. One payment. Zero salaries.
10. Agencies charge Rs 50,000 a month. This is Rs 2,999, forever.

### 5 Meta ad to LP message-match pairs
Rule: the LP H1 repeats the ad's hook almost word for word; the hero visual repeats the ad's visual; the price in the ad (if shown) is the price above the fold.

| # | Meta ad (hook + visual) | LP H1 + hero |
|---|---|---|
| 1 | Hook: "I fired my Rs 40,000 a month agency for a Rs 2,999 file." Visual: founder to camera, phone showing agent output | H1: "Stop paying Rs 40,000 a month for marketing you can run yourself." Hero: same phone output screen, same founder face in proof line |
| 2 | Hook: "Watch ChatGPT write 10 Meta ads in 4 minutes." Visual: screen recording, timer | H1: "Write a week of ads in 4 minutes." Hero: the same recording looped, timer visible |
| 3 | Hook: "Solo founder? You are the marketing team. Here are 40 hires." Visual: grid of 40 agent "employee cards" | H1: "Your marketing team, installed in 10 minutes." Hero: the same employee-card grid |
| 4 | Hook (agency angle): "How a 3-person agency delivers like 15." Visual: client dashboard + agents | H1: "40 AI agents for agencies. One license, every client." Land on page with Agency tier preselected (?tier=agency) |
| 5 | Hook (no-subscription angle): "Tired of Rs 2,000 a month AI tools? Pay once." Visual: cancelled subscription receipts vs one Rs 2,999 receipt | H1: "40 AI agents. Rs 2,999 once. No monthly plan." Hero: the single receipt + runtime logos |

Message-match checklist per ad set: same hook words, same visual, same price, same audience noun (founder / agency / creator), UTM drives tier preselect and testimonial order.
