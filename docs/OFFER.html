## Plans

| Plan | Price | Strike (real post-launch price) | What's in it | Role |
|---|---|---|---|---|
| Crew | Rs 2,999 | Rs 4,999 | All 40 agents, Company Brain, Monday Standup, installer for 5 apps, all guides, 12 months of updates | The ad price. Hero CTA. |
| Crew Pro | Rs 5,999 | Rs 9,999 | Crew + video walkthrough of every department, 200 ready commands by business type, client use for up to 10 brands, lifetime updates, 60 days priority WhatsApp | AOV lift. Agencies and freelancers. |
| Done With You | Rs 11,999 | Rs 19,999 | Crew Pro + 60-minute live install on their accounts, Company Brain written for them, top 5 agents set up and run, 30 days WhatsApp help | Removes "too technical". Feeds custom builds. |

Rules: no monthly plan anywhere. Strike-throughs must be prices actually charged after the launch date (Indian consumer law). Launch date is a CONFIG value in landing/index.html.

## Add-ons

| Where | Offer | Price | Expected take |
|---|---|---|---|
| Order bump (checkout checkbox) | Niche Brain Pack: 12 pre-filled Company Brain files by niche (skincare, fashion, supplements, food, home, SaaS, agency, coach, local) + 40 first commands | Rs 499 | about 20% |
| One-time offer 1 (after payment, Crew buyers) | Upgrade to Crew Pro for Rs 2,499 more (only on this page) | Rs 2,499 | about 10% |
| One-time offer 2 (if OTO 1 declined) | Done-for-you install: 45-minute call, top 5 agents set up on your brand | Rs 1,999 | about 8% |
| Downsell (if OTO 2 declined) | Company Brain written for you from a 15-minute form | Rs 999 | about 10% |
| Email day 3 | 50 done-for-you ad creatives from your website (run by us with Static Ad Factory) | Rs 2,999 | |
| Email day 10 | Custom agent built for one workflow of yours | Rs 14,999 | |
| Email day 14 (Pro buyers) | White-label licence: rebrand and resell agents to clients | Rs 9,999 | |
| Ongoing | New agent drop packs (5 agents per pack) | Rs 999 each | |

Target average order value: Rs 3,600 to 3,900 on Crew-led traffic.

## Guarantee (owner decision, pick one, never show both)
- A. "Run it or refund": run any 3 agents within 7 days; if they don't save a week of work, full refund on WhatsApp. Budget 5% refunds.
- B. "Setup guarantee": no refunds; free WhatsApp setup help until it works.
The landing page currently shows A.

## Before launch (blockers)
1. Real Razorpay payment links per plan into CONFIG.checkout in landing/index.html.
2. Real launch end date into CONFIG.launchEnds.
3. Footer: registered business name, city, WhatsApp, email; Terms, Privacy, Refund pages (Razorpay KYC + Meta ad review need them).
4. A 60 to 90 second unedited phone demo video for the hero (research: short demo beats long VSL).
5. Real testimonials only. The page has a marked slot; launch without it rather than with invented quotes.
6. Build the Niche Brain Pack and the Crew Pro video walkthrough before selling them.
