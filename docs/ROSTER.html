</style></head><body><nav><div class="w"><b>Headcount</b><a href="../index.html">Overview</a><a href="../index.html#agents">40 agents</a><a href="../index.html#pricing">Pricing</a><a href="../landing/index.html">Sales page</a><a href="../index.html#docs">Docs</a></div></nav><main class="w"><article class="doc" id="doc"></article><script type="text/markdown" id="md"># Headcount roster: 40 outcome-based agents, 9 departments

Rule: every agent is named and sold by the OUTCOME it owns, not the task it does.

| # | Dept | Agent (folder) | Outcome it owns |
|---|---|---|---|
| 1 | paid | roas-autopilot | Give it a ROAS target and a budget. It builds, launches and optimises Meta campaigns to hit it. |
| 2 | paid | google-ads-waste-killer | Cuts wasted Google Ads spend every week (negatives, RSA losers, feed, settings drift). |
| 3 | paid | ad-account-watchdog | No silent money leaks: catches auto-applied changes, hacks, spend spikes, disapprovals within the hour. |
| 4 | creative | angle-miner | A ranked bank of genuinely different selling arguments, mined from real customer language. |
| 5 | creative | static-ad-factory | Website URL in, 20 finished on-brand static ads out, grounded in real product photos. |
| 6 | creative | winner-remixer | Endless fresh creative from proven winners (yours and competitors' long-running ads). |
| 7 | creative | video-ad-studio | Finished 15 to 30 s AI video and UGC-style ads from an angle. |
| 8 | creative | product-photoshoot | Studio and lifestyle product imagery from phone photos. No shoot. |
| 9 | viral | viral-reel-cloner | Finds outlier reels in your niche, deconstructs why they won, remakes them for your brand. |
| 10 | viral | motion-graphics-studio | Branded motion-graphics reels and explainers made in code (HyperFrames/Remotion) from a brief. |
| 11 | viral | clip-repurposer | One long video in, 10 captioned clips + newsletter + posts out. |
| 12 | viral | trend-jacker | Same-day content on trending formats, audio and news in your niche. |
| 13 | viral | founder-brand-engine | Grows the founder's audience on X and LinkedIn from their real stories, in their voice. |
| 14 | social | engagement-agent | Engages on your behalf: strategic comments and replies that grow reach, under rate limits and approval rules. |
| 15 | social | dm-closer | Turns comments and DMs into sales (comment-to-DM keyword funnels, qualification, offer, checkout link). |
| 16 | social | ai-influencer-farm | Creates, launches and grows a roster of disclosed AI influencer personas that promote your products. |
| 17 | social | social-autopilot | Plans, schedules, posts and learns: doubles down on what performs across platforms. |
| 18 | social | reputation-guard | Every review and brand mention answered; complaints escalated; themes fed back. |
| 19 | search | seo-content-pipeline | Ranking articles with no cleanup, plus refresh of decaying pages. |
| 20 | search | programmatic-seo | Hundreds of data-unique pages on a proven keyword pattern. |
| 21 | search | technical-seo-fixer | Ranking blockers found and fixed (PRs or dev tickets). |
| 22 | search | ai-visibility-tracker | Your share of voice in ChatGPT, Claude, Perplexity, Gemini, tracked weekly. |
| 23 | search | geo-citation-closer | Gets you cited by AI engines: listicles, forums, comparison pages, crawler fixes. |
| 24 | search | backlink-builder | Earns real links: journalist requests, unlinked mentions, broken links, link-bait assets, guest posts. |
| 25 | search | catalog-optimizer | Every product page and feed title rewritten for search and conversion. |
| 26 | pipeline | reddit-buying-signals | Finds Reddit threads with buying intent and drafts ready-to-post, disclosed replies. |
| 27 | pipeline | signal-prospector | Accounts showing buying signals today, scored and with a "why now". |
| 28 | pipeline | enrichment-waterfall | Verified contacts at provider cost (BYOK Clay alternative). |
| 29 | pipeline | outbound-operator | Booked meetings from signal-led cold email, replies handled, angles learned. |
| 30 | pipeline | ai-sales-closer | Closes deals: qualifies inbound, follows up, handles objections, sends proposal and payment link. |
| 31 | pipeline | abm-personalizer | Target accounts each see ads and pages made for them. |
| 32 | creators | ugc-creator-finder | A vetted shortlist of UGC creators for your brand, briefed, priced and contracted. |
| 33 | creators | influencer-deal-desk | Influencer posts bought at a fair CPM, tracked to sales. |
| 34 | creators | affiliate-recruiter | A growing affiliate roster recruited from people already ranking for your category. |
| 35 | lifecycle | flow-architect | Missing email/SMS flows found and built; flow revenue up. |
| 36 | lifecycle | campaign-builder | The month's campaigns planned and built in your ESP, ready to schedule. |
| 37 | lifecycle | winback-analyst | Lapsing customers won back, proven with a holdout. |
| 38 | intel | competitor-watch | Every competitor move caught the same day; weekly brief. |
| 39 | intel | monday-standup | One page every Monday: what moved, why, what each agent does next. |
| 40 | intel | cro-test-runner | Conversion lifts shipped through real, statistically valid A/B tests. |
| + | core | company-brain | Interviews you once; writes the memory every agent reads. Included in every plan. |
