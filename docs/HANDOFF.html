For whoever runs Headcount day to day: an owner, a marketer or an agency account lead. Read this once; it explains how the system is organised, where everything is written (including the growth ledger, the one database of every agent action), how agents run on schedules and hand work to each other, and how to add a new agent.

## 1. How the system is organised

```
headcount/                      the package (this repo)
  install.py                    puts agents into Claude Code, Codex, OpenClaw, Hermes or ChatGPT
  agents/<agent>/               42 agents (40 plus the core company-brain and growth-ledger), each a self-contained skill
    SKILL.md                    the operating procedure the AI follows
    README.md  CONNECT.md       human guide, keys needed
    config.yaml                 every threshold you may change
    mcp.json                    optional MCP servers
    references/ scripts/ examples/ templates/
  runtimes/                     runtime-specific packaging (Claude plugin, Codex AGENTS.md, GPT builder)
  guides/                       how to connect each platform, schedule, safety, costs

~/headcount/                    your Headcount home (created by install.py; set HEADCOUNT_HOME to move it)
  brain/COMPANY.md              the shared memory every agent reads first
  brain/clients/<slug>/         agency mode: one brain per client
  brain/assets/ brain/proof/    logo, product photos, proof files for claims
  logs/<agent>.md               one log per agent, appended every run
  data/                         pulled numbers and exports (data/<agent area>/...)
  outputs/<agent>/              finished deliverables other agents read (e.g. outputs/angle-miner/latest.json)
  work/<agent>/                 scratch and intermediate files
  reports/<agent>/              human reports (reports/standup/2026-11-09.md)
  ledger/headcount.db           the growth ledger: every agent action, run, approval and key metric (SQLite, created by install.py)
  AGENTS.md                     Codex only: house rules for this folder
```

Always start your AI tool from the Headcount home (`cd ~/headcount`). Agents resolve the home as: `$HEADCOUNT_HOME`, then the working directory if it has `brain/`, then `../../` from the skill folder (install.py links `<skills dir>/../brain` to your brain), then `~/headcount`.

## 2. The three rules every agent follows
1. Read `brain/COMPANY.md` first. No brain, no run: the agent sends you to company-brain.
2. Nothing public, paid or sent without your yes. An agent's `config.yaml` may allow a named action class (for example "pause ad sets with CPA over 2x target"), never everything.
3. Log every run to `logs/<agent>.md` in the standard format (below), and record each change, number and run in the growth ledger (section 3). monday-standup reads both.

## 3. Logs
Format (field names matter; the standup parser reads them):
```
## 2026-11-07 roas-autopilot
- Ran: daily optimisation
- Changed: paused 2 prospecting ad sets with CPA over 1.5x target (approved by owner)
- Numbers: spend=209; roas=1.41; cpa=29.80
- Next: launch 4 new angle tests Tuesday
```
- "Changed: none" when nothing changed. Anything waiting for you contains "waiting for approval" so it lands in the standup's "Needs your yes".
- Logs are append only. Archive yearly (`logs/archive/2026/`) if they get long.
- Check what an agent did: open its log. Check what everything did: read Monday's standup.

### The growth ledger
Every agent's Log section also tells it to call `../growth-ledger/scripts/ledger.py` from its own skill folder (install.py keeps all agents side by side, so that path always resolves):
- `log-action` for each change: agent, action, object (`platform:type:id`), before, after, reason, approved by (a name, `band:<rule>`, or `none`), cost of the action in USD.
- `log-metric` for each number (base amounts only: spend, conversions, revenue; ratios are computed).
- `log-run` once per run; `log-approval` for each ask and each yes or no.
The file is `<home>/ledger/headcount.db`. Ask it anything: `python3 ~/.claude/skills/growth-ledger/scripts/ledger.py query "SELECT ts, agent, action, object, before, after, approved_by FROM agent_actions ORDER BY ts DESC LIMIT 20"`, or connect its read only MCP server to Claude Code, Codex, Cursor, OpenClaw or Hermes (agents/growth-ledger/CONNECT.md). `ledger.py verify` proves no action row was edited or deleted (hash chain). `ledger.py dashboard` writes one HTML page: spend, revenue, ROAS, actions per agent, before and after of every budget change, a timeline. Backfill older markdown logs once with `ledger.py import-standup`.
If an agent runs where the ledger is not installed it skips those calls; the markdown log stays complete either way.

## 4. Schedules
Recommended cadence (times in your brain timezone). Full setup per runtime in guides/scheduling.md.

| Cadence | Agents |
|---|---|
| Hourly | ad-account-watchdog |
| Daily | roas-autopilot, linkedin-ads-agent (09:00 loop), reputation-guard, engagement-agent (queue build), dm-closer, reddit-buying-signals, signal-prospector, trend-jacker, competitor-watch (changes), backlink-builder (journalist requests), ai-sales-closer (follow-ups), outbound-operator (reply handling) |
| Weekly (Monday) | monday-standup 07:00 (runs after the others' Sunday night jobs), growth-ledger 07:30 (dashboard and verify), linkedin-ads-agent (weekly verdict, ABM refresh), google-ads-waste-killer, ai-visibility-tracker, winner-remixer, social-autopilot (plan), founder-brand-engine (plan), competitor-watch (brief), cro-test-runner (read tests) |
| Weekly (other day) | angle-miner (Tuesday), static-ad-factory (Tuesday after angle-miner), seo-content-pipeline, geo-citation-closer, viral-reel-cloner, influencer-deal-desk, ugc-creator-finder, affiliate-recruiter |
| Monthly | campaign-builder (plan next month by the 20th), flow-architect (audit), technical-seo-fixer, catalog-optimizer, programmatic-seo (batch), winback-analyst (holdout read), enrichment-waterfall (list refresh) |
| On demand | company-brain, growth-ledger (questions), video-ad-studio, product-photoshoot, motion-graphics-studio, clip-repurposer, ai-influencer-farm |

Scheduled runs still stop at approvals. A scheduled agent drafts, logs "waiting for approval" and moves on.

## 6. Agency mode
- One brain per client: `brain/clients/<slug>/COMPANY.md` (company-brain agency mode).
- Per-client data and logs: `data/clients/<slug>/`, `logs/clients/<slug>/`. Name the client in every request ("run roas-autopilot for acme-pets").
- monday-standup `--all-clients` writes one page per client plus an index.
- Never let a run read one client's brain while writing to another's outputs. If a request names no client, the agent asks.

## 7. Adding a new agent
1. Copy an existing agent folder as a start: `cp -r agents/monday-standup agents/<new-name>` and clear it.
2. Follow PACKAGE-SPEC.md exactly: SKILL.md (frontmatter `name` equals folder name, `description` under 300 characters naming the outcome and when to use it), README.md, CONNECT.md, config.yaml, mcp.json, references/ (2 to 5), scripts/ (stdlib, `--help`, `--dry-run`, keys from env), examples/, templates/.
3. Name it by the outcome it owns, not the task.
4. Add its log format (section 3), the one-line growth ledger call at the end of its Log section (copy it from any agent; change the agent name), and its Hand-offs: which files it writes to `outputs/` and who reads them. Add a row to the map above and to the owners map in `agents/monday-standup/config.yaml` if it moves a tracked metric.
5. Test: `python3 install.py --list` (it must appear as installable), every script with `--dry-run`, then `python3 install.py --runtime claude --agents <new-name> --dry-run`, and `python3 runtimes/chatgpt/build_gpts.py --agents <new-name> --dry-run` (instructions under 8000 characters).
6. Check: `grep -rn $'\u2014\|\u2013' agents/<new-name>` (em and en dashes, U+2014 and U+2013) returns nothing; no keys in any file.
7. Add it to LICENSES.md if it points to or bundles any third-party repo.

## 8. Updating
- `git pull` in the package, then rerun the same install command (it replaces folders it installed, never yours). With `--mode link` there is nothing to rerun.
- Your brain, logs, outputs and ledger live in the Headcount home and are never touched by install or uninstall. A newer ledger schema is applied by install.py (or `ledger.py init`); rows are never removed.

## 9. When something goes wrong
- Agent says the brain is missing: run from the Headcount home or set HEADCOUNT_HOME.
- Agent cannot reach an API: run its `scripts/check_setup.py` (where present) and see its CONNECT.md.
- An agent did something you did not expect: read its log or ask the ledger (`ledger.py query "SELECT * FROM agent_actions WHERE agent = '<agent>' ORDER BY ts DESC LIMIT 10"`), then its config.yaml approval settings. Set the action class back to "ask".
- Something posted or spent without approval: stop the schedule (guides/scheduling.md), revoke the key at the platform, then review the agent's config.yaml.
